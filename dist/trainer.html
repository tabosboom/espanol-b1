:"comer","ex":"Same subject: después de + infinitive.","en":"After eating, I sleep for a bit."},{"id":"g2-114","type":"gapBank","q":"Aunque ___ poco dinero, viajamos mucho. (a fact)","a":["tenemos"],"bank":["tenemos","tengamos","tener","tuviéramos"],"ex":"Aunque + known fact: indicative.","en":"Although we have little money, we travel a lot."},{"id":"g2-115","type":"gapBank","q":"Hablo despacio para que me ___ .","a":["entiendas"],"bank":["entiendas","entiendes","entender","entendí"],"ex":"Para que + subjunctive.","en":"I speak slowly so that you understand me."},{"id":"g2-116","type":"gapBank","q":"Cuando ___ mayor, viviré en la costa.","a":["sea"],"bank":["sea","soy","seré","ser"],"ex":"Cuando + future idea: subjunctive.","en":"When I'm older, I'll live on the coast."},{"id":"g2-117","type":"tiles","q":"When I arrive, I'll call you","a":"Cuando llegue, te llamo","distractors":["llego"],"ex":"Cuando + future idea: subjunctive."}]},{"id":"g3","title":"Imperative","rule":{"intro":"Your tú and vosotros commands are fine. Practise the usted forms. They use the subjunctive endings, and reflexive pronouns go on the end of positive commands and before negative ones.","points":[{"title":"Usted","examples":[["Complete, Utilice, Coja, Venga","-ar takes -e; -er and -ir take -a"],["No utilice, No complete","the negative has the same form"]]},{"title":"Usted with a reflexive","examples":[["Siéntese, Preocúpese","positive: pronoun on the end, plus accent"],["No se siente, No se preocupe","negative: pronoun in front"]]},{"title":"Tú and vosotros","examples":[["Habla, Come, Ven, Haz, Sal","positive tú"],["No hables, No vengas","negative tú uses the subjunctive"],["Hablad, Venid; No habléis","vosotros"]]},{"title":"Pronouns","examples":[["Dímelo, Tráigamelo","positive: joined on the end"],["No me lo digas","negative: in front"]]}],"watch":"From your exam: Completa → Complete, No utilize → No utilice, Utiliza → Utilice, No preocupese → No se preocupe, Preocupase → Preocúpese."},"items":[{"id":"g3-001","type":"gap","q":"(usted) ___ todos los campos del formulario. (completar)","a":"Complete","ex":"usted of -ar verbs takes -e.","en":"Fill in all the fields of the form.","fromMistake":true},{"id":"g3-002","type":"gap","q":"(usted) No ___ el móvil aquí. (utilizar)","a":"utilice","ex":"z→c before e: no utilice.","en":"Don't use your phone here.","fromMistake":true},{"id":"g3-003","type":"gap","q":"(usted) ___ la salida de la izquierda. (utilizar)","a":"Utilice","ex":"usted of utilizar: utilice.","en":"Use the exit on the left.","fromMistake":true},{"id":"g3-004","type":"gap","q":"(usted) No se ___ , todo va bien. (preocupar)","a":"preocupe","ex":"Negative: no se preocupe.","en":"Don't worry, everything's going well.","fromMistake":true},{"id":"g3-005","type":"gap","q":"(usted) ___ por su salud. (preocuparse)","a":"Preocúpese","ex":"Positive: pronoun on the end, plus accent.","en":"Take care of your health.","fromMistake":true},{"id":"g3-006","type":"mc","q":"(usted) ___ todos los campos, por favor.","opts":["Complete","Completa","Completad"],"c":0,"ex":"Usted: complete. «Completa» is tú.","en":"Fill in all the fields, please.","fromMistake":true},{"id":"g3-007","type":"mc","q":"(usted) No ___ este ascensor.","opts":["utilice","utilize","utiliza"],"c":0,"ex":"Spelling: z→c before e.","en":"Don't use this lift.","fromMistake":true},{"id":"g3-008","type":"mc","q":"(usted) ___ , no pasa nada.","opts":["No se preocupe","No preocupese","No se preocupa"],"c":0,"ex":"Negative: pronoun in front.","en":"Don't worry, it's nothing.","fromMistake":true},{"id":"g3-009","type":"spot","q":"Señor, completa el formulario, por favor.","wrong":1,"a":"complete","opts":["complete","Completad","Completo"],"full":"Señor, complete el formulario, por favor.","ex":"Usted of completar: complete.","en":"Sir, fill in the form, please.","fromMistake":true},{"id":"g3-010","type":"spot","q":"Señora, no utilize la puerta principal.","wrong":2,"a":"utilice","opts":["utilice","utiliza","utilizas"],"full":"Señora, no utilice la puerta principal.","ex":"z→c before e: utilice.","en":"Madam, don't use the main door.","fromMistake":true},{"id":"g3-011","type":"tiles","q":"Don't worry (usted)","a":"No se preocupe","distractors":["preocupese","te"],"ex":"Negative usted: pronoun in front.","fromMistake":true},{"id":"g3-012","type":"tiles","q":"Use the stairs (usted)","a":"Utilice las escaleras","distractors":["Utiliza","Usa"],"ex":"utilizar → utilice for usted.","fromMistake":true},{"id":"g3-013","type":"mc","q":"(usted) ___ , por favor.","opts":["Siéntese","Siéntate","Se siente"],"c":0,"ex":"Positive usted: siéntese.","en":"Sit down, please."},{"id":"g3-014","type":"mc","q":"(usted) No ___ , hay tiempo.","opts":["se levante","levántese","te levantes"],"c":0,"ex":"Negative: pronoun in front.","en":"Don't get up, there's time."},{"id":"g3-015","type":"mc","q":"(usted) ___ la primera calle a la derecha.","opts":["Coja","Coge","Cogéis"],"c":0,"ex":"coger: g→j for usted: coja.","en":"Take the first street on the right."},{"id":"g3-016","type":"mc","q":"(usted) ___ aquí mañana.","opts":["Venga","Ven","Viene"],"c":0,"ex":"venir → venga for usted.","en":"Come here tomorrow."},{"id":"g3-017","type":"mc","q":"(usted) ___ la cuenta, por favor.","opts":["Tráigame","Tráeme","Traes"],"c":0,"ex":"traer → traiga + me.","en":"Bring me the bill, please."},{"id":"g3-018","type":"mc","q":"(usted) ___ , no hay prisa.","opts":["Espere","Espera","Esperad"],"c":0,"ex":"-ar takes -e: espere.","en":"Wait, there's no hurry."},{"id":"g3-019","type":"mc","q":"(usted) ___ todo recto.","opts":["Siga","Sigue","Seguid"],"c":0,"ex":"seguir → siga for usted.","en":"Go straight on."},{"id":"g3-020","type":"mc","q":"(usted) ___ esto, por favor.","opts":["Firme","Firma","Firmad"],"c":0,"ex":"-ar takes -e: firme.","en":"Sign this, please."},{"id":"g3-021","type":"mc","q":"(ustedes) ___ , por favor.","opts":["Pasen","Pasad","Pasan"],"c":0,"ex":"ustedes: pasen.","en":"Come in, please."},{"id":"g3-022","type":"mc","q":"(ustedes) No ___ aquí.","opts":["aparquen","aparcan","aparquéis"],"c":0,"ex":"c→qu before e.","en":"Don't park here."},{"id":"g3-023","type":"gap","q":"(usted) ___ a la izquierda. (girar)","a":"Gire","ex":"-ar takes -e.","en":"Turn left."},{"id":"g3-024","type":"gap","q":"(usted) ___ la calle. (cruzar)","a":"Cruce","ex":"z→c before e.","en":"Cross the street."},{"id":"g3-025","type":"gap","q":"(usted) ___ el billete. (sacar)","a":"Saque","ex":"c→qu before e.","en":"Get the ticket."},{"id":"g3-026","type":"gap","q":"(usted) ___ con tarjeta. (pagar)","a":"Pague","ex":"g→gu before e.","en":"Pay by card."},{"id":"g3-027","type":"gap","q":"(usted) ___ la ventana. (abrir)","a":"Abra","ex":"-ir takes -a.","en":"Open the window."},{"id":"g3-028","type":"gap","q":"(usted) ___ este documento. (leer)","a":"Lea","ex":"-er takes -a.","en":"Read this document."},{"id":"g3-029","type":"gap","q":"(usted) ___ tranquilo. (estar)","a":"Esté","ex":"estar → esté.","en":"Stay calm."},{"id":"g3-030","type":"gap","q":"(usted) ___ al hospital. (ir)","a":"Vaya","ex":"ir → vaya.","en":"Go to the hospital."},{"id":"g3-031","type":"gap","q":"(usted) ___ puntual. (ser)","a":"Sea","ex":"ser → sea.","en":"Be on time."},{"id":"g3-032","type":"gap","q":"(usted) ___ aquí. (sentarse)","a":"Siéntese","ex":"e→ie, pronoun on the end, plus accent.","en":"Sit here."},{"id":"g3-033","type":"gap","q":"(usted) No se ___ . (sentar)","a":"siente","ex":"Negative: no se siente.","en":"Don't sit down."},{"id":"g3-034","type":"gap","q":"(usted) ___ a las ocho. (levantarse)","a":"Levántese","ex":"Pronoun on the end, plus accent.","en":"Get up at eight."},{"id":"g3-035","type":"gap","q":"(tú) ___ aquí ahora mismo. (venir)","a":"Ven","ex":"Irregular tú: ven.","en":"Come here right now."},{"id":"g3-036","type":"gap","q":"(tú) ___ los deberes. (hacer)","a":"Haz","ex":"Irregular tú: haz.","en":"Do your homework."},{"id":"g3-037","type":"gap","q":"(tú) ___ de aquí. (salir)","a":"Sal","ex":"Irregular tú: sal.","en":"Get out of here."},{"id":"g3-038","type":"gap","q":"(tú) ___ la mesa, por favor. (poner)","a":"Pon","ex":"Irregular tú: pon.","en":"Set the table, please."},{"id":"g3-039","type":"gap","q":"(tú) No ___ tarde. (llegar)","a":"llegues","ex":"Negative tú uses the subjunctive.","en":"Don't arrive late."},{"id":"g3-040","type":"gap","q":"(vosotros) ___ la puerta. (cerrar)","a":"Cerrad","ex":"Vosotros: infinitive -r → -d.","en":"Close the door."},{"id":"g3-041","type":"gap","q":"(vosotros) No ___ la puerta. (cerrar)","a":"cerréis","ex":"Negative vosotros uses the subjunctive.","en":"Don't close the door."},{"id":"g3-042","type":"gap","q":"(vosotros) ___ pronto. (venir)","a":"Venid","ex":"Vosotros: venid.","en":"Come soon."},{"id":"g3-043","type":"gapBank","q":"(tú) ___ la verdad y no ___ mentiras.","a":["Di","digas"],"bank":["Di","digas","Dices","dices","Digas"],"ex":"Positive: di. Negative: no digas.","en":"Tell the truth and don't tell lies."},{"id":"g3-044","type":"gapBank","q":"(usted) ___ la maleta y ___ aquí.","a":["Deje","espere"],"bank":["Deje","espere","Deja","espera"],"ex":"Usted: deje, espere.","en":"Leave the suitcase and wait here."},{"id":"g3-045","type":"gapBank","q":"(tú) No ___ el móvil en la mesa.","a":["dejes"],"bank":["dejes","dejas","deja","deje"],"ex":"Negative tú: no dejes.","en":"Don't leave your phone on the table."},{"id":"g3-046","type":"tf","q":"(usted) Siéntate aquí, por favor.","a":false,"ex":"Siéntate is tú; usted is siéntese.","en":"Sit here, please.","full":"Siéntese aquí, por favor."},{"id":"g3-047","type":"tf","q":"(usted) No se preocupe.","a":true,"ex":"Correct negative usted form.","en":"Don't worry."},{"id":"g3-048","type":"tf","q":"(tú, a command) No vienes tarde.","a":false,"ex":"Negative tú uses the subjunctive.","en":"Don't come late.","full":"No vengas tarde."},{"id":"g3-049","type":"tf","q":"(vosotros) No habléis tan alto.","a":true,"ex":"Correct negative vosotros form.","en":"Don't talk so loudly."},{"id":"g3-050","type":"gap","q":"(tú) No me lo ___ , no quiero saberlo. (decir)","a":"digas","ex":"Negative: pronouns in front.","en":"Don't tell me, I don't want to know."},{"id":"g3-051","type":"gap","q":"(tú) ___ ahora mismo. (decir + me + lo)","a":"Dímelo","ex":"Positive: joined on the end, plus accent.","en":"Tell me right now."},{"id":"g3-052","type":"gap","q":"(usted) ___ , por favor. (traer + me + lo)","a":"Tráigamelo","ex":"Positive: joined on the end, plus accent.","en":"Bring it to me, please."},{"id":"g3-053","type":"gap","q":"(usted) No ___ traiga. (me + lo)","a":"me lo","ex":"Negative: pronouns in front.","en":"Don't bring it to me."},{"id":"g3-054","type":"mc","q":"(tú) ___ la sal, por favor.","opts":["Pásame","Me pasa","Pasarme"],"c":0,"ex":"Positive tú: joined pronoun.","en":"Pass me the salt, please."},{"id":"g3-055","type":"mc","q":"(tú) No ___ eso.","opts":["me digas","dime","dímelo"],"c":0,"ex":"Negative: pronoun in front.","en":"Don't tell me that."},{"id":"g3-056","type":"spot","q":"(tú) Dilome ahora.","wrong":1,"a":"Dímelo","opts":["Dímelo","Dímilo","Dimelo"],"full":"(tú) Dímelo ahora.","ex":"Positive: pronouns joined on the end.","en":"Tell it to me now."},{"id":"g3-057","type":"spot","q":"(usted) No preocúpese por nada.","wrong":2,"a":"se preocupe","opts":["se preocupe","preocupe","te preocupes"],"full":"(usted) No se preocupe por nada.","ex":"Negative: pronoun in front, no accent.","en":"Don't worry about anything."},{"id":"g3-058","type":"tiles","q":"Tell it to me now (tú)","a":"Dímelo ahora","distractors":["Me","lo"],"ex":"Pronouns join the positive imperative."},{"id":"g3-059","type":"tiles","q":"Bring it to me (usted), please","a":"Tráigamelo, por favor","distractors":["Tráemelo"],"ex":"traer → traiga, plus me + lo."},{"id":"g3-060","type":"type","q":"Sit down, please. (usted)","a":"Siéntese, por favor","ex":"Pronoun on the end, plus accent."},{"id":"g3-061","type":"type","q":"Don't worry. (usted)","a":"No se preocupe","ex":"Pronoun in front."}]},{"id":"g4","title":"Connectors","rule":{"intro":"Connectors link ideas, and some of them change the punctuation. Aunque joins two clauses in one sentence. Sin embargo starts a new clause after a semicolon or full stop.","points":[{"title":"Although, however","examples":[["Aunque llovía, salimos.","aunque joins clauses"],["Llovía; sin embargo, salimos.","sin embargo, with ; before and a comma after"],["A pesar de la lluvia, salimos.","a pesar de + noun or infinitive"]]},{"title":"While, whereas","examples":[["Mientras limpias, yo cocino.","mientras: at the same time"],["Yo cocino, mientras que tú limpias.","mientras que: contrast"]]},{"title":"Because, so","examples":[["Ya que estás aquí, ayúdame.","ya que, como: cause first"],["Como llueve, no salgo.","como always comes first"],["No salgo porque llueve.","porque comes in the middle"],["Llueve, así que no salgo.","así que, por eso, por lo tanto: result"]]},{"title":"And also","examples":[["Además, es barato.","además: on top of that"],["Incluso mi madre vino.","incluso: even"],["A mí me gusta; en cambio, a él no.","en cambio: on the other hand"]]}],"watch":"From your exam: «; aunque empezó a llover» → «; sin embargo, empezó a llover». «Sin embargo, el viaje fue largo, disfrutamos» → «Aunque el viaje fue largo, disfrutamos». «Mientras que tú limpias» → «Mientras tú limpias». Además has an accent."},"items":[{"id":"g4-001","type":"mc","q":"Quería salir a correr; ___ , empezó a llover.","opts":["sin embargo","aunque","mientras"],"c":0,"ex":"After a semicolon, use sin embargo.","en":"I wanted to go for a run; however, it started to rain.","fromMistake":true},{"id":"g4-002","type":"mc","q":"___ el viaje fue largo, disfrutamos mucho.","opts":["Aunque","Sin embargo","Mientras que"],"c":0,"ex":"Aunque joins two clauses in one sentence.","en":"Although the trip was long, we enjoyed it a lot.","fromMistake":true},{"id":"g4-003","type":"mc","q":"___ tú limpias, yo voy a comprar.","opts":["Mientras","Mientras que","Sin embargo"],"c":0,"ex":"Mientras = while, at the same time.","en":"While you clean, I'll go shopping.","fromMistake":true},{"id":"g4-004","type":"spot","q":"Quería salir; aunque, empezó a llover.","wrong":2,"a":"sin embargo,","opts":["sin embargo,","mientras,","además,"],"full":"Quería salir; sin embargo, empezó a llover.","ex":"After a semicolon, use sin embargo.","en":"I wanted to go out; however, it started to rain.","fromMistake":true},{"id":"g4-005","type":"tf","q":"Sin embargo, el viaje fue largo, disfrutamos mucho.","a":false,"ex":"One sentence with two clauses needs aunque.","en":"Although the trip was long, we enjoyed it a lot.","full":"Aunque el viaje fue largo, disfrutamos mucho.","fromMistake":true},{"id":"g4-006","type":"tf","q":"Escucho música mientras que cocino.","a":false,"ex":"For time, use mientras without que.","en":"I listen to music while I cook.","full":"Escucho música mientras cocino.","fromMistake":true},{"id":"g4-007","type":"gap","q":"El piso es bonito. ___ , es barato.","a":"Además","ex":"Además has an accent; it means on top of that.","en":"The flat is nice. On top of that, it's cheap.","fromMistake":true},{"id":"g4-008","type":"tiles","q":"Although it was raining, we went out","a":"Aunque llovía, salimos","distractors":["Sin","embargo"],"ex":"Aunque joins two clauses.","fromMistake":true},{"id":"g4-009","type":"mc","q":"Estoy cansado; ___ , voy a ir al gimnasio.","opts":["sin embargo","aunque","como"],"c":0,"ex":"After a semicolon, use sin embargo.","en":"I'm tired; however, I'm going to the gym."},{"id":"g4-010","type":"mc","q":"___ estoy cansado, voy al gimnasio.","opts":["Aunque","Sin embargo","Por eso"],"c":0,"ex":"Aunque + clause.","en":"Although I'm tired, I'm going to the gym."},{"id":"g4-011","type":"mc","q":"___ la lluvia, salimos.","opts":["A pesar de","Aunque","Sin embargo"],"c":0,"ex":"A pesar de + noun.","en":"Despite the rain, we went out."},{"id":"g4-012","type":"mc","q":"___ estar enfermo, fue a trabajar.","opts":["A pesar de","Aunque","Sin embargo"],"c":0,"ex":"A pesar de + infinitive.","en":"Despite being ill, he went to work."},{"id":"g4-013","type":"mc","q":"Yo trabajo en casa, ___ mi hermana trabaja en una oficina.","opts":["mientras que","por eso","aunque"],"c":0,"ex":"Contrast: mientras que.","en":"I work at home, whereas my sister works in an office."},{"id":"g4-014","type":"mc","q":"Escucho música ___ cocino.","opts":["mientras","mientras que","sin embargo"],"c":0,"ex":"Same time: mientras.","en":"I listen to music while I cook."},{"id":"g4-015","type":"mc","q":"___ no tengo coche, voy en tren.","opts":["Como","Porque","Por eso"],"c":0,"ex":"Cause first: como.","en":"As I don't have a car, I go by train."},{"id":"g4-016","type":"mc","q":"Voy en tren ___ no tengo coche.","opts":["porque","como","así que"],"c":0,"ex":"Porque comes after the main idea.","en":"I go by train because I don't have a car."},{"id":"g4-017","type":"mc","q":"No tengo coche, ___ voy en tren.","opts":["así que","porque","como"],"c":0,"ex":"Result: así que.","en":"I don't have a car, so I go by train."},{"id":"g4-018","type":"mc","q":"___ estás aquí, ¿me ayudas?","opts":["Ya que","Por eso","Sin embargo"],"c":0,"ex":"Ya que gives the cause.","en":"Since you're here, will you help me?"},{"id":"g4-019","type":"mc","q":"Llovía mucho; ___ , nos quedamos en casa.","opts":["por lo tanto","aunque","como"],"c":0,"ex":"Result: por lo tanto.","en":"It was raining hard; therefore, we stayed at home."},{"id":"g4-020","type":"mc","q":"Trabaja mucho. ___ gana poco.","opts":["Sin embargo,","Por lo tanto,","Por eso"],"c":0,"ex":"Contrast: sin embargo.","en":"He works a lot. However, he earns little."},{"id":"g4-021","type":"mc","q":"Vino todo el mundo, ___ mi jefe.","opts":["incluso","además","sin embargo"],"c":0,"ex":"Incluso = even.","en":"Everyone came, even my boss."},{"id":"g4-022","type":"mc","q":"A mí me encanta Madrid; a Ana, ___ , no le gusta.","opts":["en cambio","además","por eso"],"c":0,"ex":"En cambio = on the other hand.","en":"I love Madrid; Ana, on the other hand, doesn't like it."},{"id":"g4-023","type":"mc","q":"Es caro. ___ , está lejos.","opts":["Además","Aunque","Mientras"],"c":0,"ex":"Additional point: además.","en":"It's expensive. On top of that, it's far away."},{"id":"g4-024","type":"gap","q":"___ hace frío, voy a nadar.","a":"Aunque|A pesar de que","ex":"Aunque + clause.","en":"Although it's cold, I'm going swimming."},{"id":"g4-025","type":"gap","q":"Hace frío; sin ___ , voy a nadar.","a":"embargo","ex":"Sin embargo.","en":"It's cold; however, I'm going swimming."},{"id":"g4-026","type":"gap","q":"Vamos a salir a ___ de la lluvia.","a":"pesar","ex":"A pesar de.","en":"We're going out despite the rain."},{"id":"g4-027","type":"gap","q":"Me gusta el té, ___ que a mi novia le gusta el café.","a":"mientras","ex":"Contrast: mientras que.","en":"I like tea, whereas my girlfriend likes coffee."},{"id":"g4-028","type":"gap","q":"Estudio ___ mi hijo duerme.","a":"mientras|cuando","ex":"Same time: mientras.","en":"I study while my son sleeps."},{"id":"g4-029","type":"gap","q":"___ tengo tiempo, te ayudo. (cause first)","a":"Como|Ya que|Puesto que","ex":"Cause first: como.","en":"As I have time, I'll help you."},{"id":"g4-030","type":"gap","q":"Estoy enfermo; por ___ , no voy a clase.","a":"eso|tanto|lo tanto|ello","ex":"Result: por eso.","en":"I'm ill; that's why I'm not going to class."},{"id":"g4-031","type":"gap","q":"Llegó tarde, así ___ perdió el tren.","a":"que","ex":"Result: así que.","en":"He arrived late, so he missed the train."},{"id":"g4-032","type":"gap","q":"Por un ___ me gusta; por otro, es muy caro.","a":"lado","ex":"Por un lado… por otro lado.","en":"On the one hand I like it; on the other, it's very expensive."},{"id":"g4-033","type":"gap","q":"Llego a las diez, o ___ , dentro de una hora.","a":"sea","ex":"O sea = in other words.","en":"I'll arrive at ten, in other words, in an hour."},{"id":"g4-034","type":"gap","q":"Por ___ , ¿qué tal tu madre?","a":"cierto","ex":"Por cierto = by the way.","en":"By the way, how's your mother?"},{"id":"g4-035","type":"gap","q":"De ___ , ya lo sabía.","a":"hecho","ex":"De hecho = in fact.","en":"In fact, I already knew."},{"id":"g4-036","type":"gapBank","q":"___ llueve, salgo; ___ , no llevo paraguas.","a":["Aunque","sin embargo"],"bank":["Aunque","sin embargo","Como","mientras"],"ex":"Aunque + clause; sin embargo after a semicolon.","en":"Although it's raining, I'm going out; however, I'm not taking an umbrella."},{"id":"g4-037","type":"gapBank","q":"No tengo dinero, ___ no voy.","a":["así que"],"bank":["así que","aunque","como","mientras"],"ex":"Result: así que.","en":"I don't have money, so I'm not going."},{"id":"g4-038","type":"gapBank","q":"___ que no vienes, cenamos solos.","a":["Ya"],"bank":["Ya","Por","Sin","Como"],"ex":"Ya que = since.","en":"Since you're not coming, we'll have dinner alone."},{"id":"g4-039","type":"gapBank","q":"Mi padre es alto, ___ mi madre es baja.","a":["mientras que"],"bank":["mientras que","aunque","además","por eso"],"ex":"Contrast: mientras que.","en":"My father is tall, whereas my mother is short."},{"id":"g4-040","type":"tf","q":"Como tengo hambre, voy a comer.","a":true,"ex":"Como comes first.","en":"As I'm hungry, I'm going to eat."},{"id":"g4-041","type":"tf","q":"Voy a comer como tengo hambre.","a":false,"ex":"In the middle, use porque.","en":"I'm going to eat because I'm hungry.","full":"Voy a comer porque tengo hambre."},{"id":"g4-042","type":"tf","q":"Aunque hace sol, tengo frío.","a":true,"ex":"Aunque joins two clauses.","en":"Although it's sunny, I'm cold."},{"id":"g4-043","type":"tf","q":"A pesar de hace sol, tengo frío.","a":false,"ex":"Before a clause: a pesar de que.","en":"Although it's sunny, I'm cold.","full":"A pesar de que hace sol, tengo frío."},{"id":"g4-044","type":"spot","q":"Como voy a comer porque tengo hambre.","wrong":0,"a":"(delete)","opts":["(delete)","Aunque","Además"],"full":"Voy a comer porque tengo hambre.","ex":"Porque already gives the reason.","en":"I'm going to eat because I'm hungry."},{"id":"g4-045","type":"spot","q":"Estudio mientras que mi hijo duerme.","wrong":2,"a":"(delete)","opts":["(delete)","y","y que"],"full":"Estudio mientras mi hijo duerme.","ex":"Same time: mientras, without que.","en":"I study while my son sleeps."},{"id":"g4-046","type":"tiles","q":"It's expensive; however, it's good","a":"Es caro; sin embargo, es bueno","distractors":["aunque"],"ex":"Punctuation: ; before and a comma after."},{"id":"g4-047","type":"tiles","q":"I have no car, so I walk","a":"No tengo coche, así que voy andando","distractors":["como"],"ex":"Result: así que."},{"id":"g4-048","type":"type","q":"however","a":"sin embargo","ex":"Starts a new clause."},{"id":"g4-049","type":"type","q":"although","a":"aunque","ex":"Joins two clauses."}]},{"id":"g5","title":"Ser, estar, haber","rule":{"intro":"Hay says that something exists. Está says where a known thing is. Es gives the place of an event. Haber in the past: había describes, hubo reports one event.","points":[{"title":"Existence","examples":[["Hay un banco cerca.","hay: a, some, numbers"],["El año pasado hubo una exposición.","hubo: one finished event"],["Había mucha gente.","había: description"]]},{"title":"Location","examples":[["El banco está aquí.","estar: a known thing"],["La fiesta es en mi casa.","ser: where an event takes place"]]},{"title":"Agreement","examples":[["Marta ha estado enferma.","ella: ha"],["Mis padres han estado aquí.","ellos: han"]]}],"watch":"From your exam: «fue una exposición» → hubo una exposición; «Marta he estado» → Marta ha estado."},"items":[{"id":"g5-001","type":"gap","q":"El año pasado ___ una exposición en el museo.","a":"hubo","ex":"One finished event that existed: hubo.","en":"Last year there was an exhibition in the museum.","fromMistake":true},{"id":"g5-002","type":"gap","q":"Marta ___ estado enferma.","a":"ha","ex":"Marta = ella: ha.","en":"Marta has been ill.","fromMistake":true},{"id" bo","había","estuvo"],"c":0,"ex":"One finished event: hubo.","en":"Yesterday there was an accident on the motorway."},{"id":"g5-014","type":"mc","q":"Cuando llegué, ___ mucha gente en la plaza.","opts":["había","hubo","estaba"],"c":0,"ex":"Description in the past: había.","en":"When I arrived, there were a lot of people in the square."},{"id":"g5-015","type":"mc","q":"En mi pueblo antes ___ un cine.","opts":["había","hubo","era"],"c":0,"ex":"Past description: había.","en":"There used to be a cinema in my village."},{"id":"g5-016","type":"mc","q":"Ayer ___ muy cansado.","opts":["estaba","era","había"],"c":0,"ex":"State in the past: estaba.","en":"I was very tired yesterday."},{"id":"g5-017","type":"mc","q":"Mi abuelo ___ médico.","opts":["era","estaba","había"],"c":0,"ex":"Profession in the past: era.","en":"My grandfather was a doctor."},{"id":"g5-018","type":"mc","q":"La gente ___ muy amable.","opts":["era","fueron","eran"],"c":0,"ex":"Characteristic: era. Gente is singular.","en":"The people were very nice."},{"id":"g5-019","type":"mc","q":"El hotel ___ cerca de la playa.","opts":["estaba","era","había"],"c":0,"ex":"Location in the past: estaba.","en":"The hotel was near the beach."},{"id":"g5-020","type":"mc","q":"La película ___ muy aburrida.","opts":["fue","había","hubo"],"c":0,"ex":"A judgement of a finished event: fue.","en":"The film was very boring."},{"id":"g5-021","type":"gap","q":"¿___ un cajero por aquí?","a":"Hay","ex":"Asking whether one exists: hay.","en":"Is there a cash machine around here?"},{"id":"g5-022","type":"gap","q":"¿Dónde ___ el cajero?","a":"está","ex":"A known thing: está.","en":"Where is the cash machine?"},{"id":"g5-023","type":"gap","q":"La reunión ___ en la sala dos.","a":"es","ex":"Event: es.","en":"The meeting is in room two."},{"id":"g5-024","type":"gap","q":"No ___ nadie en casa.","a":"hay","ex":"Existence: hay.","en":"There's nobody at home."},{"id":"g5-025","type":"gap","q":"Ayer no ___ clase.","a":"hubo|había","ex":"One finis ido. Background: imperfecto. Earlier: pluscuamperfecto.","en":"On Saturday we went to the mountains. It was sunny and there was nobody there. We walked for three hours and ate by a river. On returning, I saw that I had left the car open. Luckily, nobody had stolen anything."}]},{"id":"g7","title":"Por / para","rule":{"intro":"Maintenance only: you already do this well. Para looks forward to a goal. Por looks back at a cause, or describes a route or exchange.","points":[{"title":"para","examples":[["Este regalo es para ti.","recipient"],["Estudio para aprender.","purpose"],["Es para mañana.","deadline"]]},{"title":"por","examples":[["Gracias por tu ayuda.","cause"],["Pasamos por el centro.","through"],["Lo compré por diez euros.","exchange"],["Por la mañana","time of day"]]}]},"items":[{"id":"g7-001","type":"gap","q":"Este regalo es ___ mi madre.","a":"para","ex":"Recipient: para.","en":"This present is for my mother."},{"id":"g7-002","type":"gap","q":"Pasamos ___ el centro antes de llegar.","a":"por","ex":"Through: por.","en":"We went through the centre before arriving."},{"id":"g7-003","type":"gap","q":"Gracias ___ ayudarme.","a":"por","ex":"Thanks for: por.","en":"Thanks for helping me."},{"id":"g7-004","type":"gap","q":"Tengo que terminar este informe ___ mañana.","a":"para","ex":"Deadline: para.","en":"I have to finish this report for tomorrow."},{"id":"g7-005","type":"gap","q":"Estudio español ___ trabajar en España.","a":"para","ex":"Purpose: para.","en":"I study Spanish in order to work in Spain."},{"id":"g7-006","type":"gap","q":"Lo he comprado ___ veinte euros.","a":"por","ex":"Exchange: por.","en":"I bought it for twenty euros."},{"id":"g7-007","type":"gap","q":"No fui ___ la lluvia.","a":"por","ex":"Cause: por.","en":"I didn't go because of the rain."},{"id":"g7-008","type":"gap","q":"Hablamos ___ teléfono ayer.","a":"por","ex":"Means: por teléfono.","en":"We talked on the phone yesterday."},{"id":"g7-009","type":"gap","q":"Salgo ___ Madrid mañana.","a":" q":"Muchas gracias ___ el regalo.","a":["por"],"bank":["por","para","de","a"],"ex":"Thanks for: por.","en":"Thank you very much for the present."},{"id":"g7-022","type":"tf","q":"Viajamos para España durante dos semanas.","a":false,"ex":"Travelling around: por.","en":"We travelled around Spain for two weeks.","full":"Viajamos por España durante dos semanas."},{"id":"g7-023","type":"tf","q":"Gracias por venir.","a":true,"ex":"Thanks for: por.","en":"Thanks for coming."},{"id":"g7-024","type":"tiles","q":"This is for you","a":"Esto es para ti","distractors":["por"],"ex":"Recipient: para."},{"id":"g7-025","type":"tiles","q":"Thanks for your help","a":"Gracias por tu ayuda","distractors":["para"],"ex":"Thanks for: por."}]},{"id":"g8","title":"B1 extras","rule":{"intro":"Four things B1 expects: object pronouns, verbs that work like gustar, comparisons, and «si» sentences.","points":[{"title":"Pronouns","examples":[["Lo veo. La veo.","direct object: lo, la, los, las"],["Le doy el libro.","indirect object: le, les"],["Se lo doy.","le + lo becomes se lo"]]},{"title":"Like gustar","examples":[["Me gusta ver películas.","one thing or an infinitive"],["Me gustan las películas.","plural: gustan"],["Me preocupa, me molesta, me apetece, me parece","same pattern"]]},{"title":"Comparing","examples":[["más alto que; menos caro que","more, less"],["tan alto como","as … as"],["el más alto de","the most … of"],["mejor, peor, mayor, menor","irregular"]]},{"title":"Si sentences","examples":[["Si tengo tiempo, iré.","a real possibility"],["Me gustaría ir.","conditional: wishes, polite requests"],["Si tuviera tiempo, iría.","imagined"]]}],"watch":"From your exam: me gusta ver películas, not quiero ver películas, when you mean you like it."},"items":[{"id":"g8-001","type":"mc","q":"¿Ves a Marta? Sí, ___ veo.","opts":["la","le","lo"],"c":0,"ex":"Marta: direct object, feminine.","en":"Do you see Marta? Yes, I see her."},{"id":"g8-002","type":"mc","q":"¿Tienes el libro? Sí, ___ tengo.","opts":["lo","la","le"],"c":0,"ex":"El libro: lo.","en":"Do you have the book? Yes, I have it."},{"id":"g8-003","type":"mc","q":"¿Compras las entradas? Sí, ___ compro.","opts":["las","los","les"],"c":0,"ex":"Las entradas: las.","en":"Are you buying the tickets? Yes, I'm buying them."},{"id":"g8-004","type":"mc","q":"¿Conoces a mis padres? No, no ___ conozco.","opts":["los","les","lo"],"c":0,"ex":"Mis padres: los.","en":"Do you know my parents? No, I don't know them."},{"id":"g8-005","type":"mc","q":"___ doy el dinero a Juan.","opts":["Le","Lo","La"],"c":0,"ex":"To Juan: indirect object, le.","en":"I'm giving the money to Juan."},{"id":"g8-006","type":"mc","q":"___ escribo a mis padres cada semana.","opts":["Les","Los","Le"],"c":0,"ex":"To them: les.","en":"I write to my parents every week."},{"id":"g8-007","type":"mc","q":"¿Le das el libro? Sí, ___ doy.","opts":["se lo","le lo","lo le"],"c":0,"ex":"Le + lo becomes se lo.","en":"Are you giving him the book? Yes, I'm giving it to him."},{"id":"g8-008","type":"mc","q":"¿Le mandas las fotos? Sí, ___ mando.","opts":["se las","le las","las se"],"c":0,"ex":"Le + las becomes se las.","en":"Are you sending her the photos? Yes, I'm sending them to her."},{"id":"g8-009","type":"mc","q":"¿Me das tu número? Sí, ___ doy.","opts":["te lo","lo te","te le"],"c":0,"ex":"Te comes before lo.","en":"Will you give me your number? Yes, I'll give it to you."},{"id":"g8-010","type":"mc","q":"¿Me traes un café? Sí, ahora ___ traigo.","opts":["te lo","lo te","se lo"],"c":0,"ex":"Te comes before lo.","en":"Will you bring me a coffee? Yes, I'll bring it to you now."},{"id":"g8-011","type":"gap","q":"Quiero ver a Ana. Voy a llamar___ .","a":"la","ex":"The pronoun can join the infinitive.","en":"I want to see Ana. I'm going to call her."},{"id":"g8-012","type":"gap","q":"Este libro es bueno. ___ recomiendo. (to you, it)","a":"Te lo","ex":"Te + lo.","en":"This book is good. I recommend it to you."},{"id":"g8-013","type":"gap","q":"Las llaves: ¿___ tienes s por la noche.","opts":["gusta","gustan","quiero"],"c":0,"ex":"Infinitive: gusta. Also, you like it, not «quiero».","en":"I like watching films at night.","fromMistake":true},{"id":"g8-027","type":"tiles","q":"I like watching films","a":"Me gusta ver películas","distractors":["quiero","gustan"],"ex":"Like = me gusta, not quiero.","fromMistake":true},{"id":"g8-028","type":"mc","q":"Me ___ las películas españolas.","opts":["gustan","gusta","gusto"],"c":0,"ex":"Plural: gustan.","en":"I like Spanish films."},{"id":"g8-029","type":"mc","q":"¿Te ___ este plan?","opts":["parece bien","parecen bien","pareces bien"],"c":0,"ex":"One thing: parece.","en":"Does this plan sound good to you?"},{"id":"g8-030","type":"mc","q":"Me ___ que no llame.","opts":["preocupa","preocupan","preocupo"],"c":0,"ex":"One idea: preocupa.","en":"It worries me that he doesn't call."},{"id":"g8-031","type":"mc","q":"Me ___ los ruidos de noche.","opts":["molestan","molesta","molesto"],"c":0,"ex":"Plural: molestan.","en":"Noises at night bother me."},{"id":"g8-032","type":"mc","q":"¿Te ___ un café?","opts":["apetece","apeteces","apetezco"],"c":0,"ex":"Un café: apetece.","en":"Do you feel like a coffee?"},{"id":"g8-033","type":"mc","q":"A mis padres ___ gusta viajar.","opts":["les","los","le"],"c":0,"ex":"To them: les.","en":"My parents like travelling."},{"id":"g8-034","type":"mc","q":"A mí ___ encanta Madrid.","opts":["me","mí","yo"],"c":0,"ex":"A mí me encanta.","en":"I love Madrid."},{"id":"g8-035","type":"mc","q":"¿A ti ___ duele la cabeza?","opts":["te","ti","tú"],"c":0,"ex":"A ti te duele.","en":"Does your head hurt?"},{"id":"g8-036","type":"gap","q":"Me ___ los pies. (doler)","a":"duelen","ex":"Plural: duelen.","en":"My feet hurt."},{"id":"g8-037","type":"gap","q":"Me ___ la cabeza. (doler)","a":"duele","ex":"One thing: duele.","en":"My head hurts."},{"id":"g8-038","type":"gap","q":"Nos ___ mucho este barrio. (gustar)","a":"gusta","ex":"One thing: gusta.","en":"We like this neighbourhood a lot."},{"id":"g8-039","type":"gap","q":"No me ___ nada salir hoy. (apetecer)","a":"apetece","ex":"Infinitive: apetece.","en":"I don't feel like going out at all today."},{"id":"g8-040","type":"gap","q":"Me ___ que hables así. (molestar)","a":"molesta","ex":"One idea: molesta.","en":"It bothers me that you talk like that."},{"id":"g8-041","type":"gap","q":"¿Qué te ___ estos zapatos? (parecer)","a":"parecen","ex":"Plural: parecen.","en":"What do you think of these shoes?"},{"id":"g8-042","type":"gap","q":"A Ana le ___ los gatos. (encantar)","a":"encantan","ex":"Plural: encantan.","en":"Ana loves cats."},{"id":"g8-043","type":"gap","q":"Nos ___ que estés enfermo. (preocupar)","a":"preocupa","ex":"One idea: preocupa.","en":"It worries us that you're ill."},{"id":"g8-044","type":"tf","q":"Yo gusto el café.","a":false,"ex":"The thing is the subject: me gusta.","en":"I like coffee.","full":"Me gusta el café."},{"id":"g8-045","type":"tf","q":"Me encantan los perros.","a":true,"ex":"Plural: encantan.","en":"I love dogs."},{"id":"g8-046","type":"tiles","q":"My feet hurt","a":"Me duelen los pies","distractors":["duele","Mi"],"ex":"Plural: duelen. Body parts use los, not mis."},{"id":"g8-047","type":"mc","q":"Madrid es ___ grande que Toledo.","opts":["más","tan","muy"],"c":0,"ex":"Comparison: más … que.","en":"Madrid is bigger than Toledo."},{"id":"g8-048","type":"mc","q":"Este piso es ___ caro como el otro.","opts":["tan","más","tanto"],"c":0,"ex":"Tan … como.","en":"This flat is as expensive as the other one."},{"id":"g8-049","type":"mc","q":"Mi hermano es ___ que yo. (older)","opts":["mayor","mejor","más mayor"],"c":0,"ex":"Irregular: mayor.","en":"My brother is older than me."},{"id":"g8-050","type":"mc","q":"Este café es ___ que el otro.","opts":["mejor","más mejor","bien"],"c":0,"ex":"Irregular: mejor.","en":"This coffee is better than the other one."},{"id":"g8-051","type":"mc","q":"Este es el bar ___ barato del barrio.","opts":["más","muy","tan"],"c":0,"ex":"Superlative: el 064","type":"mc","q":"Si ___ dinero, viajaría más.","opts":["tuviera","tengo","tendría"],"c":0,"ex":"Imagined: si tuviera.","en":"If I had money, I'd travel more."},{"id":"g8-065","type":"mc","q":"Me ___ vivir en Madrid. (a wish)","opts":["gustaría","gustará","gusta"],"c":0,"ex":"Wish: me gustaría.","en":"I'd like to live in Madrid."},{"id":"g8-066","type":"mc","q":"¿___ abrir la ventana, por favor?","opts":["Podría","Podré","Pude"],"c":0,"ex":"Polite request: podría.","en":"Could you open the window, please?"},{"id":"g8-067","type":"gap","q":"Yo que tú, ___ al médico. (ir)","a":"iría","ex":"Advice: conditional.","en":"If I were you, I'd go to the doctor."},{"id":"g8-068","type":"gap","q":"Si llueve, no ___ . (salir, nosotros)","a":"saldremos|salimos","ex":"Si + present, future.","en":"If it rains, we won't go out."},{"id":"g8-069","type":"gap","q":"Si fuera rico, ___ una casa. (comprar, yo)","a":"compraría","ex":"Imagined: conditional.","en":"If I were rich, I would buy a house."},{"id":"g8-070","type":"gap","q":"Si ___ más tiempo, aprendería más. (tener, yo)","a":"tuviera","ex":"Imagined: si tuviera.","en":"If I had more time, I would learn more."},{"id":"g8-071","type":"gap","q":"Me ___ un café, por favor. (gustar)","a":"gustaría","ex":"Polite: me gustaría.","en":"I'd like a coffee, please."},{"id":"g8-072","type":"tf","q":"Si tendría tiempo, iría.","a":false,"ex":"Never conditional after si.","en":"If I had time, I would go.","full":"Si tuviera tiempo, iría."},{"id":"g8-073","type":"tf","q":"Si tengo tiempo, iré.","a":true,"ex":"Si + present, future.","en":"If I have time, I'll go."},{"id":"g8-074","type":"tiles","q":"If I had time, I would go","a":"Si tuviera tiempo, iría","distractors":["tendría"],"ex":"Never conditional after si."},{"id":"g8-075","type":"type","q":"I would like to go.","a":"Me gustaría ir","ex":"Wish: me gustaría."}]},{"id":"fix","title":"Fix my sentences","rule":{"intro":"These come from your own exams, homework and chats. Tap the word that is wrong, then correct it. Or build the sentence again from tiles.","points":[{"title":"Your writing","examples":[["Otra ciudad, without una.","una otra is never right"],["Tomamos unas cervezas.","drinks take tomar, not tener"],["Drop yo and nosotros where you can.","the verb already shows the person"]]}],"watch":"Your exam email had yo, yo, nosotros. Spanish usually drops them."},"items":[{"id":"fix-001","type":"spot","q":"¿Como estás?","wrong":0,"a":"¿Cómo","opts":["¿Cómo","¿Cuándo","¿Qué"],"full":"¿Cómo estás?","ex":"Question words carry an accent.","en":"How are you?","fromMistake":true},{"id":"fix-002","type":"spot","q":"¿Cómo estas?","wrong":1,"a":"estás","opts":["estás","esta","estoy"],"full":"¿Cómo estás?","ex":"Estás: with accent.","en":"How are you?","fromMistake":true},{"id":"fix-003","type":"spot","q":"He empezado la clase de bailar.","wrong":5,"a":"baile","opts":["baile","bailo","bailando"],"full":"He empezado la clase de baile.","ex":"Noun needed: clase de baile.","en":"I've started the dance class.","fromMistake":true},{"id":"fix-004","type":"spot","q":"Me encanta aprender de bailar.","wrong":3,"a":"a","opts":["a","en","por"],"full":"Me encanta aprender a bailar.","ex":"aprender a + infinitive.","en":"I love learning to dance.","fromMistake":true},{"id":"fix-005","type":"spot","q":"Después, nosotros teníamos unas cervezas.","wrong":2,"a":"tomamos","opts":["tomamos","tuvimos","hacíamos"],"full":"Después, nosotros tomamos unas cervezas.","ex":"Drinks take tomar.","en":"Afterwards, we had some beers.","fromMistake":true},{"id":"fix-006","type":"spot","q":"Voy a visitar una otra ciudad.","wrong":3,"a":"(delete)","opts":["(delete)","la","un"],"full":"Voy a visitar otra ciudad.","ex":"Otra needs no una.","en":"I'm going to visit another city.","fromMistake":true},{"id":"fix-007","type":"spot","q":"He encontrado otras personas en clase.","wrong":1,"a":"conocido a","opts":["conocido a","visto a","encontrado a"],"full":"He conocido a otras personas en clase.", ":true,"why":"Natural and correct."},{"es":"Sí, me voy a la mañana. Te voy a echar de menos.","correct":false,"why":"Por la mañana: your exam mistake."},{"es":"Sí, me voy al probador.","correct":false,"why":"That is for a shop."}]},{"speaker":"them","es":"Yo también. ¿Cuándo vuelves?","en":"Me too. When are you coming back?"},{"speaker":"me","es":"Espero volver dentro de unos meses.","en":"I hope to come back in a few months.","options":[{"es":"Espero volver dentro de unos meses.","correct":true,"why":"Natural and correct."},{"es":"Espero que vuelvo dentro de unos meses.","correct":false,"why":"Same subject: espero + infinitive."},{"es":"Espero el autobús número doce.","correct":false,"why":"That does not answer."}]},{"speaker":"them","es":"¡Qué bien! Y avísame cuando llegues a casa.","en":"Great! And let me know when you get home."},{"speaker":"me","es":"Claro, te escribo cuando llegue.","en":"Of course, I'll write to you when I arrive.","options":[{"es":"Claro, te escribo cuando llegue.","correct":true,"why":"Natural and correct."},{"es":"Claro, te escribo cuando llego.","correct":false,"why":"Cuando + future idea: subjunctive."},{"es":"Claro, la cuenta, por favor.","correct":false,"why":"That is for a waiter."}]},{"speaker":"them","es":"¡Que te vaya muy bien!","en":"All the very best!"},{"speaker":"me","es":"¡Igualmente! Cuídate mucho. ¡Nos vemos pronto!","en":"You too! Take good care. See you soon!","options":[{"es":"¡Igualmente! Cuídate mucho. ¡Nos vemos pronto!","correct":true,"why":"Natural and correct."},{"es":"¡Igualmente! Cuidas mucho. ¡Nos vemos pronto!","correct":false,"why":"Command: cuídate."},{"es":"¡Igualmente! ¿Cuánto vale?","correct":false,"why":"That asks a price."}]}],"phrases":[["echar de menos","to miss","per-018"],["Que te vaya bien","All the best","st-035"],["Cuídate","Take care","st-036"],["Hasta pronto","See you soon","st-089"],["¡Nos vemos!","See you!","st-033"],["Avísame","Let me know","pln-018"]]}],"reading":[{"id":"read-city","title":"Arriving in a new city","text":"Cuando Javier llegó a Valencia, no conocía a nadie. Tenía veintiocho años y acababa de encontrar un trabajo en una empresa de tecnología. El primer día se perdió dos veces buscando la oficina, porque todas las calles del centro le parecían iguales.\n\nDurante las primeras semanas vivió en un piso turístico cerca del puerto. Era caro y un poco ruidoso, pero tenía unas vistas preciosas. Por las tardes paseaba por el barrio y entraba en los bares para practicar su español, aunque al principio le daba vergüenza hablar.\n\nPoco a poco, todo empezó a cambiar. Un compañero del trabajo lo invitó a jugar al pádel y allí conoció a un grupo de amigos muy majos. También se apuntó a un curso de cocina. Dos meses después alquiló un piso más barato en otra zona y aprendió a moverse en metro sin mirar el mapa.\n\nAhora, cuando alguien le pregunta qué es lo más difícil de mudarse a otra ciudad, siempre contesta lo mismo: el primer mes. Después, si te apuntas a todo, la ciudad empieza a ser tuya.","questions":[{"type":"tf","q":"Javier conocía a mucha gente en Valencia cuando llegó.","a":false,"ex":"The text says no conocía a nadie."},{"type":"mc","q":"¿Cómo era su primer piso?","opts":["Caro y ruidoso, con buenas vistas","Barato y tranquilo","Sin vistas y lejos del puerto"],"c":0,"ex":"Era caro y un poco ruidoso, pero tenía vistas preciosas."},{"type":"tf","q":"Al principio le daba vergüenza hablar español.","a":true,"ex":"Al principio le daba vergüenza hablar."},{"type":"mc","q":"¿Dónde conoció a sus amigos?","opts":["Jugando al pádel","En su piso turístico","En el metro"],"c":0,"ex":"Un compañero lo invitó a jugar al pádel y allí los conoció."},{"type":"mc","q":"En este texto, «se apuntó a» significa…","opts":["he signed up for","he pointed at","he noted down"],"c":0,"ex":"Apuntarse a = to sign up for."},{"type":"mc","q":"En este texto, «moverse» significa…","opts":["to get around","to move house","to exercise"],"c":0,"ex":"Moverse en metro = to get around by metro."}]},{"id":"read-trip","title":"A trip that went wrong","text":"El verano pasado, Laura y su novio decidieron pasar una semana en el norte de España. Lo habían planeado todo con mucho cuidado, pero desde el primer día nada salió como esperaban.\n\nPrimero, su vuelo a Bilbao salió con tres horas de retraso. Cuando por fin aterrizaron, descubrieron que la maleta de Laura no había llegado. Tuvieron que ir de compras esa misma noche porque ella no tenía ropa para el día siguiente.\n\nAl día siguiente alquilaron un coche para ir a la costa. A mitad de camino, tuvieron un pinchazo en una carretera sin cobertura, y tardaron casi dos horas en encontrar ayuda. Un agricultor muy amable paró y les ayudó a cambiar la rueda.\n\nSin embargo, gracias a él descubrieron la mejor parte del viaje. Les recomendó un pueblo pequeño que no aparecía en las guías, con un restaurante donde comieron el mejor pescado de su vida. Se quedaron allí tres días y cancelaron el resto del plan.\n\n«Fue un desastre y también el mejor viaje que hemos hecho», dice Laura. La maleta llegó a casa dos semanas después.","questions":[{"type":"tf","q":"El vuelo a Bilbao salió a tiempo.","a":false,"ex":"Salió con tres horas de retraso."},{"type":"mc","q":"¿Por qué fueron de compras?","opts":["La maleta de Laura no había llegado","Querían regalos","Iba a hacer mucho frío"],"c":0,"ex":"Ella no tenía ropa para el día siguiente."},{"type":"mc","q":"¿Qué problema tuvieron en la carretera?","opts":["Un pinchazo","Se quedaron sin gasolina","Un accidente"],"c":0,"ex":"Tuvieron un pinchazo."},{"type":"tf","q":"El agricultor les recomendó un pueblo.","a":true,"ex":"Les recomendó un pueblo pequeño."},{"type":"mc","q":"En este texto, «sin cobertura» significa…","opts":["without phone signal","without a roof","without insurance"],"c":0,"ex":"Cobertura here means phone coverage."},{"type":"mc","q":"En este texto, «salió como esperaban» significa…","opts":["turned out as they expected","left as they waited","went out as they hoped to"],"c":0,"ex":"Salir here means to turn out."}]},{"id":"read-interview","title":"A job interview","text":"Hace un mes, Elena tuvo una entrevista de trabajo para un puesto en una consultoría de Madrid. Llevaba tres meses buscando trabajo y estaba muy nerviosa. La noche anterior apenas durmió y repitió sus respuestas muchas veces delante del espejo.\n\nLa entrevista empezó mal. Elena llegó diez minutos tarde por una avería en el metro. Pidió perdón y la directora le dijo que no se preocupara. Después le hizo muchas preguntas sobre su experiencia y sobre los proyectos en los que había trabajado.\n\nLo más difícil llegó al final. «¿Cuál es su mayor defecto?», le preguntó la directora. Elena pensó un momento y contestó con sinceridad que a veces le costaba pedir ayuda. Explicó que estaba aprendiendo a trabajar más en equipo.\n\nDos días después recibió una llamada. Le ofrecieron el puesto, con un contrato indefinido y un buen sueldo. La directora le explicó que su respuesta sincera les había gustado mucho. Además, podía trabajar en remoto dos días a la semana. Elena aceptó enseguida y empezó el lunes siguiente.","questions":[{"type":"tf","q":"Elena llevaba tres meses buscando trabajo.","a":true,"ex":"Llevaba tres meses buscando trabajo."},{"type":"mc","q":"¿Por qué llegó tarde?","opts":["Hubo una avería en el metro","Se despertó tarde","Se perdió"],"c":0,"ex":"Por una avería en el metro."},{"type":"mc","q":"¿Qué defecto mencionó?","opts":["Le costaba pedir ayuda","Llegaba siempre tarde","Hablaba demasiado"],"c":0,"ex":"A veces le costaba pedir ayuda."},{"type":"tf","q":"Le ofrecieron un contrato temporal.","a":false,"ex":"Un contrato indefinido."},{"type":"mc","q":"En este texto, «apenas» significa…","opts":["hardly","only","again"],"c":0,"ex":"Apenas durmió = she hardly slept."},{"type":"mc","q":"En este texto, «le costaba» significa…","opts":["she found it hard","it cost her money","it was expensive"],"c":0,"ex":"Costar here means to find difficult."}]},{"id":"read-flat","title":"Flat-hunting in Madrid","text":"Encontrar piso en Madrid no es fácil, y Marcos lo sabe muy bien. Cuando se mudó a la capital, pensaba que tardaría una semana. Al final tardó casi tres meses.\n\nLos anuncios desaparecían en pocas horas. A veces llamaba por la mañana y el piso ya estaba alquilado. Otras veces iba a una visita y encontraba a veinte personas esperando en el portal. Además, los precios eran mucho más altos de lo que esperaba. Por un estudio pequeño e interior pedían novecientos euros al mes, sin gastos.\n\nLas inmobiliarias tampoco ayudaban mucho. Pedían una fianza de dos meses, un contrato de trabajo y, a menudo, un aval. Como Marcos acababa de llegar, le faltaban algunos papeles.\n\nAl final, encontró la solución gracias a una compañera de trabajo. Ella sabía que un amigo suyo buscaba a alguien para compartir piso en el barrio de Lavapiés. El piso es antiguo, pero luminoso, y Marcos paga quinientos euros al mes. «No es el piso de mis sueños», dice, «pero estoy contento: mi compañero de piso es muy majo y puedo ir andando al trabajo».","questions":[{"type":"tf","q":"Marcos encontró piso en una semana.","a":false,"ex":"Tardó casi tres meses."},{"type":"mc","q":"¿Qué problema tenían los anuncios?","opts":["Desaparecían muy rápido","Eran falsos","No tenían fotos"],"c":0,"ex":"Desaparecían en pocas horas."},{"type":"mc","q":"¿Cómo encontró el piso?","opts":["Por una compañera de trabajo","En una inmobiliaria","En un periódico"],"c":0,"ex":"Gracias a una compañera de trabajo."},{"type":"tf","q":"Marcos vive solo.","a":false,"ex":"Comparte piso."},{"type":"mc","q":"En este texto, «sin gastos» significa…","opts":["bills not included","no expense spared","free of charge"],"c":0,"ex":"Gastos here means the bills."},{"type":"mc","q":"En este texto, «luminoso» significa…","opts":["bright","noisy","furnished"],"c":0,"ex":"Luminoso = gets a lot of light."}]},{"id":"read-race","title":"A running race","text":"Hace un año, Ana no podía correr más de diez minutos sin parar. Hoy acaba de terminar su primera media maratón en Sevilla. «Nunca había hecho tanto deporte», cuenta riendo.\n\nTodo empezó porque su médico le dijo que tenía que ponerse en forma. Se apuntó a un grupo del barrio que entrenaba dos veces por semana. Al principio se cansaba mucho y le dolían las piernas, pero los compañeros la animaban y poco a poco fue mejorando.\n\nTres meses antes de la carrera, se lesionó la rodilla. Tuvo que dejar de correr durante tres semanas y pensó en abandonar. Sin embargo, un fisio le enseñó varios ejercicios y estirar se convirtió en parte de su rutina.\n\nEl día de la carrera hacía calor y había miles de personas en las calles. En el kilómetro dieciocho, Ana estaba hecha polvo, pero oyó a su familia gritando su nombre y siguió adelante. Terminó en dos horas y cuarto. «No fue rápido, pero me da igual», dice. «Ahora me siento capaz de cualquier cosa». Ya está pensando en su próxima carrera.","questions":[{"type":"tf","q":"Ana empezó a correr porque se lo recomendó su médico.","a":true,"ex":"Su médico le dijo que tenía que ponerse en forma."},{"type":"mc","q":"¿Qué pasó tres meses antes?","opts":["Se lesionó la rodilla","Se mudó a Sevilla","Dejó el grupo"],"c":0,"ex":"Se lesionó la rodilla."},{"type":"mc","q":"¿Quién la ayudó con la lesión?","opts":["Un fisio","Su familia","Su jefe"],"c":0,"ex":"Un fisio le enseñó varios ejercicios."},{"type":"tf","q":"Hacía frío el día de la carrera.","a":false,"ex":"Hacía calor."},{"type":"mc","q":"En este texto, «hecha polvo» significa…","opts":["exhausted","covered in dust","very excited"],"c":0,"ex":"Estar hecho polvo = to be exhausted."},{"type":"mc","q":"En este texto, «animaban» significa…","opts":["encouraged","made fun of","tired out"],"c":0,"ex":"Animar = to encourage."}]},{"id":"read-market","title":"A food market","text":"El mercado de mi barrio abre a las ocho de la mañana, y a esa hora ya hay gente en todos los puestos. Voy cada sábado desde que me mudé aquí. Al principio iba solo a mirar. Ahora, la mitad de los vendedores me conocen por mi nombre.\n\nPaco, el de la frutería, siempre me pregunta qué voy a cocinar y me recomienda algo. Su hermana Lola vende pescado en el puesto de al lado. Ella me enseñó a elegir el pescado fresco: hay que mirarle los ojos. Y en la panadería de la entrada venden la mejor barra de pan de toda la ciudad, aunque hay que llegar antes de las diez porque se acaba.\n\nComprar aquí no siempre es más barato que en el supermercado, pero merece la pena. Las verduras saben a algo, y nadie me pregunta si necesito una bolsa de plástico: llevo la mía. Además, siempre aprendo una palabra nueva.\n\nCuando termino, me tomo un café con leche en el bar del mercado y escucho las conversaciones. Es la mejor clase de español que he tenido nunca, y además es gratis.","questions":[{"type":"tf","q":"El narrador va al mercado todos los sábados.","a":true,"ex":"Voy cada sábado."},{"type":"mc","q":"¿Qué vende Lola?","opts":["Pescado","Fruta","Pan"],"c":0,"ex":"Su hermana Lola vende pescado."},{"type":"mc","q":"¿Por qué hay que llegar antes de las diez a la panadería?","opts":["Porque el pan se acaba","Porque cierra","Porque hay cola"],"c":0,"ex":"Hay que llegar antes de las diez porque se acaba."},{"type":"tf","q":"El mercado es siempre más barato que el supermercado.","a":false,"ex":"No siempre es más barato."},{"type":"mc","q":"En este texto, «puestos» significa…","opts":["stalls","jobs","seats"],"c":0,"ex":"A market puesto is a stall."},{"type":"mc","q":"En este texto, «merece la pena» significa…","opts":["it is worth it","it is a pity","it is painful"],"c":0,"ex":"Merecer la pena = to be worth it."}]},{"id":"read-canaries","title":"A weekend in the Canaries","text":"Si tienes solo un fin de semana y quieres sol en noviembre, Tenerife es una buena opción. Fuimos desde Madrid en un vuelo de dos horas y media y, al bajar del avión, ya hacía veinticuatro grados.\n\nEl sábado por la mañana alquilamos un coche y subimos al Teide, el volcán más alto de España. La carretera es larga, pero el paisaje cambia todo el tiempo: primero bosques, luego rocas de colores. Arriba hacía bastante frío, así que menos mal que llevábamos chaqueta. Hicimos un sendero corto y comimos unos bocadillos con vistas a las nubes.\n\nPor la tarde bajamos a la costa, a un pueblo de pescadores llamado Garachico. Allí nos bañamos en unas piscinas naturales de roca volcánica. Las olas eran grandes, pero el agua estaba tranquila dentro de las piscinas. Cenamos pescado con las famosas papas arrugadas, unas patatas pequeñas con salsa picante.\n\nEl domingo solo tuvimos tiempo de pasear por La Laguna, una ciudad antigua con casas de colores, antes de volver al aeropuerto. Dos días no son suficientes, así que volvimos con ganas de regresar.","questions":[{"type":"tf","q":"En noviembre hacía calor en Tenerife.","a":true,"ex":"Hacía veinticuatro grados."},{"type":"mc","q":"¿Qué tiempo hacía arriba, en el Teide?","opts":["Bastante frío","Mucho calor","Llovía"],"c":0,"ex":"Arriba hacía bastante frío."},{"type":"mc","q":"¿Qué son las papas arrugadas?","opts":["Patatas pequeñas con salsa","Un tipo de pescado","Un postre"],"c":0,"ex":"Unas patatas pequeñas con salsa picante."},{"type":"tf","q":"Se quedaron una semana.","a":false,"ex":"Solo un fin de semana."},{"type":"mc","q":"En este texto, «menos mal que» significa…","opts":["thank goodness","less bad than","unfortunately"],"c":0,"ex":"Menos mal que = thank goodness."},{"type":"mc","q":"En este texto, «con ganas de regresar» significa…","opts":["keen to come back","winning the return","tired of returning"],"c":0,"ex":"Tener ganas de = to be keen to."}]},{"id":"read-email","title":"An email from a friend","text":"¡Hola, Tim!\n\n¿Qué tal todo por ahí? Perdona que no te haya escrito antes, pero he estado muy liada con la mudanza. Por fin me he ido a vivir a Sevilla, como te conté en verano. Llevo aquí tres semanas y estoy encantada, aunque todavía tengo cajas por todo el piso.\n\nEl barrio es muy tranquilo y tengo una panadería buenísima justo debajo de casa. Mis vecinos son muy majos: el otro día me invitaron a cenar y acabamos hablando hasta las dos de la mañana. El único problema es el calor. Me han dicho que en julio es horrible, así que ya estoy pensando en comprar un aire acondicionado.\n\nEn el trabajo también estoy contenta. Mi jefa me deja trabajar desde casa los viernes, y eso me viene genial.\n\n¿Y tú? ¿Sigues con las clases de español? Me encantaría que vinieras a verme. Hay una habitación libre y te puedo enseñar la ciudad. ¿Qué te parece en primavera? Avísame cuando tengas fechas y lo organizamos.\n\nUn abrazo muy fuerte,\n\nCarmen","questions":[{"type":"tf","q":"Carmen acaba de mudarse a Sevilla.","a":true,"ex":"Llevo aquí tres semanas."},{"type":"mc","q":"¿Qué problema menciona?","opts":["El calor","Los vecinos","Su jefa"],"c":0,"ex":"El único problema es el calor."},{"type":"mc","q":"¿Qué día trabaja desde casa?","opts":["Los viernes","Los lunes","Nunca"],"c":0,"ex":"Los viernes."},{"type":"tf","q":"Carmen invita a Tim a visitarla.","a":true,"ex":"Me encantaría que vinieras a verme."},{"type":"mc","q":"En este texto, «liada» significa…","opts":["very busy","tied to a rope","confused"],"c":0,"ex":"Estar liado/a = to be very busy."},{"type":"mc","q":"En este texto, «me viene genial» significa…","opts":["it suits me perfectly","it comes to me easily","I am brilliant"],"c":0,"ex":"Venir bien = to suit."}]},{"id":"read-review","title":"A hotel review","text":"Pasamos tres noches en este hotel de Granada y, en general, quedamos contentos, aunque no todo fue perfecto.\n\nLo mejor es la ubicación: está en pleno centro histórico, a cinco minutos andando de la catedral, y desde la terraza se ve la Alhambra. El personal de recepción fue muy amable. Nos dejaron guardar las maletas el último día y nos recomendaron varios bares de tapas que no conocíamos.\n\nLa habitación era pequeña, pero estaba muy limpia, y la cama era cómoda. El desayuno estaba incluido en el precio, con fruta fresca y buen café, aunque el comedor se llenaba mucho a partir de las nueve.\n\nLos problemas: la primera noche el aire acondicionado no funcionaba y hacía mucho calor. Bajamos a recepción y lo arreglaron por la mañana, pero dormimos muy mal. Además, nuestra habitación daba a una calle con bares y era bastante ruidosa hasta las dos. Si vais, pedid una habitación interior.\n\nTampoco es fácil llegar en coche: hay que dejarlo en un aparcamiento a diez minutos.\n\nPor este precio, lo recomendaría. Le doy cuatro estrellas de cinco.","questions":[{"type":"tf","q":"El hotel está lejos de la catedral.","a":false,"ex":"A cinco minutos andando."},{"type":"mc","q":"¿Qué problema tuvieron la primera noche?","opts":["El aire acondicionado no funcionaba","No había agua caliente","Perdieron la llave"],"c":0,"ex":"El aire acondicionado no funcionaba."},{"type":"mc","q":"¿Qué recomienda pedir?","opts":["Una habitación interior","Un desayuno extra","Una cama más grande"],"c":0,"ex":"Pedid una habitación interior."},{"type":"tf","q":"El desayuno se pagaba aparte.","a":false,"ex":"Estaba incluido."},{"type":"mc","q":"En este texto, «daba a» significa…","opts":["faced onto","gave to","was given by"],"c":0,"ex":"Dar a = to face onto."},{"type":"mc","q":"En este texto, «personal» significa…","opts":["the staff","private","personal belongings"],"c":0,"ex":"El personal = the staff."}]},{"id":"read-housing","title":"The housing problem","text":"En muchas ciudades españolas, los jóvenes tienen cada vez más dificultades para encontrar una vivienda. Según datos recientes, más de la mitad de las personas de entre veinticinco y treinta y cuatro años siguen viviendo con sus padres.\n\nLas razones son varias. Por un lado, los alquileres han subido mucho en los últimos diez años, especialmente en Madrid, Barcelona y las islas. Por otro lado, los sueldos no han subido al mismo ritmo, y muchos jóvenes tienen contratos temporales. Además, comprar un piso es casi imposible sin ahorros, porque los bancos piden una entrada alta.\n\nUna parte del problema es el turismo. En algunos barrios, muchos propietarios prefieren alquilar sus pisos a turistas porque ganan más dinero. Como consecuencia, los vecinos tienen que irse a las afueras.\n\nEl Gobierno ha aprobado algunas medidas, como limitar el precio del alquiler en ciertas zonas y construir más vivienda pública. Sin embargo, no todos están de acuerdo. Algunos propietarios creen que estas medidas reducen la oferta. Mientras tanto, compartir piso se ha convertido en la solución habitual, también para personas de más de treinta años.","questions":[{"type":"tf","q":"Más de la mitad de los jóvenes viven con sus padres.","a":true,"ex":"Más de la mitad siguen viviendo con sus padres."},{"type":"mc","q":"¿Por qué es difícil comprar un piso?","opts":["Los bancos piden una entrada alta","No hay bancos","Los pisos son muy grandes"],"c":0,"ex":"Los bancos piden una entrada alta."},{"type":"mc","q":"¿Por qué prefieren algunos propietarios a los turistas?","opts":["Ganan más dinero","Son más limpios","Se quedan más tiempo"],"c":0,"ex":"Porque ganan más dinero."},{"type":"tf","q":"Todos están de acuerdo con las medidas.","a":false,"ex":"No todos están de acuerdo."},{"type":"mc","q":"En este texto, «propietarios» significa…","opts":["owners","tenants","neighbours"],"c":0,"ex":"Propietario = owner."},{"type":"mc","q":"En este texto, «las afueras» significa…","opts":["the outskirts","abroad","the outdoors"],"c":0,"ex":"Las afueras = the outskirts."}]},{"id":"read-remote","title":"Working remotely","text":"Desde hace dos años, Sara trabaja desde casa para una empresa de Ámsterdam. Vive en un pueblo de la costa de Málaga, a cinco minutos de la playa, y solo va a la oficina una vez cada tres meses.\n\nDice que trabajar en remoto tiene grandes ventajas. No pierde tiempo en el transporte, puede organizar su horario y, a la hora de comer, sale a correr por el paseo marítimo. Además, la vida es más barata que en Holanda, y paga mucho menos de alquiler.\n\nPero no todo es perfecto. Al principio se sentía muy sola. Echaba de menos las conversaciones con sus compañeros en la máquina de café. También le costaba separar la vida privada del trabajo: a veces contestaba correos a las diez de la noche.\n\nPara resolverlo, tomó varias decisiones. Se apuntó a un espacio de trabajo compartido dos días a la semana, donde ha conocido a otras personas que trabajan como ella. También apaga el móvil del trabajo a las seis en punto. «Si tuviera que volver a la oficina, no sé si podría», dice. «Pero hay que tener cuidado: trabajar desde casa no significa estar disponible siempre».","questions":[{"type":"tf","q":"Sara trabaja en una oficina de Málaga todos los días.","a":false,"ex":"Trabaja desde casa."},{"type":"mc","q":"¿Qué echaba de menos?","opts":["Las conversaciones con compañeros","La lluvia de Holanda","Su coche"],"c":0,"ex":"Las conversaciones en la máquina de café."},{"type":"mc","q":"¿Qué hace a las seis?","opts":["Apaga el móvil del trabajo","Empieza a trabajar","Va a la oficina"],"c":0,"ex":"Apaga el móvil del trabajo."},{"type":"tf","q":"Sara ha conocido a gente en un espacio de trabajo compartido.","a":true,"ex":"Ha conocido a otras personas allí."},{"type":"mc","q":"En este texto, «ventajas» significa…","opts":["advantages","windows","sales"],"c":0,"ex":"Ventaja = advantage."},{"type":"mc","q":"En este texto, «disponible» significa…","opts":["available","disposable","agreeable"],"c":0,"ex":"Disponible = available."}]},{"id":"read-volunteer","title":"A volunteering year abroad","text":"Cuando terminó la universidad, Pablo no sabía qué hacer con su vida. Tenía veintidós años y ninguna oferta de trabajo interesante, así que decidió irse un año como voluntario a Perú, a una escuela en un pueblo de los Andes.\n\nLos primeros días fueron muy duros. A casi cuatro mil metros de altura, se mareaba al subir las escaleras y le costaba dormir. No había agua caliente y la señal del móvil solo llegaba a un punto de la plaza. Pensó seriamente en volver a casa.\n\nPero los niños lo cambiaron todo. Les daba clases de inglés por la mañana y, por la tarde, jugaban al fútbol. Las familias lo invitaban a comer aunque tenían muy poco. Aprendió a cocinar y a tener paciencia, y también unas cuantas palabras de quechua.\n\nCuando volvió a España, ya no era la misma persona. Decidió estudiar para ser profesor, y ahora trabaja en un colegio de Zaragoza. «Fui para ayudar», dice, «pero fueron ellos los que me ayudaron a mí». Todos los años escribe a las familias, y este verano piensa volver con sus alumnos.","questions":[{"type":"tf","q":"Pablo tenía muchas ofertas de trabajo.","a":false,"ex":"Ninguna oferta interesante."},{"type":"mc","q":"¿Qué le pasaba al subir las escaleras?","opts":["Se mareaba","Se caía","Cantaba"],"c":0,"ex":"Se mareaba al subir las escaleras."},{"type":"mc","q":"¿Qué hacía por la tarde?","opts":["Jugaba al fútbol con los niños","Daba clases de inglés","Dormía"],"c":0,"ex":"Por la tarde, jugaban al fútbol."},{"type":"tf","q":"Ahora Pablo es profesor.","a":true,"ex":"Trabaja en un colegio."},{"type":"mc","q":"En este texto, «le costaba dormir» significa…","opts":["he found it hard to sleep","sleeping cost money","he slept a lot"],"c":0,"ex":"Costar = to find hard."},{"type":"mc","q":"En este texto, «paciencia» significa…","opts":["patience","a patient","peace"],"c":0,"ex":"Paciencia = patience."}]}],"checkpoints":[{"id":"cp1","title":"Checkpoint 1","when":"Week 1, after about 7 days","sections":[{"name":"Verbs + prepositions","items":[{"id":"cp1-01","type":"gap","q":"Mi hermana sueña ___ vivir en Italia.","a":"con","ex":"soñar con.","en":"My sister dreams of living in Italy."},{"id":"cp1-02","type":"gap","q":"No estoy de acuerdo ___ mi jefe.","a":"con","ex":"de acuerdo con.","en":"I do not agree with my boss."},{"id":"cp1-03","type":"gap","q":"¿Estás interesado ___ este curso?","a":"en","ex":"interesado en.","en":"Are you interested in this course?"},{"id":"cp1-04","type":"mc","q":"Voy a aprender ___ conducir.","opts":["a","de","en"],"c":0,"ex":"aprender a.","en":"I am going to learn to drive."}]},{"name":"Subjunctive","items":[{"id":"cp1-05","type":"gap","q":"Espero que ___ un buen hotel. (encontrar, nosotros)","a":"encontremos","ex":"encontrar + nosotros: no stem change.","en":"I hope we find a good hotel."},{"id":"cp1-06","type":"gap","q":"Quiero que ___ a mis amigos. (conocer, tú)","a":"conozcas","ex":"conocer → conozcas.","en":"I want you to meet my friends."},{"id":"cp1-07","type":"mc","q":"No creo que ___ hoy.","opts":["llueva","llueve","llova"],"c":0,"ex":"llover → llueva.","en":"I don't think it will rain today."},{"id":"cp1-08","type":"mc","q":"Antes de ___ , quiero ducharme.","opts":["salir","que salir","salga"],"c":0,"ex":"Same subject: infinitive.","en":"Before going out, I want to have a shower."}]},{"name":"Imperative","items":[{"id":"cp1-09","type":"gap","q":"(usted) ___ este formulario. (completar)","a":"Complete","ex":"usted of -ar takes -e.","en":"Fill in this form."},{"id":"cp1-10","type":"mc","q":"(usted) No ___ , por favor.","opts":["se preocupe","preocupese","te preocupes"],"c":0,"ex":"Pronoun in front.","en":"Don't worry, please."},{"id":"cp1-11","type":"gap","q":"(usted) ___ aquí, por favor. (sentarse)","a":"Siéntese","ex":"Pronoun on the end, plus accent.","en":"Sit here, please."}]},{"name":"Connectors","items":[{"id":"cp1-12","type":"mc","q":"Hace frío; ___ , voy a nadar.","opts":["sin embargo","aunque","mientras que"],"c":0,"ex":"After a semicolon: sin embargo.","en":"It's cold; however, I'm going swimming."},{"id":"cp1-13","type":"mc","q":"___ estoy cansado, salgo.","opts":["Aunque","Sin embargo","Por eso"],"c":0,"ex":"Aunque + clause.","en":"Although I'm tired, I'm going out."},{"id":"cp1-14","type":"mc","q":"___ tú cocinas, yo pongo la mesa.","opts":["Mientras","Mientras que","Además"],"c":0,"ex":"Same time: mientras.","en":"While you cook, I'll set the table."}]},{"name":"Ser, estar, haber","items":[{"id":"cp1-15","type":"mc","q":"Ayer ___ un concierto en la plaza.","opts":["hubo","fue","estuvo"],"c":0,"ex":"Existence: hubo.","en":"There was a concert in the square yesterday."},{"id":"cp1-16","type":"gap","q":"La reunión ___ en la sala tres.","a":"es","ex":"Events take ser.","en":"The meeting is in room three."}]},{"name":"Past tenses","items":[{"id":"cp1-17","type":"gap","q":"Marta y Ana ___ a Sevilla ayer. (ir)","a":"fueron","ex":"Plural subject: fueron.","en":"Marta and Ana went to Seville yesterday."},{"id":"cp1-18","type":"mc","q":"Cuando llegué, ya ___ la película.","opts":["había empezado","empezó","ha empezado"],"c":0,"ex":"Earlier past.","en":"When I arrived, the film had already started."}]},{"name":"Vocabulary","vocab":16},{"name":"Reading","reading":"read-city"}]},{"id":"cp2","title":"Checkpoint 2","when":"Week 2, after about 14 days","sections":[{"name":"Verbs + prepositions","items":[{"id":"cp2-19","type":"gap","q":"Mi amigo se casó ___ una chica de Bilbao.","a":"con","ex":"casarse con.","en":"My friend married a girl from Bilbao."},{"id":"cp2-20","type":"gap","q":"He trabajado ___ muchos proyectos este año.","a":"en","ex":"trabajar en.","en":"I have worked on many projects this year."},{"id":"cp2-21","type":"gap","q":"Ayer conocí ___ tus padres.","a":"a","ex":"Personal a.","en":"I met your parents yesterday."},{"id":"cp2-22","type":"mc","q":"Salgo a correr ___ la tarde.","opts":["por","a","en"],"c":0,"ex":"por la tarde.","en":"I go running in the afternoon."}]},{"name":"Subjunctive","items":[{"id":"cp2-23","type":"gap","q":"Es importante que ___ la verdad. (decir, tú)","a":"digas","ex":"decir → digas.","en":"It's important that you tell the truth."},{"id":"cp2-24","type":"gap","q":"Cuando ___ a casa, te llamo. (llegar, yo)","a":"llegue","ex":"Cuando + future idea.","en":"When I get home, I'll call you."},{"id":"cp2-25","type":"mc","q":"Creo que Ana ___ razón.","opts":["tiene","tenga","teng
