<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español B1</title>
<style>
/* Palette after the layout example: cream paper, burgundy, saffron. */
:root {
  color-scheme: light dark;
  --bg: #fdf4e3;
  --surface: #fffbf2;
  --surface-2: #f8e8cb;
  --text: #2e1a14;
  --muted: #6f5a4c;
  --line: #eed9b4;
  --wine: #6b1426;
  --wine-text: #ffffff;
  --gold: #f5b325;
  --gold-text: #2e1a14;
  --gold-soft: #fdeac0;
  --link: #6b1426;
  --ok: #1d7a46;
  --ok-bg: #e0f3e7;
  --almost: #8f5e00;
  --almost-bg: #fdefcf;
  --bad: #b3261e;
  --bad-bg: #fbe3e1;
  --tab-h: 56px;
  --serif: Georgia, 'Times New Roman', serif;
  --script: 'Snell Roundhand', 'Savoye LET', 'Brush Script MT', 'Segoe Script', cursive;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1311;
    --surface: #2a1c18;
    --surface-2: #3a2a23;
    --text: #f8ecd9;
    --muted: #c4b19e;
    --line: #4a372d;
    --wine: #8e2a3f;
    --wine-text: #fff5f0;
    --gold: #f0b02c;
    --gold-text: #231510;
    --gold-soft: #4a3515;
    --link: #f3bd52;
    --ok: #6fd39a;
    --ok-bg: #173526;
    --almost: #f0c05a;
    --almost-bg: #3d2f0f;
    --bad: #f28b82;
    --bad-bg: #431d1a;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, system-ui, sans-serif;
  overflow-x: hidden;
  touch-action: manipulation;
}

#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; }

h1 { font: 700 30px/1.15 var(--serif); color: var(--link); margin: 8px 0 12px; }
p { margin: 0 0 12px; }

button, a.btn { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
[hidden] { display: none !important; }

.es { font-size: 1.08em; }

.page {
  padding: calc(16px + env(safe-area-inset-top)) 16px
    calc(var(--tab-h) + 32px + env(safe-area-inset-bottom));
}
.page.end { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

.muted, .subtitle { color: var(--muted); }
.hint { margin: 10px 0 0; font-size: 14px; }
.version { margin-top: 24px; font-size: 13px; }
.warning { color: var(--bad); }
.status { min-height: 22px; margin: 4px 0 0; }

/* Icons */
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-circle { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; flex: none; }
.icon-circle.wine { background: var(--wine); color: var(--wine-text); }
.icon-circle.gold { background: var(--gold); color: var(--gold-text); }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
  background: var(--gold); color: var(--gold-text);
  font: 700 14px/1 var(--serif);
}
.dotted { display: block; border-top: 2px dotted var(--gold); margin: 8px 0; }

/* Tab bar */
.tabbar {
  position: fixed;
  inset: auto 0 0 0;
  display: flex;
  justify-content: center;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 5;
}
.tab {
  flex: 1;
  max-width: 120px;
  min-height: var(--tab-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
}
.tab.active { color: var(--link); font-weight: 600; }

/* Buttons */
.btn {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { background: var(--wine); border-color: var(--wine); color: var(--wine-text); }
.btn.accent { background: var(--gold); border-color: var(--gold); color: var(--gold-text); }
.btn.big { min-height: 62px; font-size: 18px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.45; }

/* Panels: a coloured title band over a card */
.panel { margin: 20px 0; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); overflow: hidden; }
.panel-head { margin: 0; padding: 9px 14px; font: 700 15px/1.3 var(--serif); letter-spacing: 0.02em; text-align: center; }
.panel.wine .panel-head { background: var(--wine); color: var(--wine-text); }
.panel.gold .panel-head { background: var(--gold); color: var(--gold-text); }
.panel-body { padding: 12px; }
.panel-body > p:last-child { margin-bottom: 0; }
.panel-body > .btn:last-child { margin-bottom: 0; }

/* Today */
.hero { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-height: 124px; margin-bottom: 8px; }
.hero-small { margin: 0; font: 400 26px/1 var(--script); color: var(--text); }
.hero-script { margin: 0; font: 700 54px/1.05 var(--script); color: var(--link); }
.hero-sub { margin: 2px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.bubble-note {
  position: relative;
  max-width: 42%;
  margin-top: 4px;
  padding: 9px 11px;
  border-radius: 14px;
  background: var(--gold);
  color: var(--gold-text);
  font-size: 13px;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.bubble-note::after {
  content: '';
  position: absolute;
  left: 16px;
  bottom: -8px;
  border: 8px solid transparent;
  border-top-color: var(--gold);
  border-bottom: 0;
}
.bubble-note .es { display: block; font: italic 700 15px/1.2 var(--serif); margin-bottom: 3px; }
.sprig { position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; color: var(--gold); opacity: 0.9; }
.goal { display: flex; align-items: center; gap: 12px; margin: 14px 0; color: var(--muted); }
.goal p { margin: 0; }
.ring { width: 40px; height: 40px; transform: rotate(-90deg); flex: none; }
.ring circle { fill: none; stroke-width: 3.4; }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke: var(--wine); stroke-linecap: round; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.stat { display: flex; align-items: center; gap: 10px; min-width: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; }
.stat strong { display: block; font: 700 22px/1.1 var(--serif); }
.stat span:not(.icon-circle) { display: block; color: var(--muted); font-size: 13px; line-height: 1.2; }

/* Learn */
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.module-card {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
  padding: 10px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  color: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-title { font: 700 16px/1.2 var(--serif); overflow-wrap: anywhere; flex: 1; }
.row-sub { display: block; color: var(--muted); font-size: 14px; }
.module-card .row-sub { font-size: 13px; }
.module-card .dotted { margin: 6px 0; }
.bar { display: block; height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--wine); }
.back { display: inline-block; min-height: 44px; line-height: 44px; color: var(--link); text-decoration: none; font-weight: 600; }
.list-row { padding: 9px 2px; border-bottom: 1px dotted var(--line); overflow-wrap: anywhere; }
.list-row:last-child { border-bottom: 0; }
.list-row .es { display: block; }

/* Rule card */
.rule-point { margin-top: 12px; padding: 10px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; }
.rule-title { display: flex; align-items: center; gap: 8px; font: 700 20px/1.2 var(--serif); }
.rule-ex { margin: 6px 0 0; }
.rule-ex .es { display: block; }
.rule-en { display: block; color: var(--muted); font-size: 14px; }
.watch { margin: 14px 0 0; padding: 10px 12px; background: var(--gold-soft); border-radius: 10px; }

/* Checkpoints */
.attempt { padding: 4px 0 12px; }
.attempt + .attempt { border-top: 1px dotted var(--line); padding-top: 12px; }
.attempt-head { margin-bottom: 6px; }
.attempt-head strong { font: 700 22px/1 var(--serif); }
.section-score { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 15px; }
.section-score span:last-child { flex: none; font-weight: 600; }

/* Settings */
.segmented { display: flex; gap: 6px; }
.seg { flex: 1; min-width: 0; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 4px 2px; font-size: 15px; cursor: pointer; }
.seg.active { background: var(--wine); border-color: var(--wine); color: var(--wine-text); font-weight: 600; }
.backup { display: block; width: 100%; font: 16px/1.3 ui-monospace, monospace; padding: 10px; margin-bottom: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); }

/* Session */
.session { min-height: 100dvh; }
.session-head {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(6px + env(safe-area-inset-top)) 14px 6px 4px;
  background: var(--bg);
}
.close { width: 44px; height: 44px; flex: none; border: 0; background: none; font-size: 28px; line-height: 1; color: var(--muted); cursor: pointer; }
.progress { flex: 1; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.progress div { height: 100%; background: var(--gold); transition: width 0.2s; }
.progress-count { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { padding: 8px 16px calc(32px + env(safe-area-inset-bottom)); }

.tag { display: inline-block; margin: 0 6px 8px 0; padding: 3px 9px; font-size: 13px; font-weight: 600; color: var(--gold-text); background: var(--gold-soft); border-radius: 8px; }
@media (prefers-color-scheme: dark) { .tag { color: var(--text); } }
.tag.round { background: var(--wine); color: var(--wine-text); }
.instruction { color: var(--muted); margin-bottom: 8px; }
.prompt-text { font: 700 24px/1.25 var(--serif); margin-bottom: 14px; overflow-wrap: anywhere; }
.prompt-text .es { font-size: inherit; }
.sentence {
  font: 400 21px/1.6 var(--serif);
  margin-bottom: 14px;
  padding: 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  overflow-wrap: anywhere;
}
.blank { color: var(--link); font-weight: 700; }
.setting { color: var(--muted); font-size: 14px; }

.options { display: grid; gap: 10px; counter-reset: option; }
.options.two { grid-template-columns: 1fr 1fr; }
.option {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 54px;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.option::before {
  counter-increment: option;
  content: counter(option);
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; flex: none; border-radius: 50%;
  background: var(--gold); color: var(--gold-text);
  font: 700 13px/1 var(--serif);
}
.options.two .option { justify-content: center; }
.options.two .option::before { display: none; }
.option.picked-right { border-color: var(--ok); background: var(--ok-bg); }
.option.picked-wrong { border-color: var(--bad); background: var(--bad-bg); }
.option:disabled { opacity: 1; color: inherit; }

.answer-row { display: grid; gap: 10px; }
.answer-row .btn { margin: 0; }
.answer-input {
  width: 100%;
  min-height: 52px;
  padding: 10px 14px;
  font: inherit;
  font-size: 18px;
  color: var(--text);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
}
.answer-input:disabled { opacity: 0.7; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip {
  min-height: 44px;
  padding: 8px 12px;
  border: 1.5px solid var(--line);
  border-bottom-width: 3px;
  border-radius: 12px;
  background: var(--surface);
  font-size: 17px;
  cursor: pointer;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.chip:disabled { opacity: 0.3; }
.chip.placed { background: var(--gold-soft); }
.chip.placed:disabled { opacity: 0.8; }
.tile-line { display: flex; flex-wrap: wrap; gap: 8px; min-height: 64px; padding: 8px 0; margin-bottom: 14px; border-bottom: 2px dotted var(--gold); }
.blank-slot {
  display: inline-block;
  min-width: 72px;
  min-height: 36px;
  padding: 0 8px;
  margin: 0 2px;
  vertical-align: middle;
  border: 0;
  border-bottom: 2px solid var(--link);
  background: none;
  font: inherit;
  font-weight: 700;
  color: var(--link);
}

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match-col { display: grid; gap: 8px; grid-auto-rows: 1fr; min-width: 0; }
.match-btn {
  min-height: 58px;
  padding: 8px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  font-size: 15px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.match-btn .es { font-size: 16px; }
.match-btn.selected { border-color: var(--wine); background: var(--gold-soft); }
.match-btn.matched { border-color: var(--ok); background: var(--ok-bg); opacity: 0.7; color: inherit; }
.match-btn.mismatch { border-color: var(--bad); background: var(--bad-bg); }

.spot-line { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.spot-word {
  min-height: 44px;
  padding: 6px 8px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font: 400 19px/1.2 var(--serif);
  cursor: pointer;
}
.spot-word.selected { border-color: var(--bad); background: var(--bad-bg); }
.spot-word:disabled { color: inherit; }

.chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.bubble {
  max-width: 85%;
  padding: 10px 12px;
  border: 0;
  border-radius: 16px 16px 16px 4px;
  text-align: left;
  background: var(--surface-2);
  align-self: flex-start;
  cursor: pointer;
  min-height: 44px;
}
.bubble.me { align-self: flex-end; background: var(--gold-soft); border-radius: 16px 16px 4px 16px; }
.bubble-en { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.bubble:disabled { color: inherit; }

.read-text { padding: 10px 12px; margin-bottom: 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.read-text summary { min-height: 28px; font: 700 17px/1.4 var(--serif); cursor: pointer; }
.read-text p { margin: 10px 0 0; line-height: 1.55; }

.word-card { padding: 16px; margin-bottom: 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; }
.intro-es { font: 700 30px/1.2 var(--serif); color: var(--link); margin: 6px 0 2px; overflow-wrap: anywhere; }
.intro-es .es { font-size: inherit; }
.intro-en { font-size: 19px; margin: 4px 0 10px; }
.intro-example { padding: 10px 12px; margin-bottom: 8px; background: var(--bg); border-radius: 12px; }
.word-card .muted:last-child { margin-bottom: 0; }
.sentence-en { display: block; margin-top: 3px; font-size: 14.5px; color: var(--muted); font-style: italic; }

/* Writing help */
.help-row { display: flex; justify-content: space-between; margin-top: 6px; }
.link-btn { min-height: 44px; padding: 8px 4px; border: 0; background: none; color: var(--link); font-weight: 600; font-size: 15px; cursor: pointer; }
.link-btn:disabled { opacity: 0.45; }
.feedback-rule { margin: 6px 0; padding: 10px; background: var(--surface); border-radius: 12px; font-size: 15px; }

/* Feedback panel */
.feedback {
  position: fixed;
  left: 50%;
  bottom: 0;
  width: 100%;
  max-width: 480px;
  max-height: 78dvh;
  overflow-y: auto;
  padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
  border-top: 3px solid;
  border-radius: 18px 18px 0 0;
  transform: translate(-50%, 100%);
  transition: transform 0.2s ease-out;
  z-index: 6;
}
.feedback.open { transform: translate(-50%, 0); }
.feedback p { margin-bottom: 6px; }
.feedback-label { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.feedback-answer { font-weight: 600; overflow-wrap: anywhere; }
.feedback-sentence { font-weight: 600; overflow-wrap: anywhere; }
.feedback-sentence .sentence-en { font-weight: 400; color: inherit; opacity: 0.85; }
.feedback .link-btn { min-height: 36px; padding: 2px 0; color: inherit; text-decoration: underline; display: block; }
.feedback .continue { margin: 10px 0 0; color: #fff; border: 0; }
.feedback.correct { background: var(--ok-bg); border-color: var(--ok); }
.feedback.correct .feedback-label { color: var(--ok); }
.feedback.correct .continue { background: #1d7a46; }
.feedback.almost { background: var(--almost-bg); border-color: var(--almost); }
.feedback.almost .feedback-label { color: var(--almost); }
.feedback.almost .continue { background: #8f5e00; }
.feedback.wrong { background: var(--bad-bg); border-color: var(--bad); }
.feedback.wrong .feedback-label { color: var(--bad); }
.feedback.wrong .continue { background: #b3261e; }

/* Banners */
.banner {
  position: fixed;
  left: 50%;
  top: calc(8px + env(safe-area-inset-top));
  transform: translateX(-50%);
  z-index: 10;
  max-width: calc(100% - 32px);
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
#offline-note { top: auto; bottom: calc(var(--tab-h) + 8px + env(safe-area-inset-bottom)); }
.banner.action { min-height: 44px; padding: 8px 16px; background: var(--wine); border-color: var(--wine); color: var(--wine-text); font-size: 15px; font-weight: 600; cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>
</head>

ly? I didn't know that."},{"id":"st-024","es":"Me alegro","en":"I'm glad","pos":"phrase","ex":"Me alegro mucho de verte.","exEn":"I'm very glad to see you."},{"id":"st-025","es":"Vaya","en":"Oh dear; wow","pos":"phrase","ex":"Vaya, no tengo el móvil.","exEn":"Oh dear, I don't have my phone."},{"id":"st-026","es":"Ya veo","en":"I see","pos":"phrase","ex":"Ya veo que tienes mucho trabajo.","exEn":"I see that you have a lot of work."},{"id":"st-027","es":"Claro","en":"Sure","pos":"phrase","ex":"Claro, te ayudo con la maleta.","exEn":"Sure, I'll help you with the suitcase."},{"id":"st-028","es":"Por supuesto","en":"Of course","pos":"phrase","ex":"Por supuesto, puedes venir a mi casa.","exEn":"Of course, you can come to my house."},{"id":"st-029","es":"Bueno…","en":"Well… (moving on)","pos":"phrase","ex":"Bueno, me voy a casa.","exEn":"Well, I'm going home."},{"id":"st-030","es":"Pues…","en":"Well… (thinking)","pos":"phrase","ex":"Pues no sé, voy a pensarlo.","exEn":"Well, I don't know, I'll think about it."}]},{"id":"smalltalk-3","title":"Meeting and saying goodbye","entries":[{"id":"st-031","es":"O sea","en":"I mean; in other words","pos":"phrase","ex":"Llego a las diez, o sea, en una hora.","exEn":"I'll arrive at ten, I mean, in an hour."},{"id":"st-032","es":"¡Venga!","en":"Come on! OK then!","pos":"phrase","ex":"¡Venga! Vamos al cine.","exEn":"Come on! Let's go to the cinema."},{"id":"st-033","es":"¡Nos vemos!","en":"See you!","pos":"phrase","ex":"Me voy, ¡nos vemos el lunes!","exEn":"I'm off, see you on Monday!"},{"id":"st-034","es":"Hasta luego","en":"See you later","pos":"phrase","ex":"Hasta luego, Marta, te llamo mañana.","exEn":"See you later, Marta, I'll call you tomorrow."},{"id":"st-035","es":"Que te vaya bien","en":"All the best","pos":"phrase","ex":"Adiós, Luis, que te vaya bien.","exEn":"Goodbye, Luis, all the best."},{"id":"st-036","es":"Cuídate","en":"Take care","pos":"phrase","ex":"Buen viaje y cuídate mucho.","exEn":"Have a good trip and take good car current","pos":"adj","ex":"Mi trabajo actual es muy bueno.","exEn":"My current job is very good.","note":"Not actual: that's «real»."},{"id":"ffr-007","es":"actualmente","en":"currently","pos":"adv","ex":"Actualmente vivo en Madrid.","exEn":"I currently live in Madrid.","note":"Not actually: that's «en realidad»."},{"id":"ffr-008","es":"asistir","en":"to attend","pos":"verb","ex":"Quiero asistir a la reunión.","exEn":"I want to attend the meeting.","note":"Not to assist: that's «ayudar»."},{"id":"ffr-009","es":"realizar","en":"to carry out","pos":"verb","ex":"Vamos a realizar un estudio.","exEn":"We're going to carry out a study.","note":"Not to realise: that's «darse cuenta»."},{"id":"ffr-010","es":"sensible","en":"sensitive","pos":"adj","ex":"Mi hijo es muy sensible.","exEn":"My son is very sensitive.","note":"Not sensible: that's «sensato»."},{"id":"ffr-011","es":"largo","en":"long","pos":"adj","ex":"El viaje es muy largo.","exEn":"The trip is very long.","note":"Not large: that's «grande»."},{"id":"ffr-012","es":"contestar","en":"to answer","pos":"verb","ex":"Tengo que contestar este correo.","exEn":"I have to answer this email.","note":"Not to contest."},{"id":"ffr-013","es":"recordar","en":"to remember","pos":"verb","ex":"No puedo recordar su nombre.","exEn":"I can't remember his name.","note":"Not to record: that's «grabar»."}]},{"id":"falsefriends-2","title":"Words that trick you (2)","entries":[{"id":"ffr-014","es":"pretender","en":"to try, to aim to","pos":"verb","ex":"No pretendo cambiarte.","exEn":"I'm not trying to change you.","cloze":"pretendo","note":"Not to pretend: that's «fingir»."},{"id":"ffr-015","es":"molestar","en":"to bother","pos":"verb","ex":"No quiero molestar a nadie.","exEn":"I don't want to bother anyone.","note":"Not to molest."},{"id":"ffr-016","es":"la ropa","en":"the clothes","pos":"noun","ex":"Tengo mucha ropa en la maleta.","exEn":"I have a lot of clothes in my suitcase.","note":"Not rope: that's «la cuerda»."},{"id":"ffr-017","es ,"es":"celebrar","en":"to celebrate","pos":"verb","ex":"Vamos a celebrar tu cumpleaños.","exEn":"We're going to celebrate your birthday."},{"id":"rep-186","es":"las ventajas","en":"the advantages","pos":"noun","ex":"Este trabajo tiene muchas ventajas.","exEn":"This job has many advantages."},{"id":"rep-187","es":"los inconvenientes","en":"the disadvantages","pos":"noun","ex":"Esta casa tiene inconvenientes.","exEn":"This house has disadvantages.","accept":"las desventajas"},{"id":"rep-188","es":"aprobar","en":"to pass (an exam)","pos":"verb","ex":"Quiero aprobar el examen.","exEn":"I want to pass the exam."},{"id":"rep-189","es":"suspender","en":"to fail (an exam)","pos":"verb","ex":"No quiero suspender otra vez.","exEn":"I don't want to fail again."},{"id":"rep-190","es":"buscar","en":"to look for","pos":"verb","ex":"Estoy buscando mis llaves.","exEn":"I'm looking for my keys.","cloze":"buscando"},{"id":"rep-191","es":"encontrar","en":"to find","pos":"verb","ex":"No encuentro el hotel.","exEn":"I can't find the hotel.","cloze":"encuentro"},{"id":"rep-192","es":"perder","en":"to lose","pos":"verb","ex":"No quiero perder las llaves.","exEn":"I don't want to lose the keys."},{"id":"rep-193","es":"elegir","en":"to choose","pos":"verb","ex":"Tienes que elegir uno.","exEn":"You have to choose one."},{"id":"rep-194","es":"conocer","en":"to meet (for the first time)","pos":"verb","ex":"Quiero conocer a tus padres.","exEn":"I want to meet your parents."},{"id":"rep-195","es":"volver","en":"to come back","pos":"verb","ex":"Voy a volver el lunes.","exEn":"I'm going to come back on Monday.","accept":"regresar"},{"id":"rep-196","es":"traer","en":"to bring","pos":"verb","ex":"¿Puedes traer el pan?","exEn":"Can you bring the bread?"},{"id":"rep-197","es":"esperar","en":"to wait, to hope","pos":"verb","ex":"Te voy a esperar aquí.","exEn":"I'm going to wait for you here."}]},{"id":"repaso-14","title":"Time words","entries":[{"id":"rep-198","es":"ayer","en":"yesterday","pos":"adv","ex":"Ayer fui al médico.","exEn":"Yesterday I went to the doctor."},{"id":"rep-199","es":"anoche","en":"last night","pos":"adv","ex":"Anoche dormí muy mal.","exEn":"Last night I slept very badly."},{"id":"rep-200","es":"anteayer","en":"the day before yesterday","pos":"adv","ex":"Anteayer llovió mucho.","exEn":"It rained a lot the day before yesterday."},{"id":"rep-201","es":"el fin de semana pasado","en":"last weekend","pos":"phrase","ex":"El fin de semana pasado fui a Toledo.","exEn":"Last weekend I went to Toledo."},{"id":"rep-202","es":"la semana pasada","en":"last week","pos":"phrase","ex":"La semana pasada estuve enfermo.","exEn":"Last week I was ill."},{"id":"rep-203","es":"hace dos días","en":"two days ago","pos":"phrase","ex":"Llegué hace dos días.","exEn":"I arrived two days ago."},{"id":"rep-204","es":"esta mañana","en":"this morning","pos":"phrase","ex":"Esta mañana he corrido.","exEn":"I went running this morning."},{"id":"rep-205","es":"esta semana","en":"this week","pos":"phrase","ex":"Esta semana trabajo mucho.","exEn":"I'm working a lot this week."},{"id":"rep-206","es":"mañana","en":"tomorrow","pos":"adv","ex":"Mañana voy a Madrid.","exEn":"Tomorrow I'm going to Madrid."},{"id":"rep-207","es":"pasado mañana","en":"the day after tomorrow","pos":"adv","ex":"Pasado mañana es mi cumpleaños.","exEn":"The day after tomorrow is my birthday."},{"id":"rep-208","es":"la semana que viene","en":"next week","pos":"phrase","ex":"La semana que viene voy a Bilbao.","exEn":"Next week I'm going to Bilbao.","accept":"la próxima semana"},{"id":"rep-209","es":"el mes que viene","en":"next month","pos":"phrase","ex":"El mes que viene empiezo a trabajar.","exEn":"Next month I start work.","accept":"el próximo mes"},{"id":"rep-210","es":"dentro de dos años","en":"in two years' time","pos":"phrase","ex":"Dentro de dos años quiero vivir aquí.","exEn":"In two years' time I want to live here."},{"id":"rep-211","es":"después","en":"afterwards","pos":"adv","ex":"Después vamos al cine.","exEn":"Afterwards we're going to the cinema."},{"id":"rep-212","es":"a veces","en":"sometimes","pos":"adv","ex":"A veces cocino yo.","exEn":"Sometimes I cook."},{"id":"rep-213","es":"a menudo","en":"often","pos":"adv","ex":"Voy a menudo a la playa.","exEn":"I often go to the beach."},{"id":"rep-214","es":"casi nunca","en":"hardly ever","pos":"adv","ex":"Casi nunca veo la tele.","exEn":"I hardly ever watch TV."},{"id":"rep-215","es":"lo antes posible","en":"as soon as possible","pos":"phrase","ex":"Llámame lo antes posible.","exEn":"Call me as soon as possible."},{"id":"rep-216","es":"a tiempo","en":"on time","pos":"phrase","ex":"El tren llegó a tiempo.","exEn":"The train arrived on time."}]}]}],"grammar":[{"id":"g1","title":"Verbs + prepositions","rule":{"intro":"Many Spanish verbs take a fixed preposition. Learn the verb and its preposition as one unit. People as direct objects take «a».","points":[{"title":"con","examples":[["soñar con, casarse con, contar con","dream about, marry, count on"],["Estoy de acuerdo con esa decisión.","I agree with that decision."]]},{"title":"en","examples":[["pensar en, confiar en, fijarse en, tardar en","think about, trust, notice, take time to"],["Estamos interesados en alquilar un piso.","We are interested in renting a flat."]]},{"title":"de","examples":[["depender de, acordarse de, olvidarse de, dejar de","depend on, remember, forget, stop doing"],["No me di cuenta de la hora.","I didn't notice the time."]]},{"title":"a","examples":[["aprender a, empezar a, ayudar a, volver a, ir a","learn to, start to, help to, do again, going to"],["Llegué a casa muy tarde.","I got home very late."]]},{"title":"por","examples":[["preocuparse por, interesarse por","worry about, take an interest in"],["Salgo a correr por la mañana.","I go running in the morning."]]},{"title":"Personal «a»","examples":[["He conocido a otras personas.","I've met other people."],["Ayer vi a Marta.","I saw Marta yesterday."]]}],"watch":"From your exam: interesados en (not de), soñé con (not para), de acuerdo con (not para), aprender a (not de)."},"items":[{"id":"g1-001","type":"gap","q":"Estamos interesados ___ alquilar una vivienda en el centro.","a":"en","ex":"estar interesado en = to be interested in. You wrote «de».","tags":["verb+prep"],"fromMistake":true,"en":"We are interested in renting a home in the centre."},{"id":"g1-002","type":"gap","q":"Ayer soñé ___ un viaje que hice hace muchos años.","a":"con","ex":"soñar con = to dream about. You wrote «para».","tags":["verb+prep"],"fromMistake":true,"en":"Yesterday I dreamed about a trip I took many years ago."},{"id":"g1-003","type":"gap","q":"No estoy de acuerdo ___ esa decisión.","a":"con","ex":"estar de acuerdo con = to agree with. You wrote «para».","tags":["verb+prep"],"fromMistake":true,"en":"I don't agree with that decision."},{"id":"g1-004","type":"gap","q":"Me encanta aprender ___ bailar.","a":"a","ex":"aprender a + infinitive. You wrote «de».","tags":["verb+prep"],"fromMistake":true,"en":"I love learning to dance."},{"id":"g1-005","type":"gap","q":"He trabajado ___ varios proyectos internacionales.","a":"en","ex":"trabajar en un proyecto: the preposition cannot be dropped.","tags":["verb+prep"],"fromMistake":true,"en":"I have worked on several international projects."},{"id":"g1-006","type":"gap","q":"Vivo ___ una calle muy tranquila.","a":"en","ex":"vivir en + place.","tags":["place+time"],"fromMistake":true,"en":"I live on a very quiet street."},{"id":"g1-007","type":"gap","q":"Llegamos a las nueve de la mañana ___ la estación central.","a":"a","ex":"llegar a + place, never «llegar en».","tags":["place+time"],"fromMistake":true,"en":"We arrived at the central station at nine in the morning."},{"id":"g1-008","type":"mc","q":"El móvil está ___ la mesa.","opts":["encima de","con","a"],"c":0,"ex":"encima de (or sobre) = on top of.","tags":["place+time"],"fromMistake":true,"en":"The phone is on top of the table."},{"id":"g1-009","type":"gap","q":"Voy al trabajo ___ metro todos los días.","a":"en","ex":"en + transport: en metro, en tren, en coche.","tags":["place+time"],"fromMistake":true,"en":"I go to work by metro every day."},{"id":"g1-010","type":"gap","q":"Hablé ___ mi jefe sobre el proyecto.","a":"con","ex":"hablar con alguien = to talk to someone.","tags":["verb+prep"],"fromMistake":true,"en":"I talked to my boss about the project."},{"id":"g1-011","type":"gap","q":"Hablé con mi jefe ___ el proyecto.","a":"sobre|del","ex":"hablar sobre algo = to talk about something. «de» needs «del».","tags":["verb+prep"],"fromMistake":true,"en":"I talked to my boss about the project."},{"id":"g1-012","type":"mc","q":"Salgo a correr ___ la mañana.","opts":["por","a","en"],"c":0,"ex":"por la mañana, not «a la mañana».","tags":["place+time"],"fromMistake":true,"en":"I go running in the morning."},{"id":"g1-013","type":"gap","q":"Después ___ viaje, volví a trabajar.","a":"del","ex":"después de + el = después del.","tags":["place+time"],"fromMistake":true,"en":"After the trip, I went back to work."},{"id":"g1-014","type":"gap","q":"Me voy a vivir a Madrid ___ dos años.","a":"dentro de|en","ex":"dentro de + time = in (a future time).","tags":["place+time"],"fromMistake":true,"en":"I'm moving to Madrid in two years."},{"id":"g1-015","type":"gap","q":"Voy ___ la playa todos los domingos.","a":"a","ex":"ir a + place, not «en».","tags":["place+time"],"fromMistake":true,"en":"I go to the beach every Sunday."},{"id":"g1-016","type":"gap","q":"Ayer llegué ___ casa muy tarde.","a":"a","ex":"llegar a casa.","tags":["place+time"],"fromMistake":true,"en":"Yesterday I got home very late."},{"id":"g1-017","type":"gap","q":"¿Vas ___ venir a la cena del viernes?","a":"a","ex":"ir a + infinitive; do not drop the «a».","tags":["verb+prep"],"fromMistake":true,"en":"Are you going to come to dinner on Friday?"},{"id":"g1-018","type":"mc","q":"Trabajo ___ las tardes en una cafetería.","opts":["por","a","en"],"c":0,"ex":"por las tardes = in the afternoons.","tags":["place+time"],"fromMistake":true,"en":"I work in the afternoons in a café."},{"id":"g1-019","type":"gapBank","q":"Los sábados juego ___ tenis con mi hermano.","a":["al"],"bank":["al","a","en","de"],"ex":"jugar a + el = jugar al tenis.","tags":["verb+prep"],"fromMistake":true,"en":"On Saturdays I play tennis with my brother."},{"id":"g1-020","type":"gap","q":"Vivo en Madrid ___ cinco años.","a":"desde hace","ex":"desde hace + length of time, with the present tense.","tags":["place+time"],"fromMistake":true,"en":"I've been living in Madrid for five years."},{"id":"g1-021","type":"spot","q":"Estamos interesados de alquilar un piso.","wrong":2,"a":"en","opts":["en","a","con"],"ex":"estar interesado en, never «de».","tags":["verb+prep"],"fromMistake":true,"en":"We are interested in renting a flat.","full":"Estamos interesados en alquilar un piso."},{"id":"g1-022","type":"spot","q":"No estoy de acuerdo para esa decisión.","wrong":4,"a":"con","opts":["con","en","de"],"ex":"estar de acuerdo con.","tags":["verb+prep"],"fromMistake":true,"en":"I don't agree with that decision.","full":"No estoy de acuerdo con esa decisión."},{"id":"g1-023","type":"spot","q":"Ayer soñé para un viaje largo.","wrong":2,"a":"con","opts":["con","de","en"],"ex":"soñar con.","tags":["verb+prep"],"fromMistake":true,"en":"Yesterday I dreamed about a long trip.","full":"Ayer soñé con un viaje largo."},{"id":"g1-024","type":"spot","q":"Me encanta aprender de bailar.","wrong":3,"a":"a","opts":["a","en","por"],"ex":"aprender a + infinitive.","tags":["verb+prep"],"fromMistake":true,"en":"I love learning to dance.","full":"Me encanta aprender a bailar."},{"id":"g1-025","type":"spot","q":"Voy en la playa los domingos.","wrong":1,"a":"a","opts":["a","de","por"],"ex":"ir a + place.","tags":["place+time"],"fromMistake":true,"en":"I go to the beach on Sundays.","full":"Voy a la playa los domingos."},{"id":"g1-026","type":"spot","q":"Estudio a la mañana y trabajo por la tarde.","wrong":1,"a":"por","opts":["por","en","de"],"ex":"por la mañana, por la tarde.","tags":["place+time"],"fromMistake":true,"en":"I study in the morning and work in the afternoon.","full":"Estudio por la mañana y trabajo por la tarde."},{"id":"g1-027","type":"spot","q":"He trabajado varios proyectos este año.","wrong":2,"a":"en varios","opts":["en varios","de varios","a varios"],"ex":"trabajar en varios proyectos.","tags":["verb+prep"],"fromMistake":true,"en":"I've worked on several projects this year.","full":"He trabajado en varios proyectos este año."},{"id":"g1-028","type":"spot","q":"Llegué en la estación a las nueve.","wrong":1,"a":"a","opts":["a","de","por"],"ex":"llegar a + place.","tags":["place+time"],"fromMistake":true,"en":"I arrived at the station at nine.","full":"Llegué a la estación a las nueve."},{"id":"g1-029","type":"tf","q":"Estoy interesado de este trabajo.","a":false,"ex":"Should be «interesado en este trabajo».","tags":["verb+prep"],"fromMistake":true,"en":"I am interested in this job.","full":"Estoy interesado en este trabajo."},{"id":"g1-030","type":"tf","q":"He conocido a personas de muchos países.","a":true,"ex":"Correct: conocer a + people.","tags":["personal-a"],"fromMistake":true,"en":"I have met people from many countries."},{"id":"g1-031","type":"tf","q":"Llegamos en la estación a las nueve.","a":false,"ex":"Should be «llegamos a la estación».","tags":["place+time"],"fromMistake":true,"en":"We arrived at the station at nine.","full":"Llegamos a la estación a las nueve."},{"id":"g1-032","type":"tf","q":"Voy al trabajo en metro.","a":true,"ex":"Correct: en + transport.","tags":["place+time"],"fromMistake":true,"en":"I go to work by metro."},{"id":"g1-033","type":"tiles","q":"I have met other people","a":"He conocido a otras personas","distractors":["encontrado","de"],"ex":"conocer a + people. «Encontrar» means to find.","tags":["personal-a"],"fromMistake":true},{"id":"g1-034","type":"tiles","q":"I've met people from many countries","a":"He conocido a personas de muchos países","distractors":["visto","en"],"ex":"First meetings use conocer a, not ver.","tags":["personal-a"],"fromMistake":true},{"id":"g1-035","type":"tiles","q":"I'm learning to dance","a":"Estoy aprendiendo a bailar","distractors":["de","en"],"ex":"aprender a + infinitive.","tags":["verb+prep"],"fromMistake":true},{"id":"g1-036","type":"tiles","q":"I go to the beach on Sundays","a":"Los domingos voy a la playa","distractors":["en"],"ex":"ir a + place.","tags":["place+time"],"fromMistake":true},{"id":"g1-037","type":"tiles","q":"I arrive at the station at nine","a":"Llego a la estación a las nueve","distractors":["en"],"ex":"llegar a + place; a las + time.","tags":["place+time"],"fromMistake":true},{"id":"g1-038","type":"type","q":"I play tennis.","a":"Juego al tenis","ex":"jugar al + sport.","tags":["verb+prep"],"fromMistake":true},{"id":"g1-039","type":"gap","q":"Mi hermana se casa ___ su novio en junio.","a":"con","ex":"casarse con = to marry.","tags":["verb+prep"],"en":"My sister is marrying her boyfriend in June."},{"id":"g1-040","type":"mc","q":"Siempre cuento ___ mis compañeros cuando necesito ayuda.","opts":["con","en","de"],"c":0,"ex":"contar con = to count on.","tags":["verb+prep"],"en":"I always count on my colleagues when I need help."},{"id":"g1-041","type":"gap","q":"Llevo toda la semana pensando ___ ti.","a":"en","ex":"pensar en = to think about.","tags":["verb+prep"],"en":"I've been thinking about you all week."},{"id":"g1-042","type":"gapBank","q":"No confío ___ él porque me ha mentido.","a":["en"],"bank":["en","de","con","a"],"ex":"confiar en = to trust.","tags":["verb+prep"],"en":"I don't trust him because he has lied to me."},{"id":"g1-043","type":"mc","q":"¿Te has fijado ___ esa casa tan bonita?","opts":["en","de","con"],"c":0,"ex":"fijarse en = to notice.","tags":["verb+prep"],"en":"Have you noticed that beautiful house?"},{"id":"g1-044","type":"gap","q":"Hemos quedado ___ vernos a las ocho.","a":"en|para","ex":"quedar en = to agree to do something.","tags":["verb+prep"],"en":"We've agreed to meet at eight."},{"id":"g1-045","type":"gap","q":"Tardo veinte minutos ___ llegar al trabajo.","a":"en","ex":"tardar en + infinitive = to take time to.","tags":["verb+prep"],"en":"It takes me twenty minutes to get to work."},{"id":"g1-046","type":"gapBank","q":"Eso depende ___ ti.","a":["de"],"bank":["de","en","con","por"],"ex":"depender de = to depend on.","tags":["verb+prep"],"en":"That depends on you."},{"id":"g1-047","type":"gap","q":"No me acuerdo ___ su nombre.","a":"de","ex":"acordarse de = to remember.","tags":["verb+prep"],"en":"I can't remember his name."},{"id":"g1-048","type":"mc","q":"Siempre me olvido ___ cerrar la ventana.","opts":["de","a","en"],"c":0,"ex":"olvidarse de = to forget.","tags":["verb+prep"],"en":"I always forget to close the window."},{"id":"g1-049","type":"gap","q":"Se enamoró ___ una chica de Sevilla.","a":"de","ex":"enamorarse de = to fall in love with.","tags":["verb+prep"],"en":"He fell in love with a girl from Seville."},{"id":"g1-050","type":"gap","q":"No me di cuenta ___ la hora que era.","a":"de","ex":"darse cuenta de = to realise, to notice.","tags":["verb+prep"],"en":"I didn't notice what time it was."},{"id":"g1-051","type":"gap","q":"Voy a tratar ___ llegar antes de las nueve.","a":"de","ex":"tratar de + infinitive = to try to.","tags":["verb+prep"],"en":"I'm going to try to arrive before nine."},{"id":"g1-052","type":"gap","q":"He dejado ___ fumar este año.","a":"de","ex":"dejar de + infinitive = to stop doing.","tags":["verb+prep"],"en":"I've stopped smoking this year."},{"id":"g1-053","type":"gapBank","q":"Mi hijo ha empezado ___ andar.","a":["a"],"bank":["a","de","en","por"],"ex":"empezar a + infinitive.","tags":["verb+prep"],"en":"My son has started to walk."},{"id":"g1-054","type":"gap","q":"¿Me ayudas ___ llevar la maleta?","a":"a","ex":"ayudar a + infinitive.","tags":["verb+prep"],"en":"Can you help me carry the suitcase?"},{"id":"g1-055","type":"gap","q":"No quiero volver ___ cometer ese error.","a":"a","ex":"volver a + infinitive = to do again.","tags":["verb+prep"],"en":"I don't want to make that mistake again."},{"id":"g1-056","type":"mc","q":"Mañana voy ___ llamar a mi madre.","opts":["a","de","en"],"c":0,"ex":"ir a + infinitive = going to.","tags":["verb+prep"],"en":"Tomorrow I'm going to call my mother."},{"id":"g1-057","type":"gapBank","q":"Mis padres se preocupan mucho ___ mí.","a":["por"],"bank":["por","de","en","con"],"ex":"preocuparse por = to worry about.","tags":["verb+prep"],"en":"My parents worry about me a lot."},{"id":"g1-058","type":"mc","q":"Mi hermano se interesa mucho ___ la política.","opts":["por","de","a"],"c":0,"ex":"interesarse por = to take an interest in.","tags":["verb+prep"],"en":"My brother takes a great interest in politics."},{"id":"g1-059","type":"mc","q":"Pienso ___ mis amigos a menudo.","opts":["en","de","a"],"c":0,"ex":"pensar en = to think about someone.","tags":["verb+prep"],"en":"I often think about my friends."},{"id":"g1-060","type":"gap","q":"Ayer vi ___ Marta en el supermercado.","a":"a","ex":"Personal «a»: ver a + person.","tags":["personal-a"],"en":"Yesterday I saw Marta in the supermarket."},{"id":"g1-061","type":"gap","q":"Tengo que llamar ___ mi hermano esta tarde.","a":"a","ex":"Personal «a»: llamar a + person.","tags":["personal-a"],"en":"I have to call my brother this afternoon."},{"id":"g1-062","type":"tiles","q":"Yesterday I met your brother","a":"Ayer conocí a tu hermano","distractors":["de"],"ex":"Personal «a» with conocer.","tags":["personal-a"]},{"id":"g1-063","type":"tiles","q":"I agree with you","a":"Estoy de acuerdo contigo","distractors":["con","para"],"ex":"con + ti becomes contigo.","tags":["verb+prep"]},{"id":"g1-064","type":"tiles","q":"I dream about that trip","a":"Sueño con ese viaje","distractors":["para","de"],"ex":"soñar con.","tags":["verb+prep"]},{"id":"g1-065","type":"tiles","q":"I'm thinking about you","a":"Estoy pensando en ti","distractors":["de"],"ex":"pensar en.","tags":["verb+prep"]},{"id":"g1-066","type":"tiles","q":"She is interested in the flat","a":"Está interesada en el piso","distractors":["de"],"ex":"estar interesado/a en.","tags":["verb+prep"]},{"id":"g1-067","type":"tiles","q":"It depends on you","a":"Depende de ti","distractors":["en"],"ex":"depender de, unlike English «on».","tags":["verb+prep"]},{"id":"g1-068","type":"tiles","q":"I don't remember the address","a":"No me acuerdo de la dirección","distractors":["en"],"ex":"acordarse de.","tags":["verb+prep"]},{"id":"g1-069","type":"tiles","q":"I've stopped smoking","a":"He dejado de fumar","distractors":["a"],"ex":"dejar de + infinitive.","tags":["verb+prep"]},{"id":"g1-070","type":"type","q":"I dream about you.","a":"Sueño contigo","ex":"soñar con; con + ti = contigo.","tags":["verb+prep"]},{"id":"g1-071","type":"type","q":"He married Ana.","a":"Se casó con Ana|Se ha casado con Ana","ex":"casarse con: Spanish needs «con».","tags":["verb+prep"]},{"id":"g1-072","type":"type","q":"I trust you.","a":"Confío en ti","ex":"confiar en.","tags":["verb+prep"]},{"id":"g1-073","type":"type","q":"I agree with Marta.","a":"Estoy de acuerdo con Marta","ex":"estar de acuerdo con.","tags":["verb+prep"]},{"id":"g1-074","type":"type","q":"I'm going by metro.","a":"Voy en metro","ex":"en + transport.","tags":["place+time"]},{"id":"g1-075","type":"type","q":"next to the bank","a":"al lado del banco|junto al banco","ex":"al lado de + el = al lado del.","tags":["place+time"]},{"id":"g1-076","type":"type","q":"opposite the station","a":"enfrente de la estación|frente a la estación","ex":"enfrente de + place.","tags":["place+time"]},{"id":"g1-077","type":"type","q":"in two years","a":"dentro de dos años|en dos años","ex":"dentro de + future time.","tags":["place+time"]},{"id":"g1-078","type":"type","q":"two years ago","a":"hace dos años","ex":"hace + time = ago.","tags":["place+time"]},{"id":"g1-079","type":"type","q":"in the morning","a":"por la mañana","ex":"por la mañana, not «a la mañana».","tags":["place+time"]},{"id":"g1-080","type":"gap","q":"La parada está ___ de la estación. (opposite)","a":"enfrente","ex":"enfrente de = opposite.","tags":["place+time"],"en":"The stop is opposite the station."},{"id":"g1-081","type":"gap","q":"El banco está ___ de la farmacia. (next to)","a":"al lado","ex":"al lado de = next to.","tags":["place+time"],"en":"The bank is next to the pharmacy."},{"id":"g1-082","type":"mc","q":"Las llaves están ___ de la mesa. (on top of)","opts":["encima","debajo","delante"],"c":0,"ex":"encima de = on top of.","tags":["place+time"],"en":"The keys are on top of the table."},{"id":"g1-083","type":"gap","q":"Estudio español ___ hace dos años.","a":"desde","ex":"desde hace + length of time.","tags":["place+time"],"en":"I've been studying Spanish for two years."},{"id":"g1-084","type":"mc","q":"Terminé la carrera ___ tres años.","opts":["hace","desde","dentro de"],"c":0,"ex":"hace + time + past tense = ago.","tags":["place+time"],"en":"I finished my degree three years ago."},{"id":"g1-085","type":"mc","q":"Trabajo en esta empresa ___ 2021.","opts":["desde","desde hace","hace"],"c":0,"ex":"desde + a point in time; desde hace + a length.","tags":["place+time"],"en":"I've worked at this company since 2021."},{"id":"g1-086","type":"gapBank","q":"Llegué ___ Madrid ___ tren.","a":["a","en"],"bank":["a","en","de","por"],"ex":"llegar a + place; en + transport.","tags":["place+time"],"en":"I got to Madrid by train."},{"id":"g1-087","type":"gapBank","q":"Hablé ___ Marta ___ el viaje.","a":["con","sobre"],"bank":["con","sobre","a","en"],"ex":"hablar con alguien sobre algo.","tags":["verb+prep"],"en":"I talked to Marta about the trip."},{"id":"g1-088","type":"mc","q":"Nos vemos ___ las ocho.","opts":["a","en","por"],"c":0,"ex":"a las + clock time.","tags":["place+time"],"en":"See you at eight."},{"id":"g1-089","type":"mc","q":"Mi cumpleaños es ___ marzo.","opts":["en","a","de"],"c":0,"ex":"en + month.","tags":["place+time"],"en":"My birthday is in March."},{"id":"g1-090","type":"gapBank","q":"Salimos ___ casa a las siete.","a":["de"],"bank":["de","a","en","por"],"ex":"salir de + place you leave.","tags":["place+time"],"en":"We leave home at seven."},{"id":"g1-091","type":"gap","q":"Podemos ir ___ pie, está muy cerca.","a":"a","ex":"a pie = on foot; other transport takes «en».","tags":["place+time"],"en":"We can go on foot, it's very near."}]},{"id":"g2","title":"Present subjunctive","rule":{"intro":"You choose the subjunctive correctly. The forms are the weak point. Start from the yo form of the present, drop -o, and swap the ending: -ar verbs take -e, -er and -ir verbs take -a.","points":[{"title":"Regular","examples":[["hablar → hable, hables, hable, hablemos, habléis, hablen","-ar takes -e"],["comer → coma; vivir → viva","-er and -ir take -a"]]},{"title":"Stem changes","examples":[["encontrar → encuentre; poder → pueda","o→ue"],["llover → llueva","o→ue, -er takes -a"],["pensar → piense; pedir → pida","e→ie, e→i"]]},{"title":"-zc- and -g- verbs","examples":[["conocer → conozca; conducir → conduzca","yo conozco keeps its zc"],["tener → tenga; venir → venga; hacer → haga","yo tengo keeps its g"]]},{"title":"Spelling changes","examples":[["buscar → busque; llegar → llegue; utilizar → utilice","c→qu, g→gu, z→c"],["enviar → envíe","keeps the accent on í"]]},{"title":"Irregulars","examples":[["ser → sea; estar → esté; ir → vaya","learn these six"],["saber → sepa; haber → haya; dar → dé","learn these six"]]},{"title":"When to use it","examples":[["Quiero que vengas.","wish, with a new subject"],["Creo que viene.","creo que takes the indicative"],["Quiero venir.","same subject takes the infinitive"]]}],"watch":"From your exam: conocan → conozcan, encontré → encuentre, envié → envíe, llova → llueva."},"items":[{"id":"g2-001","type":"gap","q":"Espero que mis hijos ___ a tus padres. (conocer)","a":"conozcan","ex":"conocer: yo conozco → conozcan. Keep the zc.","en":"I hope my children meet your parents.","fromMistake":true},{"id":"g2-002","type":"gap","q":"Espero que ___ un buen trabajo. (encontrar, tú)","a":"encuentres","ex":"encontrar: o→ue, and -ar takes -e.","en":"I hope you find a good job.","fromMistake":true},{"id":"g2-003","type":"gap","q":"Quiero que me ___ el documento hoy. (enviar, tú)","a":"envíes","ex":"enviar keeps the accent: envíes.","en":"I want you to send me the document today.","fromMistake":true},{"id":"g2-004","type":"gap","q":"No creo que ___ mañana. (llover)","a":"llueva","ex":"llover: o→ue, and -er takes -a.","en":"I don't think it will rain tomorrow.","fromMistake":true},{"id":"g2-005","type":"mc","q":"Ojalá ___ a personas interesantes en el curso.","opts":["conozcas","conoces","conocas"],"c":0,"ex":"conocer → conozcas, with -zc-.","en":"I hope you meet interesting people on the course.","fromMistake":true},{"id":"g2-006","type":"mc","q":"Espero que Marta ___ las llaves.","opts":["encuentre","encontré","encuentra"],"c":0,"ex":"encontrar → encuentre. «Encontré» is the past tense.","en":"I hope Marta finds the keys.","fromMistake":true},{"id":"g2-007","type":"mc","q":"Es importante que ___ el correo hoy.","opts":["envíe","envié","envia"],"c":0,"ex":"envíe (subjunctive) is not envié (past).","en":"It's important that I send the email today.","fromMistake":true},{"id":"g2-008","type":"mc","q":"Es posible que ___ esta tarde.","opts":["llueva","llova","llueve"],"c":0,"ex":"llover → llueva.","en":"It may rain this afternoon.","fromMistake":true},{"id":"g2-009","type":"spot","q":"Espero que tus padres conocan a mi familia.","wrong":4,"a":"conozcan","opts":["conozcan","conocen","conozcen"],"full":"Espero que tus padres conozcan a mi familia.","ex":"-cer verbs take -zc-: conozcan.","en":"I hope your parents meet my family.","fromMistake":true},{"id":"g2-010","type":"spot","q":"Ojalá llova este fin de semana.","wrong":1,"a":"llueva","opts":["llueva","llueve","lluevo"],"full":"Ojalá llueva este fin de semana.","ex":"llover → llueva.","en":"I hope it rains this weekend.","fromMistake":true},{"id":"g2-011","type":"spot","q":"Espero que tú vayas aquí pronto.","wrong":3,"a":"vengas","opts":["vengas","vienes","vengues"],"full":"Espero que tú vengas aquí pronto.","ex":"Towards the speaker use venir: vengas.","en":"I hope you come here soon.","fromMistake":true},{"id":"g2-012","type":"tiles","q":"I hope you come soon","a":"Espero que vengas pronto","distractors":["vayas","vienes"],"ex":"venir → vengas; coming here is venir, not ir.","fromMistake":true},{"id":"g2-013","type":"gap","q":"Quiero que ___ a la fiesta. (venir, tú)","a":"vengas","ex":"venir: yo vengo → vengas.","en":"I want you to come to the party."},{"id":"g2-014","type":"gap","q":"Es mejor que ___ pronto. (salir, nosotros)","a":"salgamos","ex":"salir: yo salgo → salgamos.","en":"It's better for us to leave early."},{"id":"g2-015","type":"gap","q":"Necesito que me ___ un favor. (hacer, tú)","a":"hagas","ex":"hacer: yo hago → hagas.","en":"I need you to do me a favour."},{"id":"g2-016","type":"gap","q":"No quiero que ___ el coche aquí. (poner, vosotros)","a":"pongáis","ex":"poner: yo pongo → pongáis.","en":"I don't want you to put the car here."},{"id":"g2-017","type":"gap","q":"Espero que me ___ la verdad. (decir, tú)","a":"digas","ex":"decir: yo digo → digas.","en":"I hope you tell me the truth."},{"id":"g2-018","type":"gap","q":"Es raro que no ___ tiempo. (tener, ellos)","a":"tengan","ex":"tener: yo tengo → tengan.","en":"It's strange that they don't have time."},{"id":"g2-019","type":"gap","q":"Te pido que ___ con cuidado. (conducir, tú)","a":"conduzcas","ex":"conducir: yo conduzco → conduzcas.","en":"I'm asking you to drive carefully."},{"id":"g2-020","type":"gap","q":"Busco un piso que ___ luminoso. (ser)","a":"sea","ex":"ser → sea, irregular.","en":"I'm looking for a flat that is bright."},{"id":"g2-021","type":"gap","q":"Espero que ___ bien mañana. (estar, tú)","a":"estés","ex":"estar → estés, with an accent.","en":"I hope you are well tomorrow."},{"id":"g2-022","type":"gap","q":"No creo que ___ a la reunión. (ir, ella)","a":"vaya","ex":"ir → vaya, irregular.","en":"I don't think she'll go to the meeting."},{"id":"g2-023","type":"gap","q":"Dudo que ___ la respuesta. (saber, él)","a":"sepa","ex":"saber → sepa, irregular.","en":"I doubt he knows the answer."},{"id":"g2-024","type":"gap","q":"Es posible que ___ mucha gente. (haber)","a":"haya","ex":"haber → haya, irregular.","en":"There may be a lot of people."},{"id":"g2-025","type":"gap","q":"Quiero que me ___ tu número. (dar, tú)","a":"des","ex":"dar → des.","en":"I want you to give me your number."},{"id":"g2-026","type":"gap","q":"Espero que ___ pronto al hotel. (llegar, nosotros)","a":"lleguemos","ex":"llegar: g→gu before e.","en":"I hope we get to the hotel soon."},{"id":"g2-027","type":"gap","q":"Quiero que ___ otro restaurante. (buscar, tú)","a":"busques","ex":"buscar: c→qu before e.","en":"I want you to look for another restaurant."},{"id":"g2-028","type":"gap","q":"No quiero que ___ el móvil en clase. (utilizar, tú)","a":"utilices","ex":"utilizar: z→c before e.","en":"I don't want you to use your phone in class."},{"id":"g2-029","type":"gap","q":"Es mejor que ___ por tarjeta. (pagar, usted)","a":"pague","ex":"pagar: g→gu before e.","en":"It's better if you pay by card."},{"id":"g2-030","type":"gap","q":"Espero que ___ bien esta noche. (dormir, tú)","a":"duermas","ex":"dormir: o→ue.","en":"I hope you sleep well tonight."},{"id":"g2-031","type":"gap","q":"Quiero que ___ en mí. (pensar, tú)","a":"pienses","ex":"pensar: e→ie.","en":"I want you to think about me."},{"id":"g2-032","type":"gap","q":"No quiero que me ___ dinero. (pedir, él)","a":"pida","ex":"pedir: e→i.","en":"I don't want him to ask me for money."},{"id":"g2-033","type":"mc","q":"Espero que ___ un buen viaje.","opts":["tengas","tienes","tenas"],"c":0,"ex":"tener → tengas.","en":"I hope you have a good trip."},{"id":"g2-034","type":"mc","q":"Quiero que ___ a mi casa.","opts":["vengáis","venís","veníais"],"c":0,"ex":"venir → vengáis.","en":"I want you all to come to my house."},{"id":"g2-035","type":"mc","q":"Es necesario que ___ la verdad.","opts":["sepas","sabes","sabas"],"c":0,"ex":"saber → sepas.","en":"It's necessary for you to know the truth."},{"id":"g2-036","type":"mc","q":"No creo que ___ abierto hoy.","opts":["esté","está","estea"],"c":0,"ex":"estar → esté.","en":"I don't think it's open today."},{"id":"g2-037","type":"mc","q":"Ojalá ___ buen tiempo el domingo.","opts":["haga","hace","hacia"],"c":0,"ex":"hacer → haga.","en":"I hope the weather is good on Sunday."},{"id":"g2-038","type":"mc","q":"Espero que ___ muy feliz.","opts":["seas","eres","eras"],"c":0,"ex":"ser → seas.","en":"I hope you are very happy."},{"id":"g2-039","type":"mc","q":"Quiero que ___ al médico.","opts":["vayas","vas","ves"],"c":0,"ex":"ir → vayas.","en":"I want you to go to the doctor."},{"id":"g2-040","type":"mc","q":"Me alegra que ___ aquí.","opts":["estéis","estáis","estaríais"],"c":0,"ex":"estar → estéis.","en":"I'm glad you're all here."},{"id":"g2-041","type":"gapBank","q":"Espero que ___ pronto y que ___ la cena.","a":["lleguéis","preparéis"],"bank":["lleguéis","preparéis","llegáis","preparáis"],"ex":"Both verbs are subjunctive after «espero que».","en":"I hope you arrive soon and that you make dinner."},{"id":"g2-042","type":"gapBank","q":"No creo que ___ tiempo.","a":["haya"],"bank":["haya","hay","había","hubo"],"ex":"No creo que + subjunctive: haya.","en":"I don't think there's time."},{"id":"g2-043","type":"gapBank","q":"Ojalá me ___ el puesto.","a":["den"],"bank":["den","dan","dieron","darán"],"ex":"dar → den.","en":"I hope they give me the job."},{"id":"g2-044","type":"tiles","q":"I want you to drive","a":"Quiero que conduzcas","distractors":["conduces","conducir"],"ex":"conducir → conduzcas."},{"id":"g2-045","type":"tiles","q":"I hope it doesn't rain","a":"Espero que no llueva","distractors":["llueve","llova"],"ex":"llover → llueva."},{"id":"g2-046","type":"tiles","q":"It's better if you leave now","a":"Es mejor que salgas ahora","distractors":["sales"],"ex":"salir → salgas."},{"id":"g2-047","type":"type","q":"that they know (conocer) — subjunctive","a":"que conozcan|conozcan","ex":"conocer → conozcan."},{"id":"g2-048","type":"type","q":"that you find (encontrar, tú) — subjunctive","a":"que encuentres|encuentres","ex":"encontrar → encuentres."},{"id":"g2-049","type":"type","q":"that I send (enviar) — subjunctive","a":"que envíe|envíe","ex":"enviar → envíe."},{"id":"g2-050","type":"gapBank","q":"Antes de ___, quiero ducharme.","a":["cenar"],"bank":["cenar","que cenar","cenemos"],"ex":"Same subject: antes de + infinitive.","en":"Before having dinner, I want to have a shower.","fromMistake":true},{"id":"g2-051","type":"spot","q":"Quiero ducharme antes de que cenar.","wrong":4,"a":"(delete)","opts":["(delete)","(keep it)","y"],"full":"Quiero ducharme antes de cenar.","ex":"Same subject: antes de + infinitive, no «que».","en":"I want to have a shower before having dinner.","fromMistake":true},{"id":"g2-052","type":"gap","q":"Espero ___ un trabajo pronto. (tener, yo)","a":"tener","ex":"Same subject: espero + infinitive.","en":"I hope to have a job soon.","fromMistake":true},{"id":"g2-053","type":"mc","q":"Mi jefe quiere hablar conmigo antes de que ___ .","opts":["me vaya","me voy","irme"],"c":0,"ex":"Antes de que takes the subjunctive.","en":"My boss wants to talk to me before I leave."},{"id":"g2-054","type":"mc","q":"Creo que Pablo ___ razón.","opts":["tiene","tenga","tenías"],"c":0,"ex":"Creo que + indicative.","en":"I think Pablo is right."},{"id":"g2-055","type":"mc","q":"No creo que Pablo ___ razón.","opts":["tenga","tiene","tenía"],"c":0,"ex":"No creo que + subjunctive.","en":"I don't think Pablo is right."},{"id":"g2-056","type":"mc","q":"Pienso que este piso ___ caro.","opts":["es","sea","seas"],"c":0,"ex":"Pienso que + indicative.","en":"I think this flat is expensive."},{"id":"g2-057","type":"mc","q":"No pienso que este piso ___ caro.","opts":["sea","es","está"],"c":0,"ex":"No pienso que + subjunctive.","en":"I don't think this flat is expensive."},{"id":"g2-058","type":"mc","q":"Es verdad que ___ mucho aquí.","opts":["llueve","llueva","llover"],"c":0,"ex":"Es verdad que + indicative.","en":"It's true that it rains a lot here."},{"id":"g2-059","type":"mc","q":"No es verdad que ___ mucho aquí.","opts":["llueva","llueve","llover"],"c":0,"ex":"No es verdad que + subjunctive.","en":"It's not true that it rains a lot here."},{"id":"g2-060","type":"mc","q":"Está claro que ___ cansado.","opts":["estás","estés","estar"],"c":0,"ex":"Está claro que + indicative.","en":"It's clear that you're tired."},{"id":"g2-061","type":"mc","q":"Es importante que ___ cada día.","opts":["practiques","practicas","practicar"],"c":0,"ex":"Es importante que + subjunctive.","en":"It's important that you practise every day."},{"id":"g2-062","type":"mc","q":"Es importante ___ cada día.","opts":["practicar","practiques","practicas"],"c":0,"ex":"No new subject: es importante + infinitive.","en":"It's important to practise every day."},{"id":"g2-063","type":"mc","q":"Me alegro de que ___ bien.","opts":["estés","estás","estar"],"c":0,"ex":"Emotion + que: subjunctive.","en":"I'm glad you're well."},{"id":"g2-064","type":"mc","q":"Me alegro de ___ aquí.","opts":["estar","esté","estoy"],"c":0,"ex":"Same subject: infinitive.","en":"I'm glad to be here."},{"id":"g2-065","type":"mc","q":"Quiero ___ a Madrid este año.","opts":["ir","vaya","voy"],"c":0,"ex":"Same subject: querer + infinitive.","en":"I want to go to Madrid this year."},{"id":"g2-066","type":"mc","q":"Quiero que tú ___ a Madrid conmigo.","opts":["vayas","vas","ir"],"c":0,"ex":"New subject: querer que + subjunctive.","en":"I want you to go to Madrid with me."},{"id":"g2-067","type":"mc","q":"Ojalá ___ suerte mañana.","opts":["tengas","tienes","tener"],"c":0,"ex":"Ojalá always takes the subjunctive.","en":"I hope you're lucky tomorrow."},{"id":"g2
