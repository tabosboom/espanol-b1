<script type="module">
// Answer normalisation and checking. Pure functions, no DOM.

const STRIP = /[¿?¡!.,;:«»"()…]/g;
const ARTICLE = /^(el\/la|el|la|los|las)\s+(.+)$/;
const OPPOSITE = { el: 'la', la: 'el', los: 'las', las: 'los' };
const INDEFINITE = { el: 'un', la: 'una', los: 'unos', las: 'unas' };

function normalise(text) {
  return String(text ?? '').toLowerCase().replace(STRIP, ' ').replace(/\s+/g, ' ').trim();
}

function stripAccents(text) {
  return text.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function splitAnswers(text) {
  return String(text ?? '').split('|').map((s) => s.trim()).filter(Boolean);
}

// "liado/a de trabajo" -> ["liado de trabajo", "liada de trabajo"]
function expandGender(text) {
  const match = text.match(/([\p{L}]+)o\/a(?![\p{L}])/u);
  if (!match) return [text];
  const masculine = text.replace(match[0], `${match[1]}o`);
  const feminine = text.replace(match[0], `${match[1]}a`);
  return [text, masculine, feminine];
}

function forms(answer, pos) {
  const out = expandGender(normalise(answer));
  if (pos === 'adj') {
    for (const form of [...out]) {
      if (form.endsWith('o')) out.push(`${form.slice(0, -1)}a`);
    }
  }
  return out;
}

// Returns { result: 'correct' | 'almost' | 'wrong', answer, spelled?, withArticle? }.
// `accepted` lists the accepted answers, the first being the canonical spelling.
function gradeText(given, accepted, pos) {
  const typed = normalise(given);
  const canonical = accepted[0];
  if (!typed) return { result: 'wrong', answer: canonical };
  const bare = stripAccents(typed);

  for (const answer of accepted) {
    for (const form of forms(answer, pos)) {
      if (form === typed) return { result: 'correct', answer };
      if (stripAccents(form) === bare) return { result: 'correct', answer, spelled: answer };
    }
  }

  if (pos === 'noun') {
    for (const answer of accepted) {
      const match = normalise(answer).match(ARTICLE);
      if (!match) continue;
      const [, article, rest] = match;
      const noun = stripAccents(rest);
      if (bare === noun) return { result: 'correct', answer, withArticle: answer };
      if (article === 'el/la') {
        for (const form of ['el', 'la', 'un', 'una']) {
          if (bare === `${form} ${noun}`) return { result: 'correct', answer };
        }
        continue;
      }
      if (bare === `${INDEFINITE[article]} ${noun}`) return { result: 'correct', answer };
      const other = OPPOSITE[article];
      if (bare === `${other} ${noun}` || bare === `${INDEFINITE[other]} ${noun}`) {
        return { result: 'almost', answer };
      }
    }
  }
  return { result: 'wrong', answer: canonical };
}

// Scheduling: a word first goes through four learning rounds, then Leitner boxes.
// Pure functions, no DOM.

const INTERVALS = [0, 1, 2, 4, 8, 16];
const LEARNED_BOX = 3;
const GRADUATED = 4; // learning rounds: 0 recognise, 1 recall, 2 sentence, 3 write
const TOP_BOX = INTERVALS.length - 1;

function dateString(date = new Date()) {
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${date.getFullYear()}-${month}-${day}`;
}

function addDays(day, count) {
  const [y, m, d] = day.split('-').map(Number);
  return dateString(new Date(y, m - 1, d + count));
}

function daysBetween(from, to) {
  const toDate = (s) => {
    const [y, m, d] = s.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  };
  return Math.round((toDate(to) - toDate(from)) / 86400000);
}

function newItem(day) {
  return { box: 0, due: day, seen: 0, correct: 0, wrong: 0, lastAnswer: '' };
}

function isDue(item, day) {
  return Boolean(item) && item.due <= day;
}

// The next learning round a word needs. Words answered before rounds existed
// keep their place: box 2 and up has graduated, the rest continue at round 1.
function stageOf(item) {
  if (!item) return 0;
  if (item.stage !== undefined) return item.stage;
  if (item.box >= 2) return GRADUATED;
  return item.seen > 0 ? 1 : 0;
}

function count(item, result, given) {
  item.seen += 1;
  item.lastAnswer = String(given ?? '').slice(0, 80);
  if (result === 'correct') item.correct += 1;
  else if (result === 'almost') item.correct += 0.5;
  else item.wrong += 1;
}

// One answer in a learning round. Passing the writing round moves the word
// into the boxes, due tomorrow.
function applyLearning(previous, result, given, day, round) {
  const item = { ...(previous || newItem(day)) };
  item.stage = stageOf(previous);
  count(item, result, given);
  if (result === 'correct') {
    item.stage = Math.max(item.stage, round + 1);
    if (item.stage >= GRADUATED) {
      item.box = Math.max(item.box, 1);
      item.due = addDays(day, INTERVALS[1]);
    }
  }
  return item;
}

// A correct answer on an item that is not due yet is recorded but does not
// promote it, so extra practice cannot skip the spacing.
function applyAnswer(previous, result, given, day) {
  const item = { ...(previous || newItem(day)) };
  const wasDue = item.due <= day;
  count(item, result, given);

  if (result === 'correct') {
    if (wasDue) {
      item.box = Math.min(item.box + 1, TOP_BOX);
      item.due = addDays(day, INTERVALS[item.box]);
    }
  } else if (result === 'almost') {
    if (wasDue) item.due = addDays(day, Math.max(INTERVALS[item.box], 1));
  } else {
    item.box = 1;
    item.due = addDays(day, INTERVALS[1]);
  }
  return item;
}

// Progress and settings in localStorage. Everything survives storage failures:
// if localStorage throws, the app keeps running on the in-memory copy.


const KEY = 'trainer-progress';
const SCHEMA = 1;
const SAVE_DELAY_MS = 300;
const MISTAKE_DAYS = 30;
const MISTAKE_CLEAR_STREAK = 2;

let saveTimer = null;
let storageWorks = true;

function blank() {
  return {
    schema: SCHEMA,
    startDate: dateString(),
    settings: { goalMinutes: 15, newWords: 8 },
    items: {},
    mistakes: {},
    days: {},
    conversationsDone: {},
    rulesSeen: {},
    checkpoints: {},
  };
}

function merge(saved) {
  const base = blank();
  return { ...base, ...saved, settings: { ...base.settings, ...(saved.settings || {}) } };
}

const state = blank();

function replaceState(next) {
  for (const key of Object.keys(state)) delete state[key];
  Object.assign(state, next);
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) replaceState(merge(JSON.parse(raw)));
  } catch {
    storageWorks = false;
  }
  pruneMistakes();
}

function flush() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageWorks = true;
  } catch {
    storageWorks = false;
  }
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, SAVE_DELAY_MS);
}

function isPersistent() {
  return storageWorks;
}

function dayRecord(day) {
  if (!state.days[day]) state.days[day] = { answered: 0, credit: 0, seconds: 0, newWords: 0 };
  return state.days[day];
}

function pruneMistakes() {
  const today = dateString();
  for (const [id, mistake] of Object.entries(state.mistakes)) {
    if (daysBetween(mistake.at, today) > MISTAKE_DAYS) delete state.mistakes[id];
  }
}

function trackMistake(id, moduleId, result, addOnWrong) {
  if (result === 'wrong' && addOnWrong) {
    state.mistakes[id] = { module: moduleId, at: dateString(), streak: 0 };
  } else if (result === 'correct' && state.mistakes[id]) {
    state.mistakes[id].streak += 1;
    if (state.mistakes[id].streak >= MISTAKE_CLEAR_STREAK) delete state.mistakes[id];
  }
}

function recordDay(result) {
  const record = dayRecord(dateString());
  record.answered += 1;
  record.credit += result === 'correct' ? 1 : result === 'almost' ? 0.5 : 0;
}

// Records one answer for one item id. Returns true if this was the item's first answer.
function recordAnswer(id, moduleId, result, given) {
  const previous = state.items[id];
  const firstTime = !previous || previous.seen === 0;
  state.items[id] = applyAnswer(previous, result, given, dateString());
  recordDay(result);
  trackMistake(id, moduleId, result, true);
  save();
  return firstTime;
}

// An answer in a learning round. Early rounds are for learning, so only a
// miss in the sentence or writing round goes on the Mistakes list.
function recordLearning(id, moduleId, result, given, round) {
  const previous = state.items[id];
  const firstTime = !previous || previous.seen === 0;
  state.items[id] = applyLearning(previous, result, given, dateString(), round);
  recordDay(result);
  trackMistake(id, moduleId, result, round >= 2);
  save();
  return firstTime;
}

// Saves one checkpoint attempt: { date, score, total, sections: [{ name, score, total }] }.
function saveCheckpoint(id, attempt) {
  if (!state.checkpoints[id]) state.checkpoints[id] = [];
  state.checkpoints[id].push(attempt);
  flush();
}

// Queues an item for review without counting it as answered.
function queueItem(id) {
  if (state.items[id]) return;
  state.items[id] = { box: 0, due: dateString(), seen: 0, correct: 0, wrong: 0, lastAnswer: '', stage: 0 };
  save();
}

function addSeconds(seconds) {
  dayRecord(dateString()).seconds += seconds;
  save();
}

function addNewWords(count) {
  dayRecord(dateString()).newWords += count;
  save();
}

function streak() {
  let day = dateString();
  if (!state.days[day]?.answered) day = addDays(day, -1);
  let count = 0;
  while (state.days[day]?.answered) {
    count += 1;
    day = addDays(day, -1);
  }
  return count;
}

function accuracyLastDays(days) {
  let answered = 0;
  let credit = 0;
  let day = dateString();
  for (let i = 0; i < days; i += 1) {
    answered += state.days[day]?.answered || 0;
    credit += state.days[day]?.credit || 0;
    day = addDays(day, -1);
  }
  return answered ? credit / answered : null;
}

function minutesToday() {
  return Math.round((state.days[dateString()]?.seconds || 0) / 60);
}

function isLearned(id) {
  return (state.items[id]?.box ?? 0) >= LEARNED_BOX;
}

function setSetting(name, value) {
  state.settings[name] = value;
  save();
}

function exportProgress() {
  flush();
  return JSON.stringify(state);
}

// Throws an Error with a readable message if the text is not a valid backup.
function importProgress(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    throw new Error('That text is not valid JSON. Paste the whole export.');
  }
  if (!parsed || parsed.schema !== SCHEMA || typeof parsed.items !== 'object' || parsed.items === null) {
    throw new Error('That text is not a progress export from this app.');
  }
  replaceState(merge(parsed));
  flush();
}

function resetProgress() {
  const { settings } = state;
  replaceState({ ...blank(), settings });
  flush();
}

// Renderers for every question type. Each renderer draws into `root` and calls
// `done(outcome)` exactly once:
//   { result, given, answer, spelled?, withArticle?, results? }
// `results` maps item ids to results for questions that test several items (match).


function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (value === undefined || value === null || value === false) continue;
    if (name === 'class') node.className = value;
    else if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else if (value === true) node.setAttribute(name, '');
    else node.setAttribute(name, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child !== undefined && child !== null && child !== false) node.append(child);
  }
  return node;
}

function shuffle(list) {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

const es = (text, cls = '') => el('span', { lang: 'es', class: `es ${cls}`.trim() }, text);

function promptBlock(q) {
  const block = el('div', { class: 'prompt' });
  if (q.round) block.append(el('p', { class: 'tag round' }, q.round));
  if (q.tag) block.append(el('p', { class: 'tag' }, q.tag));
  if (q.instruction) block.append(el('p', { class: 'instruction' }, q.instruction));
  if (q.prompt) {
    block.append(
      el('p', { class: 'prompt-text' }, q.promptLang === 'en' ? q.prompt : es(q.prompt))
    );
  }
  return block;
}

function answerInput(onEnter, placeholder = 'Type your answer') {
  const input = el('input', {
    class: 'answer-input',
    type: 'text',
    lang: 'es',
    placeholder,
    autocapitalize: 'off',
    autocorrect: 'off',
    spellcheck: 'false',
    autocomplete: 'off',
    enterkeyhint: 'done',
    'aria-label': 'Your answer',
    onfocus: () => setTimeout(() => input.scrollIntoView({ block: 'center' }), 300),
    onkeydown: (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        onEnter();
      }
    },
  });
  return input;
}

function checkButton(onClick, disabled = false) {
  return el('button', { class: 'btn primary', type: 'button', disabled, onclick: onClick }, 'Check');
}

function lockAll(root) {
  root.querySelectorAll('button, input').forEach((node) => {
    node.disabled = true;
  });
}

function renderMc(q, root, done) {
  root.append(promptBlock(q));
  const correct = q.opts[q.c];
  const options = el('div', { class: 'options' });
  let rightButton = null;
  shuffle(q.opts).forEach((opt) => {
    const button = el(
        'button',
        {
          class: 'option',
          type: 'button',
          onclick: (event) => {
            const isRight = opt === correct;
            lockAll(root);
            event.currentTarget.classList.add(isRight ? 'picked-right' : 'picked-wrong');
            if (!isRight) rightButton?.classList.add('picked-right');
            done({ result: isRight ? 'correct' : 'wrong', given: opt, answer: correct });
          },
        },
        q.optsLang === 'en' ? opt : es(opt)
      );
    if (opt === correct) rightButton = button;
    options.append(button);
  });
  root.append(options);
}

function renderTf(q, root, done) {
  root.append(promptBlock(q));
  const options = el('div', { class: 'options two' });
  [
    ['Verdadero', true],
    ['Falso', false],
  ].forEach(([label, value]) => {
    options.append(
      el(
        'button',
        {
          class: 'option',
          type: 'button',
          onclick: (event) => {
            const isRight = value === q.a;
            lockAll(root);
            event.currentTarget.classList.add(isRight ? 'picked-right' : 'picked-wrong');
            done({
              result: isRight ? 'correct' : 'wrong',
              given: label,
              answer: q.a ? 'Verdadero' : 'Falso',
            });
          },
        },
        es(label)
      )
    );
  });
  root.append(options);
}

function typedOutcome(input, q) {
  const outcome = gradeText(input.value, q.accepted, q.pos);
  return { ...outcome, given: input.value.trim(), answer: q.display || outcome.answer };
}

// First letter of each word, the rest as dots: "qué tal" -> "q·· t··".
function hintFor(answer) {
  const words = normalise(answer).replace(/\/\p{L}+/gu, '').split(' ');
  return words.map((word) => word[0] + '·'.repeat(Math.max(word.length - 1, 0))).join(' ');
}

// Writing help: a first-letter hint, and a way out without typing a wrong guess.
function writingHelp(q, input, giveUp) {
  if (q.exam) return null;
  const hint = el('button', {
    class: 'link-btn',
    type: 'button',
    onclick: () => {
      input.placeholder = hintFor(q.display || q.accepted[0]);
      hint.disabled = true;
      input.focus({ preventScroll: true });
    },
  }, 'Hint');
  return el('div', { class: 'help-row' }, hint, el('button', { class: 'link-btn', type: 'button', onclick: giveUp }, "I don't know"));
}

function renderType(q, root, done) {
  root.append(promptBlock(q));
  const finish = (outcome) => {
    lockAll(root);
    input.blur();
    done(outcome);
  };
  const check = () => {
    if (input.value.trim()) finish(typedOutcome(input, q));
  };
  const input = answerInput(check);
  root.append(
    el('div', { class: 'answer-row' }, input, checkButton(check)),
    writingHelp(q, input, () => finish({ result: 'wrong', given: '', answer: q.display || q.accepted[0] }))
  );
  input.focus({ preventScroll: true });
}

function splitBlanks(text) {
  return text.split('___');
}

function renderGap(q, root, done) {
  root.append(promptBlock({ ...q, prompt: null }));
  const parts = splitBlanks(q.sentence);
  const sentence = el('p', { class: 'sentence', lang: 'es' }, parts[0], el('span', { class: 'blank' }, '___'), parts[1]);
  root.append(sentence);
  const finish = (outcome) => {
    lockAll(root);
    input.blur();
    sentence.querySelector('.blank').textContent = outcome.answer;
    done(outcome);
  };
  const check = () => {
    if (input.value.trim()) finish(typedOutcome(input, q));
  };
  const input = answerInput(check);
  root.append(
    el('div', { class: 'answer-row' }, input, checkButton(check)),
    writingHelp(q, input, () => finish({ result: 'wrong', given: '', answer: q.display || q.accepted[0] }))
  );
  input.focus({ preventScroll: true });
}

function renderGapBank(q, root, done) {
  root.append(promptBlock({ ...q, prompt: null }));
  const parts = splitBlanks(q.sentence);
  const filled = new Array(parts.length - 1).fill(null);
  const sentence = el('p', { class: 'sentence', lang: 'es' });
  const bank = el('div', { class: 'chips' });
  const check = checkButton(() => {
    const given = filled.map((chip) => chip.textContent);
    const allRight = given.every(
      (text, i) => normalise(text) === normalise(splitAnswers(q.answers[i])[0])
    );
    lockAll(root);
    done({
      result: allRight ? 'correct' : 'wrong',
      given: given.join(', '),
      answer: q.answers.map((a) => splitAnswers(a)[0]).join(' … '),
    });
  }, true);

  const blanks = filled.map((_, index) =>
    el('button', {
      class: 'blank-slot',
      type: 'button',
      'aria-label': `Blank ${index + 1}`,
      onclick: () => {
        if (!filled[index]) return;
        filled[index].disabled = false;
        filled[index] = null;
        refresh();
      },
    })
  );
  parts.forEach((part, i) => {
    sentence.append(part);
    if (blanks[i]) sentence.append(blanks[i]);
  });

  function refresh() {
    blanks.forEach((blank, i) => {
      blank.textContent = filled[i] ? filled[i].textContent : '';
      blank.classList.toggle('has-word', Boolean(filled[i]));
    });
    check.disabled = filled.some((chip) => !chip);
  }

  shuffle(q.bank).forEach((word) => {
    const chip = el(
      'button',
      {
        class: 'chip',
        type: 'button',
        lang: 'es',
        onclick: () => {
          const free = filled.indexOf(null);
          if (free < 0) return;
          filled[free] = chip;
          chip.disabled = true;
          refresh();
        },
      },
      word
    );
    bank.append(chip);
  });
  refresh();
  root.append(sentence, bank, check);
}

function renderTiles(q, root, done) {
  root.append(promptBlock(q));
  const accepted = splitAnswers(q.a);
  const words = accepted[0].split(/\s+/);
  const line = el('div', { class: 'tile-line', 'aria-label': 'Your sentence' });
  const pool = el('div', { class: 'chips' });
  const check = checkButton(() => {
    const given = [...line.children].map((tile) => tile.textContent).join(' ');
    const target = stripAccents(normalise(given));
    const isRight = accepted.some((a) => stripAccents(normalise(a)) === target);
    lockAll(root);
    done({ result: isRight ? 'correct' : 'wrong', given, answer: accepted[0] });
  }, true);

  const refresh = () => {
    check.disabled = line.children.length === 0;
  };
  shuffle([...words, ...(q.distractors || [])]).forEach((word) => {
    const source = el(
      'button',
      {
        class: 'chip',
        type: 'button',
        lang: 'es',
        onclick: () => {
          source.disabled = true;
          const tile = el(
            'button',
            {
              class: 'chip placed',
              type: 'button',
              lang: 'es',
              onclick: () => {
                tile.remove();
                source.disabled = false;
                refresh();
              },
            },
            word
          );
          line.append(tile);
          refresh();
        },
      },
      word
    );
    pool.append(source);
  });
  root.append(line, pool, check);
}

function renderMatch(q, root, done) {
  root.append(promptBlock(q));
  const results = {};
  let selected = null;
  let remaining = q.pairs.length;

  const grid = el('div', { class: 'match' });
  const left = el('div', { class: 'match-col' });
  const right = el('div', { class: 'match-col' });
  grid.append(left, right);

  const pick = (button, side, id) => {
    if (selected?.button === button) {
      button.classList.remove('selected');
      selected = null;
      return;
    }
    if (!selected || selected.side === side) {
      selected?.button.classList.remove('selected');
      selected = { button, side, id };
      button.classList.add('selected');
      return;
    }
    const other = selected;
    other.button.classList.remove('selected');
    selected = null;
    const spanishId = side === 'es' ? id : other.id;
    if (other.id === id) {
      if (!results[id]) results[id] = 'correct';
      button.classList.add('matched');
      other.button.classList.add('matched');
      button.disabled = true;
      other.button.disabled = true;
      remaining -= 1;
      if (remaining === 0) {
        const missed = q.pairs.filter((pair) => results[pair.id] === 'wrong');
        done({
          result: missed.length ? 'wrong' : 'correct',
          given: '',
          answer: q.pairs.map((pair) => `${pair.es} = ${pair.en}`).join('\n'),
          results,
        });
      }
    } else {
      results[spanishId] = 'wrong';
      button.classList.add('mismatch');
      other.button.classList.add('mismatch');
      setTimeout(() => {
        button.classList.remove('mismatch');
        other.button.classList.remove('mismatch');
      }, 450);
    }
  };

  shuffle(q.pairs).forEach((pair) => {
    const button = el('button', {
      class: 'match-btn',
      type: 'button',
      onclick: () => pick(button, 'es', pair.id),
    }, es(pair.es));
    left.append(button);
  });
  shuffle(q.pairs).forEach((pair) => {
    const button = el('button', {
      class: 'match-btn',
      type: 'button',
      onclick: () => pick(button, 'en', pair.id),
    }, pair.en);
    right.append(button);
  });
  root.append(grid);
}

function renderSpot(q, root, done) {
  root.append(promptBlock({ ...q, prompt: null }));
  const words = q.sentence.split(/\s+/);
  const accepted = splitAnswers(q.a);
  const line = el('div', { class: 'spot-line', lang: 'es' });
  const fixArea = el('div', { class: 'spot-fix' });
  let chosen = null;

  const finish = (fixText) => {
    const fixOutcome = gradeText(fixText, accepted);
    const isRight = chosen === q.wrong && fixOutcome.result === 'correct';
    lockAll(root);
    done({
      result: isRight ? 'correct' : 'wrong',
      given: `${words[chosen]} → ${fixText}`,
      answer: `${words[q.wrong]} → ${accepted[0]}`,
      spelled: isRight ? fixOutcome.spelled : undefined,
    });
  };

  const showFix = () => {
    fixArea.replaceChildren();
    fixArea.append(el('p', { class: 'instruction' }, 'What should it be?'));
    if (q.opts) {
      const options = el('div', { class: 'options' });
      q.opts.forEach((opt) => {
        options.append(el('button', { class: 'option', type: 'button', onclick: () => finish(opt) }, es(opt)));
      });
      fixArea.append(options);
    } else {
      const check = () => {
        if (input.value.trim()) finish(input.value);
      };
      const input = answerInput(check, 'Type the fix');
      fixArea.append(el('div', { class: 'answer-row' }, input, checkButton(check)));
      input.focus({ preventScroll: true });
    }
  };

  words.forEach((word, index) => {
    const button = el(
      'button',
      {
        class: 'spot-word',
        type: 'button',
        onclick: () => {
          line.querySelector('.selected')?.classList.remove('selected');
          button.classList.add('selected');
          chosen = index;
          showFix();
        },
      },
      word
    );
    line.append(button);
  });
  root.append(line, fixArea);
}

function bubble(turn) {
  const english = el('span', { class: 'bubble-en', hidden: true }, turn.en || '');
  return el(
    'button',
    {
      class: `bubble ${turn.speaker}`,
      type: 'button',
      'aria-label': `${turn.es}. Tap for English.`,
      onclick: () => {
        english.hidden = !english.hidden;
      },
    },
    es(turn.es),
    english
  );
}

function renderDialogue(q, root, done) {
  root.append(promptBlock(q));
  if (q.setting) root.append(el('p', { class: 'setting' }, q.setting));
  const chat = el('div', { class: 'chat' }, q.context.map(bubble));
  root.append(chat);
  root.append(el('p', { class: 'instruction' }, 'Choose the best reply. Tap a bubble for its English.'));
  const options = el('div', { class: 'options' });
  shuffle(q.turn.options).forEach((opt) => {
    options.append(
      el(
        'button',
        {
          class: 'option',
          type: 'button',
          'data-right': opt.correct ? 'true' : null,
          onclick: (event) => {
            lockAll(options);
            event.currentTarget.classList.add(opt.correct ? 'picked-right' : 'picked-wrong');
            if (!opt.correct) options.querySelector('[data-right]')?.classList.add('picked-right');
            chat.append(bubble(q.turn));
            done({
              result: opt.correct ? 'correct' : 'wrong',
              given: opt.es,
              answer: q.turn.es,
              why: opt.why,
            });
          },
        },
        es(opt.es)
      )
    );
  });
  root.append(options);
}

function renderRead(q, root, done) {
  const text = el('details', { class: 'read-text', open: q.index === 0 });
  text.append(el('summary', {}, q.title));
  q.text.split(/\n+/).forEach((para) => text.append(el('p', { lang: 'es', class: 'es' }, para)));
  root.append(text);
  const inner = { ...q.question, instruction: `Question ${q.index + 1} of ${q.total}` };
  const render = q.question.type === 'tf' ? renderTf : renderMc;
  render(inner, root, done);
}

const RENDERERS = {
  mc: renderMc,
  tf: renderTf,
  type: renderType,
  gap: renderGap,
  gapBank: renderGapBank,
  tiles: renderTiles,
  match: renderMatch,
  spot: renderSpot,
  dialogue: renderDialogue,
  read: renderRead,
};

function renderQuestion(q, root, done) {
  RENDERERS[q.type](q, root, done);
}

// Turns content and progress into a list of session steps.
//   { kind: 'intro', ids: [id], entry }
//   { kind: 'question', ids: [...], module, question, round?, practice?, retryable? }
// `round` marks a learning round. `practice` steps are not scored against the schedule.


const BASE_MINUTES = 15;
const BASE_ITEMS = 25;
const BASE_REVIEWS = 10;
const BASE_GRAMMAR = 6;
const MATCH_MIN = 4;
const MATCH_MAX = 5;
const MODULE_PRACTICE_SIZE = 12;
const QUICK_ITEMS = 8;
const SECONDS_PER_STEP = 20;
const ROUND_NAMES = ['Recognise', 'Recall', 'In a sentence', 'Write it'];

const roundLabel = (round) => `Round ${round + 1} of 4 · ${ROUND_NAMES[round]}`;

// ---------- Content index ----------

function buildIndex(content) {
  const index = { ...content, byId: new Map() };
  for (const theme of content.themes) {
    for (const pack of theme.packs) {
      for (const entry of pack.entries) {
        index.byId.set(entry.id, { kind: 'vocab', entry, pack, theme, module: theme.id });
      }
    }
  }
  for (const mod of content.grammar) {
    for (const item of mod.items) {
      index.byId.set(item.id, { kind: 'grammar', item, mod, module: mod.id });
    }
  }
  for (const conv of content.conversations) {
    conv.turns.forEach((turn, turnIndex) => {
      if (turn.speaker === 'me') {
        index.byId.set(exchangeId(conv, turnIndex), {
          kind: 'exchange', conv, turnIndex, module: 'conversations',
        });
      }
    });
  }
  for (const text of content.reading) {
    text.questions.forEach((question, questionIndex) => {
      index.byId.set(readingId(text, questionIndex), {
        kind: 'reading', text, questionIndex, module: 'reading',
      });
    });
  }
  return index;
}

function exchangeId(conv, turnIndex) {
  return `${conv.id}#${turnIndex}`;
}

function readingId(text, questionIndex) {
  return `${text.id}#${questionIndex}`;
}

// ---------- Vocabulary exercises ----------

function pickDistractors(record, count) {
  const { entry, pack, theme } = record;
  const samePack = pack.entries.filter((e) => e.pos === entry.pos);
  const sameTheme = theme.packs.flatMap((p) => p.entries).filter((e) => e.pos === entry.pos);
  const anyInTheme = theme.packs.flatMap((p) => p.entries);
  const picked = [];
  const clashes = (e) =>
    e.id === entry.id
    || normalise(e.en) === normalise(entry.en)
    || normalise(e.es) === normalise(entry.es)
    || picked.some((p) => normalise(p.en) === normalise(e.en) || normalise(p.es) === normalise(e.es));
  for (const pool of [samePack, sameTheme, anyInTheme]) {
    for (const candidate of shuffle(pool)) {
      if (picked.length >= count) return picked;
      if (!clashes(candidate)) picked.push(candidate);
    }
  }
  return picked;
}

// Every Spanish entry in the theme with the same English also counts as right.
function acceptedFor(record) {
  const { entry, theme } = record;
  const answers = [entry.es, ...splitAnswers(entry.accept)];
  const sameMeaning = theme.packs
    .flatMap((p) => p.entries)
    .filter((e) => e.id !== entry.id && normalise(e.en) === normalise(entry.en));
  for (const other of sameMeaning) answers.push(other.es, ...splitAnswers(other.accept));
  return answers;
}

function clozeOf(entry) {
  return entry.cloze || locateInExample(entry);
}

// The part of the example sentence to blank out: the entry itself, without
// its article if the sentence uses a different determiner.
function locateInExample(entry) {
  const clean = entry.es.replace(/[¿?¡!…]/g, '').trim();
  const lower = entry.ex.toLowerCase();
  const at = lower.indexOf(clean.toLowerCase());
  if (at >= 0) return entry.ex.slice(at, at + clean.length);
  const noArticle = clean.replace(/^(el\/la|el|la|los|las)\s+/i, '');
  const noArticleAt = lower.indexOf(noArticle.toLowerCase());
  return noArticleAt >= 0 ? entry.ex.slice(noArticleAt, noArticleAt + noArticle.length) : null;
}

function exampleWithBlank(entry) {
  const cloze = clozeOf(entry);
  if (!cloze) return null;
  const at = entry.ex.indexOf(cloze);
  if (at < 0) return null;
  return { cloze, sentence: `${entry.ex.slice(0, at)}___${entry.ex.slice(at + cloze.length)}` };
}

const footer = (entry) => ({
  ex: entry.note || undefined,
  meaning: `${entry.es} = ${entry.en}`,
  completed: entry.ex,
  sentenceEn: entry.exEn,
});

function vocabMc(record, direction) {
  const { entry } = record;
  const distractors = pickDistractors(record, 3);
  if (distractors.length < 2) return vocabType(record);
  const toEnglish = direction === 'es-en';
  return {
    type: 'mc',
    instruction: toEnglish ? 'What does this mean?' : 'How do you say this in Spanish?',
    prompt: toEnglish ? entry.es : entry.en,
    promptLang: toEnglish ? 'es' : 'en',
    optsLang: toEnglish ? 'en' : 'es',
    opts: [entry, ...distractors].map((e) => (toEnglish ? e.en : e.es)),
    c: 0,
    ...footer(entry),
    completed: undefined,
    sentenceEn: undefined,
  };
}

function vocabType(record) {
  const { entry } = record;
  return {
    type: 'type',
    instruction: 'Write this in Spanish',
    prompt: entry.en,
    promptLang: 'en',
    accepted: acceptedFor(record),
    display: entry.es,
    pos: entry.pos,
    ...footer(entry),
  };
}

function vocabGap(record) {
  const { entry } = record;
  const blank = exampleWithBlank(entry);
  if (!blank || blank.cloze.split(/\s+/).length > 3) return vocabType(record);
  return {
    type: 'gap',
    instruction: `Write the missing Spanish: "${entry.en}"`,
    sentence: blank.sentence,
    accepted: [blank.cloze, ...acceptedFor(record)],
    display: blank.cloze,
    pos: entry.pos,
    ...footer(entry),
  };
}

function vocabGapBank(record) {
  const { entry } = record;
  const blank = exampleWithBlank(entry);
  if (!blank) return vocabType(record);
  const target = normalise(blank.cloze);
  const distractors = pickDistractors(record, 5)
    .map(clozeOf)
    .filter((text) => text && normalise(text) !== target);
  const bank = [...new Set(distractors)].slice(0, 3);
  if (bank.length < 2) return vocabType(record);
  return {
    type: 'gapBank',
    instruction: `Tap the missing Spanish: "${entry.en}"`,
    sentence: blank.sentence,
    bank: [blank.cloze, ...bank],
    answers: [blank.cloze],
    ...footer(entry),
  };
}

// Reviews test recall: the sentence with a word bank first, then writing.
function reviewQuestion(record) {
  const box = state.items[record.entry.id]?.box ?? 1;
  const coin = Math.random() < 0.5;
  if (box <= 1) return vocabGapBank(record);
  if (box <= 3) return coin ? vocabType(record) : vocabGapBank(record);
  return coin ? vocabType(record) : vocabGap(record);
}

function roundQuestion(record, round) {
  if (round === 0) return vocabMc(record, 'es-en');
  if (round === 1) return vocabMc(record, 'en-es');
  if (round === 2) return vocabGapBank(record);
  return vocabType(record);
}

function matchStep(records) {
  return {
    kind: 'question',
    ids: records.map((r) => r.entry.id),
    module: records[0].module,
    practice: true,
    question: {
      type: 'match',
      instruction: 'Match the pairs',
      pairs: records.map((r) => ({ id: r.entry.id, es: r.entry.es, en: r.entry.en })),
    },
  };
}

// ---------- Grammar, conversation and reading exercises ----------

// The whole correct sentence, shown with its translation after answering.
function completedSentence(item) {
  const first = (text) => splitAnswers(text)[0];
  switch (item.type) {
    case 'gap':
      return item.q.replace('___', first(item.a)).replace(/\s*\([^)]*\)\s*$/, '');
    case 'mc':
      return item.q.includes('___') ? item.q.replace('___', item.opts[item.c]).replace(/\s*\([^)]*\)\s*$/, '') : undefined;
    case 'gapBank': {
      let out = item.q;
      for (const answer of item.a) out = out.replace('___', answer);
      return out;
    }
    case 'spot':
      return item.full;
    case 'tf':
      return item.a ? item.q : item.full;
    case 'tiles':
    case 'type':
      return first(item.a);
    default:
      return undefined;
  }
}

function grammarQuestion(item) {
  const common = {
    ex: item.ex,
    tag: item.fromMistake ? 'Your mistake' : undefined,
    completed: completedSentence(item),
    sentenceEn: item.en,
  };
  switch (item.type) {
    case 'mc':
      return { type: 'mc', prompt: item.q, opts: item.opts, c: item.c, instruction: item.instruction || 'Choose the correct option', ...common };
    case 'tf':
      return { type: 'tf', prompt: item.q, a: item.a, instruction: item.instruction || 'Is this correct Spanish?', ...common };
    case 'type':
      return { type: 'type', prompt: item.q, promptLang: 'en', accepted: splitAnswers(item.a), instruction: 'Write this in Spanish', ...common };
    case 'gap':
      return { type: 'gap', sentence: item.q, accepted: splitAnswers(item.a), instruction: item.instruction || 'Fill the gap', ...common };
    case 'gapBank':
      return { type: 'gapBank', sentence: item.q, bank: item.bank, answers: item.a, instruction: item.a.length > 1 ? 'Tap the missing words' : 'Tap the missing word', ...common };
    case 'tiles':
      return { type: 'tiles', prompt: item.q, promptLang: 'en', a: item.a, distractors: item.distractors, instruction: 'Build the sentence in Spanish', ...common };
    case 'spot':
      return { type: 'spot', sentence: item.q, wrong: item.wrong, a: item.a, opts: item.opts, instruction: 'Tap the wrong word', ...common };
    default:
      throw new Error(`Unknown grammar type: ${item.type}`);
  }
}

function exchangeQuestion(conv, turnIndex, fullContext) {
  const turn = conv.turns[turnIndex];
  let start = turnIndex;
  if (fullContext) {
    start = 0;
  } else {
    while (start > 0 && conv.turns[start - 1].speaker === 'them') start -= 1;
  }
  return {
    type: 'dialogue',
    setting: conv.setting,
    context: conv.turns.slice(start, turnIndex),
    turn,
    meaning: turn.en,
  };
}

function readingQuestion(text, questionIndex) {
  const question = text.questions[questionIndex];
  return {
    type: 'read',
    title: text.title,
    text: text.text,
    index: questionIndex,
    total: text.questions.length,
    question: {
      type: question.type,
      prompt: question.q,
      opts: question.opts,
      c: question.c,
      a: question.a,
    },
    ex: question.ex,
  };
}

function stepFor(index, id) {
  const record = index.byId.get(id);
  if (!record) return null;
  const base = { kind: 'question', ids: [id], module: record.module, retryable: true };
  if (record.kind === 'vocab') return { ...base, question: reviewQuestion(record) };
  if (record.kind === 'grammar') return { ...base, question: grammarQuestion(record.item) };
  if (record.kind === 'reading') return { ...base, question: readingQuestion(record.text, record.questionIndex) };
  return { ...base, question: exchangeQuestion(record.conv, record.turnIndex, false) };
}

// ---------- Selection ----------

const isReviewable = (id, record) =>
  (record.kind === 'grammar' || (record.kind === 'vocab' && stageOf(state.items[id]) >= GRADUATED));

function dueIds(index) {
  const today = dateString();
  const due = [];
  for (const [id, record] of index.byId) {
    if (isReviewable(id, record) && isDue(state.items[id], today)) due.push(id);
  }
  return shuffle(due).sort((a, b) => state.items[a].due.localeCompare(state.items[b].due));
}

function countDueWords(index) {
  return dueIds(index).filter((id) => index.byId.get(id).kind === 'vocab').length;
}

const orderedThemes = (index) => [...index.themes].sort((a, b) => a.priority - b.priority);

// Words part-way through their rounds come first, then the next unseen words.
function nextLearningWords(index, count, entries = null) {
  const pool = entries || orderedThemes(index).flatMap((t) => t.packs.flatMap((p) => p.entries));
  const open = pool.filter((entry) => stageOf(state.items[entry.id]) < GRADUATED);
  const started = open.filter((entry) => stageOf(state.items[entry.id]) > 0);
  const rest = open.filter((entry) => stageOf(state.items[entry.id]) === 0);
  return [...started, ...rest].slice(0, count).map((entry) => entry.id);
}

function moduleAccuracy(ids) {
  let seen = 0;
  let credit = 0;
  for (const id of ids) {
    seen += state.items[id]?.seen || 0;
    credit += state.items[id]?.correct || 0;
  }
  return seen ? credit / seen : null;
}

// Weighted draw without replacement: weaker modules and real mistakes come first.
function pickGrammar(index, count, used) {
  const candidates = [];
  for (const mod of index.grammar) {
    const accuracy = moduleAccuracy(mod.items.map((item) => item.id));
    const moduleWeight = 1.2 - (accuracy ?? 0.5);
    for (const item of mod.items) {
      if (!state.items[item.id] && !used.has(item.id)) {
        candidates.push({ id: item.id, weight: moduleWeight * (item.fromMistake ? 3 : 1) });
      }
    }
  }
  const picked = [];
  while (picked.length < count && candidates.length) {
    const total = candidates.reduce((sum, c) => sum + c.weight, 0);
    let roll = Math.random() * total;
    let at = 0;
    for (; at < candidates.length - 1; at += 1) {
      roll -= candidates[at].weight;
      if (roll <= 0) break;
    }
    picked.push(candidates[at].id);
    candidates.splice(at, 1);
  }
  return picked;
}

function nextExchange(index) {
  const exchanges = [...index.byId.entries()].filter(([, r]) => r.kind === 'exchange').map(([id]) => id);
  return exchanges.find((id) => !state.items[id]) || shuffle(exchanges)[0] || null;
}

function mistakeIds(count, used) {
  const open = Object.keys(state.mistakes).filter((id) => !used.has(id));
  return shuffle(open).slice(0, count);
}

// Seen items that are not due, weakest first, to top up a short session.
function practiceIds(index, count, used) {
  const seen = [...index.byId.entries()]
    .filter(([id, r]) => isReviewable(id, r) && state.items[id]?.seen && !used.has(id))
    .map(([id]) => id);
  return shuffle(seen).sort((a, b) => state.items[a].box - state.items[b].box).slice(0, count);
}

// ---------- Learning rounds ----------

// Returns one list of steps per round. In round 1 each word's card comes just
// before the question on the previous word, so an answer never follows its own card.
function learningRounds(index, ids) {
  const records = ids.map((id) => index.byId.get(id));
  const inRound = (round) => shuffle(records.filter((r) => stageOf(state.items[r.entry.id]) <= round));
  const rounds = [];
  for (let round = 0; round < 4; round += 1) {
    const steps = [];
    let held = null;
    for (const record of inRound(round)) {
      const step = {
        kind: 'question',
        ids: [record.entry.id],
        module: record.module,
        round,
        question: { ...roundQuestion(record, round), round: roundLabel(round) },
      };
      if (round === 0) {
        steps.push({ kind: 'intro', ids: [record.entry.id], entry: record.entry, round, total: records.length });
        if (held) steps.push(held);
        held = step;
      } else {
        steps.push(step);
      }
    }
    if (held) steps.push(held);
    rounds.push(steps);
  }
  return rounds;
}

function matchFor(index, ids) {
  const records = [];
  for (const id of shuffle(ids)) {
    const record = index.byId.get(id);
    if (records.length < MATCH_MAX && !records.some((r) => normalise(r.entry.en) === normalise(record.entry.en))) {
      records.push(record);
    }
  }
  return records.length >= MATCH_MIN ? [matchStep(records)] : [];
}

function learningSteps(index, ids) {
  const [first, second, third, fourth] = learningRounds(index, ids);
  return [...first, ...second, ...matchFor(index, ids), ...third, ...fourth];
}

// ---------- Session builders ----------

const toSteps = (index, ids) => ids.map((id) => stepFor(index, id)).filter(Boolean);

function avoidRepeats(steps) {
  const queue = shuffle(steps);
  const out = [];
  while (queue.length) {
    const step = queue.shift();
    const previous = out[out.length - 1];
    if (previous && previous.ids.some((id) => step.ids.includes(id)) && queue.length) {
      queue.splice(1, 0, step);
    } else {
      out.push(step);
    }
  }
  return out;
}

// Spaces grammar and other items between the rounds rather than running one block.
function buildDailySession(index) {
  const { goalMinutes, newWords } = state.settings;
  const scale = goalMinutes / BASE_MINUTES;
  const target = Math.round(BASE_ITEMS * scale);
  const used = new Set();
  const take = (ids) => {
    const fresh = ids.filter((id) => !used.has(id));
    fresh.forEach((id) => used.add(id));
    return fresh;
  };

  const reviews = take(dueIds(index).slice(0, Math.round(BASE_REVIEWS * Math.min(scale, 1.3))));
  const wordCount = scale < 1 ? Math.min(newWords, Math.max(2, Math.round(newWords * scale * 0.7))) : newWords;
  const words = take(nextLearningWords(index, wordCount));
  const grammar = take(pickGrammar(index, Math.max(2, Math.round(BASE_GRAMMAR * scale)), used));
  const exchange = scale >= 0.6 ? take([nextExchange(index)].filter(Boolean)) : [];
  const mistakes = take(mistakeIds(scale < 1 ? 1 : 2, used));

  const counted = reviews.length + words.length * 4 + grammar.length + exchange.length + mistakes.length;
  if (counted < target) grammar.push(...take(pickGrammar(index, target - counted, used)));
  const counted2 = reviews.length + words.length * 4 + grammar.length + exchange.length + mistakes.length;
  const extra = counted2 < target ? take(practiceIds(index, target - counted2, used)) : [];

  const [first, second, third, fourth] = learningRounds(index, words);
  const fill = avoidRepeats(toSteps(index, [...grammar, ...extra]));
  const part = Math.ceil(fill.length / 3);
  return [
    ...avoidRepeats(toSteps(index, reviews)),
    ...first,
    ...fill.slice(0, part),
    ...second,
    ...toSteps(index, mistakes),
    ...matchFor(index, words),
    ...fill.slice(part, part * 2),
    ...third,
    ...toSteps(index, exchange),
    ...fill.slice(part * 2),
    ...fourth,
  ];
}

function estimateMinutes(steps) {
  return Math.max(1, Math.round((steps.length * SECONDS_PER_STEP) / 60));
}

function buildQuickReview(index) {
  const used = new Set();
  const take = (ids) => {
    const fresh = ids.filter((id) => !used.has(id));
    fresh.forEach((id) => used.add(id));
    return fresh;
  };
  const ids = take(dueIds(index).slice(0, QUICK_ITEMS));
  ids.push(...take(mistakeIds(QUICK_ITEMS - ids.length, used)));
  ids.push(...take(practiceIds(index, QUICK_ITEMS - ids.length, used)));
  ids.push(...take(pickGrammar(index, QUICK_ITEMS - ids.length, used)));
  return avoidRepeats(toSteps(index, ids));
}

function buildMistakes(index) {
  return avoidRepeats(toSteps(index, Object.keys(state.mistakes).filter((id) => index.byId.has(id))));
}

// The next words of this pack through all rounds; once all are learned, a review of the pack.
function buildPack(index, pack) {
  const words = nextLearningWords(index, state.settings.newWords, pack.entries);
  if (words.length) return learningSteps(index, words);
  return avoidRepeats(toSteps(index, pack.entries.map((entry) => entry.id)));
}

function buildGrammarPractice(index, mod) {
  const unseen = mod.items.filter((item) => !state.items[item.id]);
  const seen = shuffle(mod.items.filter((item) => state.items[item.id]))
    .sort((a, b) => state.items[a.id].box - state.items[b.id].box);
  const chosen = [...shuffle(unseen), ...seen].slice(0, MODULE_PRACTICE_SIZE);
  return shuffle(chosen.map((item) => stepFor(index, item.id)));
}

function buildConversation(conv) {
  const steps = [];
  conv.turns.forEach((turn, turnIndex) => {
    if (turn.speaker === 'me') {
      steps.push({
        kind: 'question',
        ids: [exchangeId(conv, turnIndex)],
        module: 'conversations',
        question: exchangeQuestion(conv, turnIndex, true),
      });
    }
  });
  return steps;
}

function buildReading(text) {
  return text.questions.map((_, questionIndex) => ({
    kind: 'question',
    ids: [readingId(text, questionIndex)],
    module: 'reading',
    question: readingQuestion(text, questionIndex),
  }));
}

function exchangeIds(conv) {
  return conv.turns
    .map((turn, turnIndex) => (turn.speaker === 'me' ? exchangeId(conv, turnIndex) : null))
    .filter(Boolean);
}

function readingIds(text) {
  return text.questions.map((_, questionIndex) => readingId(text, questionIndex));
}

// ---------- Checkpoints ----------

// Exam steps carry their section. Vocabulary comes from words already studied,
// falling back to the first words of the course.
function buildCheckpoint(index, checkpoint) {
  const steps = [];
  for (const section of checkpoint.sections) {
    if (section.items) {
      for (const item of section.items) {
        steps.push({ kind: 'question', ids: [item.id], section: section.name, exam: true, question: grammarQuestion(item) });
      }
    } else if (section.vocab) {
      const all = orderedThemes(index).flatMap((t) => t.packs.flatMap((p) => p.entries));
      const studied = shuffle(all.filter((e) => stageOf(state.items[e.id]) >= 2));
      const pool = [...studied, ...all.filter((e) => !studied.includes(e))].slice(0, section.vocab);
      for (const entry of pool) {
        steps.push({
          kind: 'question', ids: [entry.id], section: section.name, exam: true, question: vocabType(index.byId.get(entry.id)),
        });
      }
    } else if (section.reading) {
      const text = index.reading.find((t) => t.id === section.reading);
      text.questions.forEach((_, questionIndex) => {
        steps.push({
          kind: 'question', ids: [readingId(text, questionIndex)], section: section.name, exam: true, question: readingQuestion(text, questionIndex),
        });
      });
    }
  }
  return steps.map((step) => ({ ...step, question: { ...step.question, exam: true } }));
}

// A text label for an item id, used on the Mistakes list.
function describeItem(index, id) {
  const record = index.byId.get(id);
  if (!record) return null;
  if (record.kind === 'vocab') {
    return { title: record.entry.es, detail: record.entry.en, module: record.theme.title };
  }
  if (record.kind === 'grammar') {
    const { item } = record;
    const answer = item.type === 'mc' ? item.opts[item.c]
      : item.type === 'tf' ? (item.a ? 'Verdadero' : 'Falso')
      : item.type === 'gapBank' ? item.a.join(' … ')
      : splitAnswers(item.a)[0];
    return { title: item.q, detail: answer, module: record.mod.title };
  }
  if (record.kind === 'reading') {
    const question = record.text.questions[record.questionIndex];
    return { title: question.q, detail: question.type === 'mc' ? question.opts[question.c] : (question.a ? 'Verdadero' : 'Falso'), module: `Reading: ${record.text.title}` };
  }
  const turn = record.conv.turns[record.turnIndex];
  return { title: turn.es, detail: turn.en, module: `Conversation: ${record.conv.title}` };
}

const THEME_ICONS = {
  smalltalk: 'chat', directions: 'sign', transport: 'train', accommodation: 'bed', restaurants: 'fork',
  shops: 'bag', plans: 'calendar', everyday: 'home', problems: 'help', work: 'work', housing: 'key',

};

const TABS = [
  { id: 'today', label: 'Today', icon: 'today' },
  { id: 'learn', label: 'Learn', icon: 'book' },
  { id: 'mistakes', label: 'Mistakes', icon: 'alert' },
  { id: 'settings', label: 'Settings', icon: 'sliders' },
];

function icon(name, cls = '') {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', `icon ${cls}`.trim());
  const shape = document.createElementNS(ns, 'path');
  shape.setAttribute('d', ICONS[name] || ICONS.book);
  svg.append(shape);
  return svg;
}

const iconCircle = (name, tone = 'wine') => el('span', { class: `icon-circle ${tone}` }, icon(name));

function percent(ratio) {
  return ratio === null ? '–' : `${Math.round(ratio * 100)}%`;
}

function plural(count, one, many = `${one}s`) {
  return `${count} ${count === 1 ? one : many}`;
}

// ---------- Layout ----------

function page(tab, ...children) {
  const nav = el('nav', { class: 'tabbar', 'aria-label': 'Main' });
  for (const item of TABS) {
    nav.append(
      el(
        'a',
        { href: `#/${item.id}`, class: item.id === tab ? 'tab active' : 'tab', 'aria-current': item.id === tab ? 'page' : null },
        icon(item.icon),
        el('span', {}, item.label)
      )
    );
  }
  app.replaceChildren(el('main', { class: 'page' }, children), nav);
  window.scrollTo(0, 0);
}

function backLink(href, label) {
  return el('a', { class: 'back', href }, `‹ ${label}`);
}

// A card with a coloured title band, as on the layout example.
function panel(title, tone, ...children) {
  return el('section', { class: `panel ${tone}` }, el('h2', { class: 'panel-head' }, title), el('div', { class: 'panel-body' }, children));
}

function statTile(iconName, value, label, tone) {
  return el(
    'div',
    { class: 'stat' },
    iconCircle(iconName, tone),
    el('div', {}, el('strong', {}, String(value)), el('span', {}, label))
  );
}

function goalRing(minutes, goal) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 36 36');
  svg.setAttribute('class', 'ring');
  svg.setAttribute('aria-hidden', 'true');
  const circle = (cls, dash) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', '18');
    c.setAttribute('cy', '18');
    c.setAttribute('r', '15.9');
    c.setAttribute('class', cls);
    if (dash !== undefined) c.setAttribute('stroke-dasharray', `${dash} 100`);
    return c;
  };
  svg.append(circle('ring-bg'));
  if (minutes > 0) svg.append(circle('ring-fg', Math.min(100, (minutes / goal) * 100)));
  return svg;
}

// ---------- Today ----------

function allWordIds() {
  return index.themes.flatMap((t) => t.packs.flatMap((p) => p.entries.map((e) => e.id)));
}

function planText() {
  const day = daysBetween(state.startDate, dateString()) + 1;
  if (day > 14) return 'Two-week plan finished. Keep up with your reviews.';
  const focus = day <= 7
    ? 'Focus: priority vocabulary themes and grammar G1–G4, then Checkpoint 1.'
    : 'Focus: core B1 themes and grammar G5–G8, then Checkpoint 2.';
  return `Day ${day} of 14. Suggested: 30–60 minutes in 2–4 sessions. ${focus}`;
}

// A phrase from the words studied so far; the same one all day.
function phraseOfDay() {
  const started = allWordIds().filter((id) => state.items[id]?.seen);
  const pool = started.length ? started : allWordIds().slice(0, 20);
  const seed = [...dateString()].reduce((sum, c) => sum * 31 + c.charCodeAt(0), 7) >>> 0;
  return index.byId.get(pool[seed % pool.length])?.entry;
}

function renderToday() {
  const learned = allWordIds().filter(isLearned).length;
  const minutes = minutesToday();
  const goal = state.settings.goalMinutes;
  const phrase = phraseOfDay();
  const estimate = estimateMinutes(buildDailySession(index));
  page(
    'today',
    el(
      'header',
      { class: 'hero' },
      el('div', {}, el('p', { class: 'hero-small' }, 'Tu'), el('p', { class: 'hero-script', lang: 'es' }, 'español'), el('p', { class: 'hero-sub' }, 'From A2 to B1')),
      phrase ? el('div', { class: 'bubble-note' }, es(phrase.es), el('span', {}, phrase.en)) : null,
      icon('sprig', 'sprig')
    ),
    el('button', { class: 'btn primary big', type: 'button', onclick: () => startSession(buildDailySession(index), 'Session') }, `Start session · about ${estimate} min`),
    el('button', { class: 'btn accent', type: 'button', onclick: () => startSession(buildQuickReview(index), 'Quick review') }, '5-minute quick review'),
    el(
      'div',
      { class: 'goal' },
      goalRing(minutes, goal),
      el('p', {}, `${minutes} of ${goal} minutes today`)
    ),
    el(
      'div',
      { class: 'stats' },
      statTile('flame', streak(), 'day streak', 'gold'),
      statTile('clock', countDueWords(index), 'words due', 'wine'),
      statTile('check', learned, 'words learned', 'wine'),
      statTile('target', percent(accuracyLastDays(7)), 'accuracy this week', 'gold')
    ),
    panel('Your two weeks', 'gold', el('p', {}, planText())),
    isPersistent() ? null : el('p', { class: 'warning' }, 'This browser is blocking storage, so progress will be lost when the app closes.')
  );
}

// ---------- Learn ----------

function moduleCard(number, iconName, title, subtitle, done, total, target) {
  const body = [
    el('span', { class: 'card-top' }, el('span', { class: 'badge' }, String(number)), iconCircle(iconName, number % 2 ? 'wine' : 'gold')),
    el('span', { class: 'card-title' }, title),
    el('span', { class: 'dotted' }),
    el('span', { class: 'row-sub' }, subtitle),
    el('span', { class: 'bar' }, el('span', { style: `width:${total ? (done / total) * 100 : 0}%` })),
  ];
  return typeof target === 'string'
    ? el('a', { class: 'module-card', href: target }, body)
    : el('button', { class: 'module-card', type: 'button', onclick: target }, body);
}

function themeStats(ids) {
  const seen = ids.filter((id) => state.items[id]?.seen).length;
  const learned = ids.filter(isLearned).length;
  return { seen, learned, accuracy: moduleAccuracy(ids) };
}

const grid = (...cards) => el('div', { class: 'card-grid' }, cards);

function renderLearn() {
  const themes = [...index.themes].sort((a, b) => a.priority - b.priority);
  const lastAttempt = (id) => (state.checkpoints[id] || []).slice(-1)[0];
  page(
    'learn',
    el('h1', {}, 'Learn'),
    panel('Vocabulary', 'wine', grid(themes.map((theme, i) => {
      const ids = theme.packs.flatMap((p) => p.entries.map((e) => e.id));
      const s = themeStats(ids);
      return moduleCard(i + 1, THEME_ICONS[theme.id], theme.title, `${s.learned} of ${ids.length} learned`, s.seen, ids.length, `#/learn/theme/${theme.id}`);
    }))),
    panel('Grammar', 'gold', grid(index.grammar.map((mod, i) => {
      const ids = mod.items.map((item) => item.id);
      const s = themeStats(ids);
      return moduleCard(i + 1, mod.id === 'fix' ? 'pen' : 'book', mod.title, `${s.seen} of ${ids.length} · ${percent(s.accuracy)}`, s.seen, ids.length, `#/learn/grammar/${mod.id}`);
    }))),
    panel('Conversations', 'wine', grid(index.conversations.map((conv, i) => {
      const ids = exchangeIds(conv);
      const seen = ids.filter((id) => state.items[id]?.seen).length;
      return moduleCard(i + 1, 'chat', conv.title, state.conversationsDone[conv.id] ? `Done · ${percent(moduleAccuracy(ids))}` : 'Not finished', seen, ids.length, () => startConversation(conv));
    }))),
    panel('Reading', 'gold', index.reading.length
      ? grid(index.reading.map((text, i) => {
          const ids = readingIds(text);
          const seen = ids.filter((id) => state.items[id]?.seen).length;
          return moduleCard(i + 1, 'book', text.title, seen ? `${seen} of ${ids.length} · ${percent(moduleAccuracy(ids))}` : `${ids.length} questions`, seen, ids.length, () => startSession(buildReading(text), text.title));
        }))
      : el('p', { class: 'muted' }, 'No texts yet.')),
    panel('Checkpoints', 'wine', index.checkpoints.length
      ? grid(index.checkpoints.map((cp, i) => {
          const last = lastAttempt(cp.id);
          return moduleCard(i + 1, 'target', cp.title, last ? `Last: ${percent(last.score / last.total)}` : cp.when, last ? 1 : 0, 1, `#/learn/checkpoint/${cp.id}`);
        }))
      : el('p', { class: 'muted' }, 'No tests yet.'))
  );
}

function renderTheme(themeId) {
  const theme = index.themes.find((t) => t.id === themeId);

// ---------- Mistakes ----------

function renderMistakes() {
  const groups = new Map();
  for (const id of Object.keys(state.mistakes)) {
    const info = describeItem(index, id);
    if (!info) continue;
    if (!groups.has(info.module)) groups.set(info.module, []);
    groups.get(info.module).push(info);
  }
  const count = [...groups.values()].reduce((sum, list) => sum + list.length, 0);
  page(
    'mistakes',
    el('h1', {}, 'Mistakes'),
    count
      ? [
          el('p', { class: 'subtitle' }, `${plural(count, 'item')} from the last 30 days. An item leaves this list after 2 correct answers in a row.`),
          el('button', { class: 'btn primary', type: 'button', onclick: () => startSession(buildMistakes(index), 'Mistakes') }, 'Practise all mistakes'),
          [...groups.entries()].map(([module, list]) =>
            panel(module, 'wine', list.map((info) => el('div', { class: 'list-row' }, es(info.title), el('span', { class: 'row-sub' }, info.detail))))
          ),
        ]
      : el('p', { class: 'muted' }, 'No mistakes in the last 30 days.')
  );
}

// ---------- Settings ----------

function segmented(values, current, onChange, format = String) {
  const group = el('div', { class: 'segmented' });
  for (const value of values) {
    group.append(
      el(
        'button',
        {
          type: 'button',
          class: value === current ? 'seg active' : 'seg',
          'aria-pressed': value === current ? 'true' : 'false',
          onclick: () => {
            onChange(value);
            renderSettings();
          },
        },
        format(value)
      )
    );
  }
  return group;
}

function renderSettings() {
  const status = el('p', { class: 'status', role: 'status' });
  const exportBox = el('textarea', { class: 'backup', rows: 4, readonly: true, hidden: true, 'aria-label': 'Exported progress' });
  const importBox = el('textarea', { class: 'backup', rows: 4, placeholder: 'Paste an export here', 'aria-label': 'Progress to import', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });

  const doExport = async () => {
    const text = exportProgress();
    exportBox.value = text;
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = 'Progress copied to the clipboard.';
    } catch {
      exportBox.hidden = false;
      exportBox.select();
      status.textContent = 'Could not reach the clipboard. Copy the text below instead.';
    }
    if (navigator.share) shareButton.hidden = false;
  };
  const shareButton = el('button', {
    class: 'btn',
    type: 'button',
    hidden: true,
    onclick: () => navigator.share({ title: 'Español B1 progress', text: exportBox.value }).catch(() => {}),
  }, 'Share export');

  const doImport = () => {
    if (!importBox.value.trim()) {
      status.textContent = 'Paste an export first.';
      return;
    }
    try {
      importProgress(importBox.value.trim());
      renderSettings();
      document.querySelector('.status').textContent = 'Progress imported.';
    } catch (error) {
      status.textContent = error.message;
    }
  };

  let resetArmed = false;
  const resetButton = el('button', {
    class: 'btn danger',
    type: 'button',
    onclick: () => {
      if (!resetArmed) {
        resetArmed = true;
        resetButton.textContent = 'Tap again to erase all progress';
        return;
      }
      resetProgress();
      renderSettings();
      document.querySelector('.status').textContent = 'Progress erased.';
    },
  }, 'Reset progress');

  page(
    'settings',
    el('h1', {}, 'Settings'),
    panel('Daily goal', 'wine', segmented([5, 10, 15, 20], state.settings.goalMinutes, (v) => setSetting('goalMinutes', v), (v) => `${v} min`)),
    panel('New words per session', 'gold', segmented([5, 8, 10, 12, 15], state.settings.newWords, (v) => setSetting('newWords', v)), el('p', { class: 'muted hint' }, 'Each new word takes four rounds, so 8 words is about 32 questions.')),
    panel(
      'Backup',
      'wine',
      el('p', { class: 'muted' }, 'Progress is stored only on this phone. Export it now and then in case iOS clears the data.'),
      el('button', { class: 'btn', type: 'button', onclick: doExport }, 'Export progress'),
      shareButton,
      exportBox,
      importBox,
      el('button', { class: 'btn', type: 'button', onclick: doImport }, 'Import progress'),
      status
    ),
    panel('Reset', 'gold', resetButton),
    el('p', { class: 'muted version' }, `Content version ${index.version}`)
  );
}

// ---------- Session runner ----------

function startConversation(conv) {
  startSession(buildConversation(conv), conv.title, { conversation: conv });
}

function startSession(steps, title, extra = {}) {
  if (!steps.length) {
    showNothingToDo();
    return;
  }
  activeSession = {
    steps, title, conversation: null, checkpoint: null, ...extra, at: 0, startedAt: Date.now(), answered: 0, credit: 0, newWords: 0, missed: [], examResults: [], counted: false,
  };
  showStep();
}

function showNothingToDo() {
  page(
    'today',
    el('h1', {}, 'Nothing to practise'),
    el('p', { class: 'muted' }, 'There are no items for this right now.'),
    el('a', { class: 'btn primary', href: '#/today' }, 'Back to Today')
  );
}

function countTime(session) {
  if (session.counted) return 0;
  session.counted = true;
  const seconds = Math.round((Date.now() - session.startedAt) / 1000);
  addSeconds(seconds);
  addNewWords(session.newWords);
  return seconds;
}

function closeSession() {
  countTime(activeSession);
  activeSession = null;
  flush();
  location.hash = '#/today';
  route();
}

function sessionHeader(session) {
  return el(
    'header',
    { class: 'session-head' },
    el('button', { class: 'close', type: 'button', 'aria-label': 'Save and exit', onclick: closeSession }, '×'),
    el(
      'div',
      { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(session.steps.length), 'aria-valuenow': String(session.at) },
      el('div', { style: `width:${(session.at / session.steps.length) * 100}%` })
    ),
    el('span', { class: 'progress-count' }, `${session.at + 1}/${session.steps.length}`)
  );
}

function showStep() {
  const session = activeSession;
  if (session.at >= session.steps.length) {
    showEnd();
    return;
  }
  const step = session.steps[session.at];
  const card = el('section', { class: 'card' });
  app.replaceChildren(el('div', { class: 'session' }, sessionHeader(session), card));
  window.scrollTo(0, 0);
  if (step.kind === 'intro') {
    showIntro(step, card);
    return;
  }
  renderQuestion(step.question, card, (outcome) => onAnswered(step, outcome));
}

function nextStep() {
  activeSession.at += 1;
  showStep();
}

function showIntro(step, card) {
  const { entry } = step;
  card.append(
    el(
      'div',
      { class: 'word-card' },
      el('p', { class: 'tag round' }, `New word · ${roundLabel(0)}`),
      el('p', { class: 'intro-es' }, es(entry.es)),
      el('span', { class: 'dotted' }),
      el('p', { class: 'intro-en' }, entry.en),
      el('p', { class: 'intro-example' }, es(entry.ex), entry.exEn ? el('span', { class: 'sentence-en' }, entry.exEn) : null),
      entry.note ? el('p', { class: 'muted' }, entry.note) : null
    ),
    el('button', { class: 'btn primary', type: 'button', onclick: nextStep }, 'Continue')
  );
}

function record(step, id, result, given, session) {
  const first = step.round !== undefined
    ? recordLearning(id, step.module, result, given, step.round)
    : recordAnswer(id, step.module, result, given);
  if (first && index.byId.get(id)?.kind === 'vocab') session.newWords += 1;
}

// A missed word comes back at the end of its round. Other missed items come back
// once at the end of the session, without counting a second time.
function scheduleRetry(session, step) {
  if (step.round !== undefined) {
    const retries = step.retries || 0;
    if (retries >= MAX_ROUND_RETRIES) return;
    let last = session.at;
    for (let i = session.at + 1; i < session.steps.length; i += 1) {
      if (session.steps[i].round === step.round) last = i;
    }
    session.steps.splice(last + 1, 0, { ...step, retries: retries + 1, question: { ...step.question, tag: 'Once more' } });
  } else if (step.retryable) {
    session.steps.push({ ...step, retryable: false, again: true, question: { ...step.question, tag: 'Try again' } });
  }
}

function onAnswered(step, outcome) {
  const session = activeSession;
  if (step.exam) {
    session.examResults.push({ section: step.section, result: outcome.result, prompt: promptOf(step.question), answer: outcome.answer, given: outcome.given });
    session.answered += 1;
    nextStep();
    return;
  }
  if (!step.again && !step.practice) {
    const perId = outcome.results || Object.fromEntries(step.ids.map((id) => [id, outcome.result]));
    for (const [id, result] of Object.entries(perId)) record(step, id, result, outcome.given, session);
  } else if (step.round !== undefined) {
    record(step, step.ids[0], outcome.result, outcome.given, session);
  }
  if (!step.again && step.retries === undefined && !step.practice) {
    session.answered += 1;
    session.credit += outcome.result === 'correct' ? 1 : outcome.result === 'almost' ? 0.5 : 0;
    if (outcome.result !== 'correct') {
      session.missed.push({ prompt: promptOf(step.question), answer: outcome.answer });
    }
  }
  if (outcome.result !== 'correct') scheduleRetry(session, step);
  showFeedback(step, outcome);
}

function promptOf(q) {
  if (q.type === 'match') return 'Match the pairs';
  if (q.type === 'dialogue') return q.context[q.context.length - 1]?.es || q.setting;
  if (q.type === 'read') return q.question.prompt;
  return q.sentence || q.prompt || '';
}

const FEEDBACK_LABEL = {
  correct: 'Correct',
  almost: 'Almost: wrong article',
  wrong: 'Not quite',
};

function showFeedback(step, outcome) {
  const q = step.question;
  const answerLines = String(outcome.answer).split('\n');
  const showAnswer = outcome.result !== 'correct' && !q.completed && (!q.meaning || q.type === 'dialogue');
  const mod = index.grammar.find((m) => m.id === step.module);
  const ruleBox = mod ? el('div', { class: 'feedback-rule', hidden: true }, ruleCard(mod)) : null;
  const label = outcome.spelled ? `Correct — spelled: ${outcome.spelled}`
    : outcome.withArticle ? `Correct — with article: ${outcome.withArticle}`
    : FEEDBACK_LABEL[outcome.result];
  const go = el('button', { class: 'btn continue', type: 'button', onclick: nextStep }, 'Continue');
  const panelNode = el(
    'div',
    { class: `feedback ${outcome.result}`, role: 'status' },
    el('p', { class: 'feedback-label' }, label),
    outcome.why && outcome.result !== 'correct' ? el('p', { class: 'feedback-ex' }, outcome.why) : null,
    showAnswer ? answerLines.map((line) => el('p', { class: 'feedback-answer' }, es(line))) : null,
    q.meaning && q.type !== 'gapBank' && q.type !== 'gap' ? el('p', { class: 'feedback-ex' }, q.meaning) : null,
    q.completed
      ? el('p', { class: 'feedback-sentence' }, es(q.completed), q.sentenceEn ? el('span', { class: 'sentence-en' }, q.sentenceEn) : null)
      : null,
    q.ex ? el('p', { class: 'feedback-ex' }, q.ex) : null,
    mod ? el('button', { class: 'link-btn', type: 'button', onclick: () => { ruleBox.hidden = !ruleBox.hidden; } }, 'Show the rule') : null,
    ruleBox,
    go
  );
  document.querySelector('.session').append(panelNode);
  const card = document.querySelector('.card');
  requestAnimationFrame(() => {
    panelNode.classList.add('open');
    card.style.paddingBottom = `${panelNode.offsetHeight + 24}px`;
  });
  setTimeout(() => go.focus({ preventScroll: true }), 60);
}

function finishCheckpoint(session) {
  const sections = [];
  for (const row of session.examResults) {
    let section = sections.find((s) => s.name === row.section);
    if (!section) {
      section = { name: row.section, score: 0, total: 0 };
      sections.push(section);
    }
    section.total += 1;
    section.score += row.result === 'correct' ? 1 : row.result === 'almost' ? 0.5 : 0;
  }
  const attempt = {
    date: dateString(),
    score: sections.reduce((sum, s) => sum + s.score, 0),
    total: sections.reduce((sum, s) => sum + s.total, 0),
    sections,
  };
  saveCheckpoint(session.checkpoint.id, attempt);
  return attempt;
}

function exitButton() {
  return el('button', { class: 'btn primary', type: 'button', onclick: () => { activeSession = null; location.hash = '#/today'; route(); } }, 'Done');
}

function showEnd() {
  const session = activeSession;
  const seconds = countTime(session);
  const minutes = Math.floor(seconds / 60);
  const time = `${minutes}:${String(seconds % 60).padStart(2, '0')}`;
  if (session.checkpoint) {
    const attempt = finishCheckpoint(session);
    const attempts = state.checkpoints[session.checkpoint.id];
    const wrong = session.examResults.filter((r) => r.result !== 'correct');
    app.replaceChildren(
      el(
        'main',
        { class: 'page end' },
        el('h1', {}, `${session.title}: results`),
        panel('Score per section', 'wine', attemptCard(attempt, attempts[attempts.length - 2])),
        el('p', { class: 'muted' }, `Time: ${time}`),
        wrong.length
          ? panel('To review', 'gold', wrong.map((m) => el('div', { class: 'list-row' }, m.prompt ? es(m.prompt) : null, el('span', { class: 'row-sub' }, `${m.answer}${m.given ? ` · you: ${m.given}` : ''}`))))
          : null,
        exitButton()
      )
    );
    window.scrollTo(0, 0);
    return;
  }
  const { conversation } = session;
  if (conversation) {
    state.conversationsDone[conversation.id] = true;
    for (const phrase of conversation.phrases) {
      if (phrase[2] && index.byId.has(phrase[2])) queueItem(phrase[2]);
    }
    save();
  }
  flush();
  const score = session.answered ? session.credit / session.answered : null;
  app.replaceChildren(
    el(
      'main',
      { class: 'page end' },
      el('h1', {}, `${session.title} finished`),
      el(
        'div',
        { class: 'stats' },
        statTile('target', percent(score), 'first-try score', 'gold'),
        statTile('clock', time, 'time', 'wine'),
        statTile('check', session.newWords, 'new words', 'wine'),
        statTile('alert', session.missed.length, 'missed', 'gold')
      ),
      conversation
        ? panel('Useful phrases', 'gold', conversation.phrases.map((p) => el('div', { class: 'list-row' }, es(p[0]), el('span', { class: 'row-sub' }, p[1]))))
        : null,
      session.missed.length
        ? panel('Missed first time', 'wine', session.missed.map((m) =>
            el('div', { class: 'list-row' }, m.prompt ? es(m.prompt) : null, el('span', { class: 'row-sub' }, m.answer.replaceAll('\n', ' · ')))
          ))
        : null,
      exitButton()
    )
  );
  window.scrollTo(0, 0);
}

// ---------- Router ----------

function navigate(hash) {
  location.hash = hash;
}

function route() {
  if (activeSession) return;
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (parts[0] === 'learn' && parts[1] === 'theme') renderTheme(parts[2]);
  else if (parts[0] === 'learn' && parts[1] === 'grammar') renderGrammar(parts[2]);
  else if (parts[0] === 'learn' && parts[1] === 'checkpoint') renderCheckpoint(parts[2]);
  else if (parts[0] === 'learn') renderLearn();
  else if (parts[0] === 'mistakes') renderMistakes();
  else if (parts[0] === 'settings') renderSettings();
  else renderToday();
}

// ---------- Content and service worker ----------

async function loadJson(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(`${path}: ${response.status}`);
  return response.json();
}

async function loadContent() {
  if (window.TRAINER_CONTENT) return window.TRAINER_CONTENT;
  const manifest = await loadJson('./content/index.json');
  const [themes, grammar, conversations, reading, checkpoints] = await Promise.all([
    Promise.all(manifest.vocab.map((file) => loadJson(`./content/${file}`))),
    Promise.all(manifest.grammar.map((file) => loadJson(`./content/${file}`))),
    loadJson(`./content/${manifest.conversations}`),
    loadJson(`./content/${manifest.reading}`),
    loadJson(`./content/${manifest.checkpoints}`),
  ]);
  return { version: manifest.version, themes, grammar, conversations, reading, checkpoints };
}

function showBanner(id, text, onClick) {
  document.getElementById(id)?.remove();
  const banner = onClick
    ? el('button', { id, class: 'banner action', type: 'button', onclick: onClick }, text)
    : el('div', { id, class: 'banner', role: 'status' }, text);
  document.body.append(banner);
  return banner;
}

function registerServiceWorker() {
  if (window.TRAINER_CONTENT || !('serviceWorker' in navigator)) return;
  let reloading = false;
  let updateRequested = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (updateRequested && !reloading) {
      reloading = true;
      location.reload();
    }
  });
  const offerUpdate = (worker) => {
    showBanner('update-bar', 'Update available, tap to reload', () => {
      updateRequested = true;
      worker.postMessage({ type: 'SKIP_WAITING' });
    });
  };
  navigator.serviceWorker.register('./sw.js').then((registration) => {
    if (registration.waiting && navigator.serviceWorker.controller) offerUpdate(registration.waiting);
    registration.addEventListener('updatefound', () => {
      const worker = registration.installing;
      worker?.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(worker);
      });
    });
    registration.update().catch(() => {});
  }).catch(() => {});
  navigator.serviceWorker.ready.then(() => {
    const banner = showBanner('offline-note', 'Ready offline');
    setTimeout(() => banner.remove(), 2500);
  });
}

async function start() {
  load();
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
  });
  registerServiceWorker();
  try {
    index = buildIndex(await loadContent());
  } catch (error) {
    app.replaceChildren(
      el('main', { class: 'page' }, el('h1', {}, 'Could not load the content'), el('p', {}, 'Open the app once with a connection so it can save everything for offline use.'), el('p', { class: 'muted' }, String(error.message)))
    );
    return;
  }
  route();
}

start();
